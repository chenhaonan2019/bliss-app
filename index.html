<!doctype html>
<html lang="en">
<head>

<title>BLISS Manager</title>

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: phone-first app shell — sticky header, single scrolling column, fixed bottom tab bar, full-screen sheets for tasks */
:root{
  --bg:#F3F6EF; --surface:#FFFFFF; --sunk:#E8EEE2; --line:#D9E1D1;
  --ink:#1C2419; --muted:#626D5C; --brand:#4E6B45; --brand-ink:#FFFFFF; --matcha:#A7C06B;
  --ok:#1F8A55; --ok-bg:#DDF2E5; --warn:#B7700E; --warn-bg:#FCEBCB; --bad:#C0392F; --bad-bg:#F9DEDA; --info:#2C6A9E; --info-bg:#DCEAF6;
  --st0:#C9CFC4; --st1:#F2A93B; --st2:#2DB36F;
  --display:"Bricolage Grotesque","Figtree","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --body:"Figtree","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11160F; --surface:#1A2117; --sunk:#232B20; --line:#2F3A2B;
  --ink:#E6ECE1; --muted:#9AA592; --brand:#8DB27C; --brand-ink:#10170D; --matcha:#B9D07E;
  --ok:#5ACB8C; --ok-bg:#183626; --warn:#E9AE4E; --warn-bg:#3A2B12; --bad:#EE7A6E; --bad-bg:#3E1D19; --info:#7DB6E6; --info-bg:#172C3D;
  --st0:#3A4436; --st1:#C98A27; --st2:#249A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11160F; --surface:#1A2117; --sunk:#232B20; --line:#2F3A2B;
  --ink:#E6ECE1; --muted:#9AA592; --brand:#8DB27C; --brand-ink:#10170D; --matcha:#B9D07E;
  --ok:#5ACB8C; --ok-bg:#183626; --warn:#E9AE4E; --warn-bg:#3A2B12; --bad:#EE7A6E; --bad-bg:#3E1D19; --info:#7DB6E6; --info-bg:#172C3D;
  --st0:#3A4436; --st1:#C98A27; --st2:#249A5D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;line-height:1;margin-right:auto}
.logo .mk{width:38px;height:38px;flex:none;display:block}
.logo .tx{display:flex;flex-direction:column}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em}
.logo small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-top:3px}
.hbtn{background:color-mix(in srgb,var(--brand-ink) 16%,transparent);border:0;color:var(--brand-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flush{padding:0;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--sunk)}
.li .t{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.brand{background:var(--brand);color:var(--brand-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn:focus-visible,#ownsel,#locsel{max-width:52vw;appearance:auto;font-size:15px;padding:8px 14px}#ownsel option,#locsel option{color:#1C2419;background:#fff}
.hbtn:focus-visible,.tab:focus-visible,.li:focus-visible,.pill:focus-visible{outline:2px solid var(--matcha);outline-offset:2px}
.big{font-size:18px;min-height:58px;border-radius:16px}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatches label{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 2px;border-radius:12px;border:2px solid transparent}.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}.swatches .sw{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}.swatches small{font-size:11px;font-weight:600;color:var(--muted)}.swatches label:has(input:checked){border-color:var(--ink);background:var(--surface)}.swatches label:has(input:checked) small{color:var(--ink)}.swatches label:has(input:focus-visible){outline:2px solid var(--matcha)}
.seg.rad label{flex:1;position:relative;cursor:pointer}.seg.rad input{position:absolute;opacity:0;inset:0}.seg.rad span{display:block;text-align:center;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}.seg.rad input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}.seg.rad input:focus-visible+span{outline:2px solid var(--matcha)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 auto}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:center;min-width:52px}
.chips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chips button b{display:block;font-size:16px}
.chips button{position:relative}
.guide p{margin:6px 0}.gl{margin:6px 0 10px;padding-left:22px}.gl li{margin:4px 0;line-height:1.45}.gh{margin:14px 0 4px;font-size:15px}.gh:first-child{margin-top:0}
.gwarn{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;font-weight:600}
.gtbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}.gtbl th,.gtbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.gtbl th{background:var(--sunk);font-weight:700}
.grid-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.grid-ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}.nobk{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.chips button span{font-size:11px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--brand)}
.tab .bdg{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-height:44px}
textarea.in{min-height:80px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--matcha);border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sheet .sh h2{font-size:18px;flex:1;min-width:0}
.sheet .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .sb>.wrap{padding-block:16px 24px}
.sheet .sf{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px}
.sheet .sf .btn{flex:1}
.x{border:0;background:var(--sunk);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border-radius:12px;overflow:hidden;background:var(--sunk);border:1px dashed var(--line);aspect-ratio:4/3;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;text-align:center;padding:8px}
.tile.has{border:0;padding:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgb(0 0 0/.72));color:#fff;padding:18px 8px 6px;font-size:12px;text-align:left}
.tile .flag{position:absolute;top:6px;right:6px}
.tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tile.busy::after{content:"";position:absolute;inset:0;background:rgb(255 255 255/.5)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.thumbs img,.thumbs .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--sunk);display:block;cursor:pointer}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:inherit}
.tbl tbody tr{background:var(--surface)}
.tbl td.neg{color:var(--bad)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--st0)}
.bar i{display:block;height:100%}
.bar .b2{background:var(--st2)}.bar .b1{background:var(--st1)}
/* board (monday-style) */
.grp{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.grp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-left:6px solid var(--gc);cursor:pointer}
.grp-h h3{color:var(--gc);flex:1}
.grp-cols{display:grid;grid-template-columns:1fr 132px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 0 6px 14px;border-left:6px solid var(--gc);border-top:1px solid var(--line)}
.grp-r{display:grid;grid-template-columns:1fr 132px;align-items:stretch;border-top:1px solid var(--line);border-left:6px solid color-mix(in srgb,var(--gc) 45%,transparent)}
.grp-r .n{padding:11px 14px;font-weight:500}
.pill{border:0;border-left:1px solid var(--line);font-weight:700;font-size:13px;color:#fff;cursor:pointer;background:var(--st0)}
.pill.s0{color:var(--muted)}.pill.s1{background:var(--st1)}.pill.s2{background:var(--st2)}
.pill[disabled]{cursor:default}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.score{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.sig{width:100%;height:120px;border:1px dashed var(--line);border-radius:10px;background:var(--surface);touch-action:none;display:block}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pin button{height:62px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.pindots{display:flex;gap:12px;justify-content:center;margin:12px 0 20px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.pindots i.f{background:var(--brand)}
.cele{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgb(0 0 0/.28);overflow:hidden;animation:cfade .2s ease-out;cursor:pointer}
.cele-box{position:relative;background:var(--surface);color:var(--ink);border-radius:22px;padding:26px 30px;text-align:center;display:grid;gap:6px;justify-items:center;max-width:300px;box-shadow:0 20px 50px rgb(0 0 0/.25);animation:cpop .45s cubic-bezier(.2,1.5,.4,1)}
.cele-box b{font-family:var(--display);font-size:22px}.cele-box span{color:var(--muted);font-size:14px}
.cele-check svg{width:76px;height:76px}.cele-check circle{fill:var(--ok-bg);stroke:var(--ok);stroke-width:3}
.cele-check path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44;animation:cdraw .45s .25s ease-out forwards}
.cele i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:cfall 2s ease-in forwards}
.cele.small{background:transparent;pointer-events:none}.cele.small .cele-box{padding:18px 22px}.cele.small .cele-check svg{width:56px;height:56px}.cele.small b{font-size:18px}
@keyframes cfade{from{opacity:0}}@keyframes cpop{from{transform:scale(.6);opacity:0}}@keyframes cdraw{to{stroke-dashoffset:0}}@keyframes cfall{to{transform:translateY(112vh) rotate(620deg)}}
@media (prefers-reduced-motion: reduce){.cele,.cele *{animation:none!important}.cele-check path{stroke-dashoffset:0}.cele i{display:none}}
.drag{flex:none;width:30px;align-self:stretch;display:grid;place-items:center;cursor:grab;touch-action:none;color:var(--muted);font-size:18px;letter-spacing:-3px;user-select:none;-webkit-user-select:none;border-radius:8px}
.drag:hover{background:var(--sunk)}.dragging{box-shadow:0 12px 30px rgb(0 0 0/.2);border-radius:12px;opacity:.97;cursor:grabbing}.drag-ph{background:var(--sunk);border:2px dashed var(--line);border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0/.25)}
.viewer{position:fixed;inset:0;z-index:70;background:rgb(0 0 0/.92);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px));color:#fff;align-items:center}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:13px}
.hint.warn{background:var(--warn-bg);color:var(--warn)}
.howacc{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.howsec+.howsec{border-top:1px solid var(--line)}
.howhd{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;min-height:56px}
.howhd:hover{background:var(--sunk)}.howsec.open .howhd{background:var(--sunk)}
.howdot{width:10px;height:28px;border-radius:5px;flex:none}
.howcv{color:var(--muted);transition:transform .15s;display:flex}.howsec.open .howcv{transform:rotate(90deg)}
.howlist .li{padding-left:36px}
.trkbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.trkbar>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.trkbar i{display:block;height:6px;border-radius:3px;background:var(--line)}.trkbar .on i{background:var(--brand)}.trkbar .cur i{animation:trkp 1.6s ease-in-out infinite}
.trkbar span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trkbar .cur span{color:var(--ink);font-weight:700}
@keyframes trkp{50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.trkbar .cur i{animation:none}}
details.std summary{cursor:pointer;font-size:13px;color:var(--info);font-weight:600}
details.std ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.evarea{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:start}
.clock{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>


<header class="top"><div class="wrap" id="hdr"><div class="logo"><img class="mk" src="logo-mark.png" alt=""><span class="tx"><b>BLISS</b><small>Matcha &amp; Beyond</small></span></div></div></header>
<main><div class="wrap" id="view"><div class="empty"><b>Loading…</b>Connecting to the shop data</div></div></main>
<nav class="tabs" id="nav" hidden><div class="in" id="navin"></div></nav>
<div id="sheet"></div>
<div id="viewer"></div>
<div id="toast"></div>

const ALLDAYS=[0,1,2,3,4,5,6];
function defaultTasks(){const s=D.settings,sl=D.slots||{};const cp=l=>(l||[]).map(x=>({id:x.id,name:x.name,photo:true}));

const C=()=>{const L=curLoc(),o={};Object.values(D.counts).forEach(c=>{if((c.loc||'wh')===L)o[c.date]=c});return o};

const seePay=()=>isOwner&&!UI.pv;
const wageOf=e=>({pay:num(D.wages[e])||0,cash:num(D.cashRates?.[e])||0,cap:num(D.payCaps?.[e]),ccap:null});
// Training pay: its own rate while someone is training (until the end date, or while their role is Trainee if no date).
const trainOf=e=>({rate:num(D.trainRates?.[e])||0,via:D.trainVia?.[e]==='cash'?'cash':'payroll',until:D.trainUntil?.[e]||''});
const inTraining=(e,date)=>{const t=trainOf(e);if(!t.rate)return false;return t.until?date<=t.until:D.employees[e]?.role==='Trainee'};
function splitHrs(h,W_){if(!W_.cash)return[h,0];if(!W_.pay)return[0,h];let ph,ch;if(W_.cap!=null&&W_.ccap!=null){ph=Math.min(h,W_.cap);ch=Math.min(h-ph,W_.ccap);ph=h-ch}else if(W_.cap!=null){ph=Math.min(h,W_.cap);ch=h-ph}else if(W_.ccap!=null){ch=Math.min(h,W_.ccap);ph=h-ch}else{ph=h;ch=0}return[ph,ch]}
const payType=e=>{const w=wageOf(e);return w.pay&&w.cash?'split':w.cash?'cash':'payroll'};
const wageLabel=e=>{if(!seePay())return'';const w=wageOf(e);const a=[];if(w.pay)a.push(money(w.pay)+'/h payroll'+(w.cash&&w.cap!=null?` (first ${w.cap} h/wk)`:''));if(w.cash)a.push(money(w.cash)+'/h cash');return a.join(' + ')};
function empTax(g){const t=taxRates();const fica=g*t.fica/100,futa=g*t.futa/100,suta=g*t.suta/100;return{fica,futa,suta,total:fica+futa+suta}}
function laborSum(R){const o={payroll:0,cash:0,hrs:0,ot:0,sched:0,late:0,fica:0,futa:0,suta:0,tax:0};Object.values(R).forEach(r=>{o.hrs+=r.hrs;o.ot+=r.ot;o.sched+=r.sched;o.late+=r.late;o.cash+=r.cashPay;o.payroll+=r.payPay});const t=empTax(o.payroll);o.fica=t.fica;o.futa=t.futa;o.suta=t.suta;o.tax=t.total;o.cost=o.payroll+o.tax+o.cash;return o}
const empName=id=>id==='manager'?'Manager':D.employees[id]?.name||D.former?.[id]||L('Unknown','未知');
const COLORS=['#4E6B45','#2C6A9E','#B5562B','#7A4F9E','#B7700E','#1F8A7A','#A23B62','#56606B'];

/* ---------- toast / sheet / viewer ---------- */
let toastT;
// Check-mark celebration. big = confetti for "all done"; small = quick check for one task.
function celebrate(title,sub,big){document.querySelectorAll('.cele').forEach(x=>x.remove());const el=document.createElement('div');el.className='cele'+(big?'':' small');el.setAttribute('role','status');
  const cols=['#4E6B45','#E8B04B','#D9725B','#7FA06F','#5B8BD9','#C27BA0'];
  const bits=big?[...Array(44)].map((_,i)=>`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${cols[i%cols.length]};animation-delay:${(Math.random()*.5).toFixed(2)}s;animation-duration:${(1.6+Math.random()*1.2).toFixed(2)}s"></i>`).join(''):'';
  el.innerHTML=`${bits}<div class="cele-box"><div class="cele-check"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7.5 7.5L38 19"/></svg></div><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}</div>`;
  document.body.appendChild(el);el.addEventListener('click',()=>el.remove());setTimeout(()=>el.remove(),big?3200:1500)}
const allTasksDone=d=>{const ts=tasksOn(d);return ts.length>0&&ts.every(T=>['ontime','late'].includes(taskState(d,T.type).st))};
function afterTaskDone(type,date,justDone){if(!justDone)return;if(date===bizDate()&&allTasksDone(date))celebrate("All of today's tasks are done!",'Great work 🎉',true);else celebrate('Task complete',taskName(type))}
// Drag to reorder: a list marked data-sortable="name" with rows marked data-sid="…"; drag a row by its .drag handle.
// When dropped, SORT[name](ids in new order) is called. Works with touch and mouse (pointer events).
const SORT={};let DRAGGING=false;const DRAG_H=`<span class="drag" data-drag aria-label="Drag to reorder" title="Drag to reorder">⋮⋮</span>`;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag]');if(!h)return;const row=h.closest('[data-sid]'),box=row?.parentElement;if(!row||!box?.dataset.sortable)return;e.preventDefault();
  const r0=row.getBoundingClientRect(),y0=e.clientY,keep=row.getAttribute('style')||'';const ph=document.createElement('div');ph.className='drag-ph';ph.style.height=r0.height+'px';row.after(ph);
  row.classList.add('dragging');row.style.cssText=keep+`;position:fixed;left:${r0.left}px;top:${r0.top}px;width:${r0.width}px;z-index:150;background:var(--surface);margin:0`;DRAGGING=true;
  try{h.setPointerCapture(e.pointerId)}catch{}const scroller=row.closest('.sb')||document.scrollingElement;let raf=null,lastY=e.clientY;
  const place=y=>{row.style.top=(r0.top+y-y0)+'px';let done=false;for(const o of box.querySelectorAll(':scope > [data-sid]')){if(o===row)continue;const rr=o.getBoundingClientRect();if(y<rr.top+rr.height/2){o.before(ph);done=true;break}}if(!done)box.appendChild(ph)};
  const tick=()=>{const vh=innerHeight;const d=lastY<90?-12:lastY>vh-110?12:0;if(d){scroller.scrollTop+=d;place(lastY)}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);
  const move=ev=>{lastY=ev.clientY;place(ev.clientY)};
  const up=()=>{cancelAnimationFrame(raf);h.removeEventListener('pointermove',move);ph.replaceWith(row);row.classList.remove('dragging');row.setAttribute('style',keep);DRAGGING=false;
    const ids=[...box.querySelectorAll(':scope > [data-sid]')].map(x=>x.dataset.sid);const f=SORT[box.dataset.sortable];f&&f(ids)};
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up,{once:true});h.addEventListener('pointercancel',up,{once:true})});
function toast(m){const t=$('#toast');t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',String(m).length>80?7000:2600)}
function errMsg(e){const c=e?.code||'';if(/^Only an owner/.test(e?.message||''))return e.message;if(c==='invalid_argument')return L('You do not have permission to change this.','你没有权限修改这一项。')+(e?.message?` (${String(e.message).slice(0,140)})`:'');if(c==='quota_exceeded')return L('Storage is full. Delete old records first.','存储已满，请先删除旧记录。');if(c==='too_large')return L('Photo is too large.','照片太大。');if(c==='rate_limited'||c==='resource_exhausted')return L('Too many requests. Try again in a moment.','操作太频繁，请稍后再试。');return L('Could not save. Check your connection and try again.','保存失败，请检查网络后重试。')}
async function W(p){try{await p;return true}catch(e){console.warn(e);toast(errMsg(e));if(e?.code==='invalid_argument')window.blissAccount?.recheck?.();return false}}

  const nb=$('#sheet .sb');if(nb)nb.scrollTop=top;SH.mount&&SH.mount()}
function closeSheet(){if(SH?.isGEdit){if(TR?.direct){const dr=TR.direct,k=TR.k;TR=null;guideSheet(dr.s,dr.i,dr.emp||null,k);return}if(SH.back){TR&&(TR.gi=null);SH=SH.back;drawSheet();return}}if(SH&&(SH.isGuide||SH.isGEdit)){let p=SH.back;while(p&&(p.isGuide||p.isGEdit))p=p.back;if(p){SH=p;drawSheet();return}}RQ=null;SQ=null;SH=null;$('#sheet').innerHTML='';document.body.style.overflow='';render()}
function typing(root){const a=document.activeElement;return a&&root&&root.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='file'}

const MGR_TABS=[['home','home',()=>L('Today','今天')],['stock','box',()=>L('Stock','库存订货')],['photos','cam',()=>L('Photos','照片')],['sched','cal',()=>L('Schedule','排班工时')],['team','users',()=>L('Team','团队')]];

function render(force){if(DRAGGING){setTimeout(()=>render(force),300);return}
  if(!force&&typing($('#view'))){pendingMain=true;return}

  const RT=['region','map',()=>L('Region','区域')],QT=['qc','qc',()=>L('Quality','品控')];const MT=[MGR_TABS[0],QT,...MGR_TABS.slice(1)],ET=[EMP_TABS[0],['eqc','qc',()=>L('Quality','品控')],...EMP_TABS.slice(1)];const tabs=m==='mgr'?(ownerView()?[['owner','star',()=>'Owner'],RT,...MT]:canRM()?[MT[0],RT,...MT.slice(1)]:MT):m==='emp'?(D.employees[actor()]?.role==='Trainee'?ET:ET.filter(t=>t[0]!=='etrain')):null;

function reviewStats(l){return withLoc(l,()=>{const t=bizDate();let done=0,reviewed=0,issues=0,missed=0,audited=0,disagree=0,last=null,lastDoc=null;
  for(let i=0;i<7;i++){const d=addDays(t,-i);tasksOn(d).forEach(T=>{const s=taskState(d,T.type);if(s.st==='missed'&&!s.filled){missed++;return}if(!s.filled||!['ontime','late','missed'].includes(s.st))return;done++;const rv=s.doc?.review;
    if(rv){reviewed++;if(rv.status==='issue')issues++;if(!last||rv.at>last.at){last=rv;lastDoc=s.doc}}if(s.doc?.audit){audited++;if(s.doc.audit.status!=='agree')disagree++}})}
  return{done,reviewed,waiting:done-reviewed,issues,missed,audited,disagree,last,lastDoc}})}

function reviewIssues(){const t=bizDate();const r=[];for(let i=0;i<14;i++){const d=addDays(t,-i);tasksOn(d).forEach(T=>{const doc=photoDoc(d,T.type);if(doc?.review?.status==='issue'&&!doc.review.ownerSeen)r.push({k:'revIssue',d,type:T.type,doc,loc:curLoc()})})}return r}
function attention(){const a=[];const t=bizDate();if(isOwner&&!UI.pv)a.push(...reviewIssues());
  ORD().forEach(o=>{if(o.status==='issue'&&!o.issueSeen)a.push({k:'order',o});if(o.status==='ordered'&&o.expected&&o.expected<t)a.push({k:'late',o})});
  const seen=+(ls.get('availSeen')||0);Object.entries(D.avail).forEach(([e,v])=>{if(v.updatedAt&&new Date(v.updatedAt).getTime()>seen&&D.employees[e]&&worksAt(e,curLoc()))a.push({k:'avail',e})});
  if(t>availDue(t)){const nw=nextWk(t);emps().forEach(e=>{if(!D.avail[e.id]?.weeks?.[nw])a.push({k:'availMiss',e:e.id})})}

/* ---------- image upload ---------- */
async function compress(file){try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));return b||file}catch(e){return file}}
async function uploadImg(file){UPLOADS++;try{return await uploadImg0(file)}finally{UPLOADS--}}
async function uploadImg0(file){if(!A.assets){toast(L('Photo upload is not available on this account. Ask the manager.','此账号不能上传照片，请联系经理。'));return null}
  const b=await compress(file);const type=b.type&&['image/jpeg','image/png','image/webp','image/gif'].includes(b.type)?b.type:'image/jpeg';
  try{const r=await A.assets.upload(b,{type});return r.id}catch(e){console.warn(e);toast(errMsg(e));return null}}

function payroll(ps,pl){const pe=addDays(ps,pl-1);const res={};Object.values(D.employees).filter(e=>locOf(e.id)===curLoc()).forEach(e=>{const P=Object.values(D.punches).filter(p=>p.empId===e.id&&p.date>=ps&&p.date<=pe);
    const W_=wageOf(e.id),TR=trainOf(e.id);let hrs=0,ot=0,pH=0,cH=0,payPay=0,cashPay=0,trH=0,trPay=0;
    for(let w=0;w<pl;w+=7){const a=addDays(ps,w),b=addDays(ps,Math.min(w+6,pl-1));const Pw=P.filter(p=>p.date>=a&&p.date<=b);const h=Pw.reduce((s,p)=>s+punchHrs(p),0);const o=Math.max(0,h-(D.settings.otWeekly||40));hrs+=h;ot+=o;
      const th=Pw.filter(p=>inTraining(e.id,p.date)).reduce((s,p)=>s+punchHrs(p),0),rh=h-th;const oR=Math.min(o,rh),oT=o-oR;
      const[ph,ch]=splitHrs(rh,W_);const oc=Math.min(ch,oR),op=oR-oc;pH+=ph;cH+=ch;
      payPay+=(ph-op)*W_.pay+op*W_.pay*1.5;cashPay+=(ch-oc)*W_.cash+oc*W_.cash*1.5;
      if(th){const tp=th*TR.rate+oT*TR.rate*.5;trH+=th;trPay+=tp;if(TR.via==='cash'){cashPay+=tp;cH+=th}else{payPay+=tp;pH+=th}}}
    const late=P.filter(p=>p.late>0);const sched=Object.values(D.shifts).filter(s=>s.empId===e.id&&s.date>=ps&&s.date<=pe).reduce((s,x)=>s+shiftHrs(x),0);
    const tasks=Object.values(D.photos).filter(x=>x.completedBy===e.id&&x.date>=ps&&x.date<=pe);const onT=tasks.filter(x=>taskState(x.date,x.type,x.loc).st==='ontime').length;const issues=tasks.filter(x=>x.review?.status==='issue').length;
    let bon=null;if(bonusOn()){const days=bonusDays(e.id,P);const okN=days.filter(x=>x.ok).length;bon={days,ok:okN,amt:seePay()?okN*num(bonusCfg().perShift):0};if(bon.amt){if(bonusCfg().via==='cash')cashPay+=bon.amt;else payPay+=bon.amt}}
    const rate=W_.pay||W_.cash||TR.rate;const pay=payPay+cashPay;
    if(P.length||sched)res[e.id]={e,P,bon,hrs,ot,late:late.length,lateMin:late.reduce((s,p)=>s+p.late,0),sched,tasks:tasks.length,onT,issues,rate,pay,payPay,cashPay,pH,cH,trH,trPay,TR,W:W_,type:payType(e.id),open:P.filter(p=>!p.out).length}});return res}

const wkStart=d=>{const x=parseYmd(d);return addDays(d,-((x.getDay()+6)%7))};

const rmLog=k=>D.rmLog?.[k]||{};

function vRegion(){const d=bizDate();

/* ---------- Store opening soon (pre-opening) ----------
   A store marked "Opening soon" in Settings → Stores shows an opening plan instead of the daily store screen:
   target date, progress, and a checklist by phase. Saved in mgr/preopen_<store> (managers and owners only). */
const PRE_DEF=[
  ['Lease & permits',['Lease signed','Health department plan review approved','Building permit','Food service license','Certificate of occupancy','Sales tax permit / business registration for this address','Insurance for the new location']],
  ['Build-out & equipment',['Layout and design final','Plumbing and electrical done','Sign ordered and installed','Equipment ordered (ice machine, fridges, blenders, sealer, dishwasher)','Equipment delivered and tested','Furniture and decor in place','Deep clean before opening']],
  ['Menu & supplies',['Menu and prices final for this store','Supplier accounts set up (BJ\'s, Walmart, matcha, cups)','Opening inventory ordered','Cups, lids, straws, bags and napkins in stock']],
  ['Systems',['Menusifu POS set up for this store','Internet, Wi-Fi and music','Cameras and alarm','Store checklists and items set up in the BLISS app']],
  ['Hiring & training',['Job posts up','Interviews done','Team hired','New hires trained at an open store','First two weeks scheduled']],
  ['Marketing & opening',['Google Maps / Yelp listing','Social media announcement','Soft opening (friends and family)','Grand opening']]];
const preDoc=l=>D.preopen?.[l]||null;
const preItems=l=>preDoc(l)?.items||PRE_DEF.flatMap(([ph,ns],pi)=>ns.map((n,i)=>({id:`p${pi}-${i}`,phase:ph,name:n})));
const prePhases=l=>{const ph=[...(preDoc(l)?.phases||PRE_DEF.map(([p])=>p))];preItems(l).forEach(x=>{if(!ph.includes(x.phase))ph.push(x.phase)});return ph};
const preOpenDate=l=>preDoc(l)?.openDate||LOCS().find(x=>x.id===l)?.openDate||'';
// Item status: todo (not started) · doing (in progress) · wait (waiting on someone → follow up) · done
const PRE_ST=()=>({todo:[L('Not started','未开始'),''],doing:[L('In progress','进行中'),'info'],wait:[L('Waiting / follow up','等待 / 跟进'),'warn'],done:[L('Done','完成'),'ok']});
const preSt=x=>x.done?'done':['doing','wait'].includes(x.st)?x.st:'todo';
const preFuDue=(x,d)=>preSt(x)!=='done'&&x.fu&&x.fu<=(d||bizDate());
const preLate=(x,d)=>preSt(x)!=='done'&&x.due&&x.due<(d||bizDate());
function preProg(l){const it=preItems(l);const n=it.filter(x=>x.done).length;return{n,t:it.length,pct:it.length?Math.round(n/it.length*100):0,fu:it.filter(x=>preFuDue(x)).length,late:it.filter(x=>preLate(x)).length}}
async function preWrite(l,patch){const cur=preDoc(l)||{};const next={...cur,items:preItems(l),phases:prePhases(l),...patch};D.preopen={...(D.preopen||{}),[l]:next};render();drawSheet();return W(A.db.doc('mgr/preopen_'+l).set(next))}
const md=s=>fmtD(s,{month:'short',day:'numeric'});
function vPreopen(){const l=curLoc();const d=bizDate();const od=preOpenDate(l);const days=od?Math.round((parseYmd(od)-parseYmd(d))/864e5):null;const p=preProg(l);
  const team=Object.entries(D.employees).filter(([id,e])=>e.active!==false&&worksAt(id,l));

  const all=preItems(l);const S=PRE_ST();const f=UI.preF||'all';

  const row=(x,i)=>{const st=preSt(x);const last=(x.log||[]).slice(-1)[0];

        <div class="row wrapr" style="gap:4px;margin-top:3px">${st==='todo'?'':chip(S[st][1],S[st][0])}${x.start&&st!=='done'?`<span class="tiny muted">${L('Start','开始')} ${md(x.start)}</span>`:''}${x.due&&st!=='done'?chip(preLate(x,d)?'bad':x.due<=addDays(d,7)?'warn':'',`${L('Due','截止')} ${md(x.due)}`):''}${x.who?`<span class="tiny muted">· ${esc(x.who)}</span>`:''}${st==='done'&&x.done?`<span class="tiny muted">${esc(x.done.by)} · ${md(x.done.at.slice(0,10))}</span>`:''}</div>

        ${last?`<div class="tiny muted" style="margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">💬 ${esc(last.text)} — ${esc(last.by)}, ${md(last.at.slice(0,10))}</div>`:x.note?`<div class="tiny muted" style="margin-top:3px">${esc(x.note)}</div>`:''}</div>

  return `<div class="stack">

   <div class="stat tap" data-act="preF" data-k="fu" style="cursor:pointer"><b style="color:${p.fu?'var(--bad)':'inherit'}">${p.fu}</b><span>${L('Follow up now','需跟进')}</span></div>
   <div class="stat tap" data-act="preF" data-k="late" style="cursor:pointer"><b style="color:${p.late?'var(--bad)':'inherit'}">${p.late}</b><span>${L('Overdue','逾期')}</span></div></div>
  <div class="bar"><i style="width:${p.pct}%;background:var(--ok)"></i></div>
  <div class="card row" style="gap:8px;flex-wrap:wrap"><label class="f grow" style="min-width:160px">${L('Target opening date','目标开业日')}<input class="in" type="date" id="pre_open" value="${esc(od)}"></label><button class="btn" data-act="preDate">${L('Save date','保存日期')}</button></div>
  <div class="row" style="gap:6px;overflow-x:auto;padding-bottom:2px;flex-wrap:nowrap">${filt.map(([k,n])=>`<button class="btn sm ${f===k?'pri':''}" style="white-space:nowrap;flex:none" data-act="preF" data-k="${k}">${n} ${cnt[k]}</button>`).join('')}</div>
  ${f==='all'?`<p class="tiny muted" style="margin:0">${L('Tap an item to set its status, start / due dates, follow-up and updates. Hold ⋮⋮ to drag it; ↑ ↓ moves a section.','点项目设置状态、开始/截止日、跟进和进展。按住 ⋮⋮ 拖动排序；↑ ↓ 移动分类。')}</p>`:''}
  <div class="stack">${prePhases(l).map((ph,pi)=>{const it=all.map((x,i)=>({x,i})).filter(({x})=>x.phase===ph);const vis=it.filter(({x})=>show(x));const dn=it.filter(({x})=>x.done).length;
    if(f!=='all'&&!vis.length)return'';
    return `<div><div class="row" style="gap:6px"><h3 class="grow">${esc(ph)}</h3><span class="small muted">${dn}/${it.length}</span>${f==='all'?`<button class="btn sm" data-act="prePhMv" data-ph="${esc(ph)}" data-n="-1" ${pi===0?'disabled':''} aria-label="${L('Move section up','分类上移')}">↑</button><button class="btn sm" data-act="prePhMv" data-ph="${esc(ph)}" data-n="1" ${pi===prePhases(l).length-1?'disabled':''} aria-label="${L('Move section down','分类下移')}">↓</button><button class="btn sm" data-act="prePh" data-ph="${esc(ph)}" aria-label="${L('Edit section','编辑分类')} ${esc(ph)}">✎</button>`:''}</div>
      <div class="card flush list" data-sortable="preitems">${vis.map(({x,i})=>row(x,i)).join('')||'<div class="empty small">—</div>'}
      ${f==='all'?`<button class="li tap" data-act="preItem" data-ph="${esc(ph)}" style="width:100%;border:0;background:none;color:var(--brand);font-weight:600;text-align:left;cursor:pointer">${ic('plus')} ${L('Add','添加')}</button>`:''}</div></div>`}).join('')||`<div class="card empty">${L('Nothing here.','没有。')}</div>`}</div>
  ${f==='all'?`<button class="btn" data-act="prePh">${ic('plus')} ${L('Add a section','添加分类')}</button>`:''}
  <div class="card stack" style="gap:6px"><b>${L('Team for this store','这家店的员工')}</b>${team.length?`<div class="small">${team.map(([id])=>esc(empName(id))).join(', ')}</div>`:`<div class="small muted">${L('Nobody yet. In Team → People, set someone\'s main store or "Can also work at" to this store.','还没有。去 团队 → 员工，把人的门店设成这家店。')}</div>`}</div>
  <p class="tiny muted">${L('When the store opens, go to Settings → Stores and switch it to "Open". Then the daily checklists, schedule and counts start like the other stores.','开业后，去 设置 → 门店 改成"营业中"，就会和其他店一样开始每日清单、排班和盘点。')}</p>
  </div>`}
function preItemSheet(i,ph){const l=curLoc();const x=i!=null?preItems(l)[i]:{name:'',phase:ph||prePhases(l)[0]};const st=preSt(x);const S=PRE_ST();
  openSheet({title:()=>i!=null?L('Edit item','编辑'):L('Add item','添加'),body:()=>`<div class="stack">
    <label class="f">${L('What needs to happen','要做的事')}<input class="in" id="pi_name" value="${esc(x.name)}" maxlength="120"></label>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)">${L('Status','状态')}
      <div class="row wrapr" style="gap:6px">${Object.entries(S).map(([k,[n]])=>`<label class="btn sm" style="cursor:pointer;gap:6px;color:var(--ink)"><input type="radio" name="pi_st" value="${k}" ${st===k?'checked':''}> ${n}</label>`).join('')}</div></div>
    <div class="g2"><label class="f">${L('Start date','开始日')}<input class="in" type="date" id="pi_start" value="${esc(x.start||'')}"></label><label class="f">${L('Due date','截止日')}<input class="in" type="date" id="pi_due" value="${esc(x.due||'')}"></label></div>
    <label class="f">${L('Who is responsible','负责人')}<input class="in" id="pi_who" value="${esc(x.who||'')}" maxlength="40" placeholder="e.g. Ashley"></label>
    <div class="card stack" style="gap:8px;background:var(--sunk)"><div class="eyebrow">🔔 ${L('Follow up','跟进')}</div>
      <div class="g2"><label class="f">${L('Follow up on','跟进日期')}<input class="in" type="date" id="pi_fu" value="${esc(x.fu||'')}"></label><label class="f">${L('With whom','跟谁')}<input class="in" id="pi_fuw" value="${esc(x.fuWith||'')}" maxlength="60" placeholder="${L('e.g. Health dept, landlord','例如：卫生局、房东')}"></label></div>
      <p class="tiny muted" style="margin:0">${L('On that day it shows red under "Follow up now". Clear the date when it\'s handled.','到那天会在"需跟进"里变红。处理完把日期清空。')}</p></div>
    <label class="f">${L('Section','分类')}<select class="in" id="pi_ph">${prePhases(l).map(p=>`<option ${p===x.phase?'selected':''}>${esc(p)}</option>`).join('')}</select></label>
    <label class="f">${L('Add an update','添加进展')}<textarea class="in" id="pi_upd" rows="2" maxlength="300" placeholder="${L('e.g. Called the health dept, inspection booked Nov 12','例如：打给卫生局，约了11月12日检查')}"></textarea></label>
    ${(x.log||[]).length?`<div class="card flush list">${[...x.log].reverse().map(u=>`<div class="li" style="flex-direction:column;align-items:flex-start;gap:2px"><div class="small" style="white-space:pre-wrap">${esc(u.text)}</div><div class="tiny muted">${esc(u.by)} · ${md(u.at.slice(0,10))}</div></div>`).join('')}</div>`:''}
    ${x.note?`<label class="f">${L('Note','备注')}<input class="in" id="pi_note" value="${esc(x.note)}" maxlength="160"></label>`:''}
    ${i!=null?`<div class="row" style="gap:6px"><span class="small muted grow">${L('Order','顺序')}</span><button class="btn sm" data-act="preMv" data-i="${i}" data-n="-1">↑ ${L('Up','上移')}</button><button class="btn sm" data-act="preMv" data-i="${i}" data-n="1">↓ ${L('Down','下移')}</button></div>`:''}</div>`,
   foot:()=>`${i!=null?`<button class="btn bad" data-act="preDel" data-i="${i}">${SH?.confirmDel===i?L('Tap again','再点一次'):L('Delete','删除')}</button>`:''}<button class="btn pri" data-act="preSave" data-i="${i??''}">${L('Save','保存')}</button>`})}
function prePhSheet(ph){const l=curLoc();const n=ph?preItems(l).filter(x=>x.phase===ph).length:0;
  openSheet({title:()=>ph?L('Edit section','编辑分类'):L('Add a section','添加分类'),body:()=>`<div class="stack"><label class="f">${L('Section name','分类名称')}<input class="in" id="ph_name" value="${esc(ph||'')}" maxlength="60" placeholder="${L('e.g. Grand opening events','例如：开业活动')}"></label>
    ${ph?`<div class="row" style="gap:6px"><span class="small muted grow">${L('Order','顺序')}</span><button class="btn sm" data-act="prePhMv" data-ph="${esc(ph)}" data-n="-1">↑ ${L('Up','上移')}</button><button class="btn sm" data-act="prePhMv" data-ph="${esc(ph)}" data-n="1">↓ ${L('Down','下移')}</button></div>`:''}</div>`,
   foot:()=>`${ph?`<button class="btn bad" data-act="prePhDel" data-ph="${esc(ph)}">${SH?.confirmDel===ph?L(`Tap again: deletes ${n} item${n===1?'':'s'}`,`再点一次：删除 ${n} 项`):L('Delete section','删除分类')}</button>`:''}<button class="btn pri" data-act="prePhSave" data-ph="${esc(ph||'')}">${L('Save','保存')}</button>`})}
// drag to reorder items (within a section)
SORT.preitems=async ids=>{const l=curLoc();const it=preItems(l).map(x=>({...x}));const pos=ids.map(Number).slice().sort((a,b)=>a-b);const nx=it.slice();pos.forEach((p,k)=>{nx[p]=it[+ids[k]]});await preWrite(l,{items:nx})};
const PRE_ACT={
  preF:d=>{UI.preF=UI.preF===d.k&&d.k!=='all'?'all':d.k;render()},
  prePh:d=>prePhSheet(d.ph||null),
  prePhSave:async d=>{const l=curLoc();const v=$('#ph_name').value.trim();if(!v){$('#ph_name').focus();return}const ph=prePhases(l);
    if(v!==d.ph&&ph.includes(v)){toast(L('That section already exists','已经有这个分类'));return}
    const phases=d.ph?ph.map(p=>p===d.ph?v:p):[...ph,v];const items=preItems(l).map(x=>x.phase===d.ph&&d.ph?{...x,phase:v}:{...x});
    if(await preWrite(l,{phases,items})){closeSheet();toast(L('Saved','已保存'))}},
  prePhDel:async d=>{if(SH.confirmDel!==d.ph){SH.confirmDel=d.ph;drawSheet();return}const l=curLoc();
    if(await preWrite(l,{phases:prePhases(l).filter(p=>p!==d.ph),items:preItems(l).filter(x=>x.phase!==d.ph)})){closeSheet();toast(L('Deleted','已删除'))}},
  prePhMv:async d=>{const l=curLoc();const ph=prePhases(l);const i=ph.indexOf(d.ph),j=i+(+d.n);if(i<0||j<0||j>=ph.length)return;[ph[i],ph[j]]=[ph[j],ph[i]];await preWrite(l,{phases:ph})},
  preMv:async d=>{const l=curLoc();const it=preItems(l).map(x=>({...x}));const i=+d.i;const ph=it[i]?.phase;let j=i+(+d.n);while(j>=0&&j<it.length&&it[j].phase!==ph)j+=(+d.n);if(j<0||j>=it.length)return;
    [it[i],it[j]]=[it[j],it[i]];if(await preWrite(l,{items:it})){closeSheet();preItemSheet(j)}},
  preDate:async()=>{const v=$('#pre_open').value;if(await preWrite(curLoc(),{openDate:v}))toast(L('Saved','已保存'))},
  preTog:async d=>{const l=curLoc();const it=preItems(l).map(x=>({...x}));const x=it[+d.i];if(!x)return;
    if(x.done){delete x.done;if(!['doing','wait'].includes(x.st))x.st=x.start?'doing':'todo'}else{x.done={by:meName(),at:new Date().toISOString()};x.st='done'}
    await preWrite(l,{items:it})},
  preItem:d=>preItemSheet(d.i!=null&&d.i!==''?+d.i:null,d.ph),
  preSave:async d=>{const l=curLoc();const name=$('#pi_name').value.trim();if(!name){$('#pi_name').focus();return}
    const it=preItems(l).map(x=>({...x}));const st=document.querySelector('input[name=pi_st]:checked')?.value||'todo';
    const v={name,start:$('#pi_start').value||undefined,due:$('#pi_due').value||undefined,who:$('#pi_who').value.trim()||undefined,fu:$('#pi_fu').value||undefined,fuWith:$('#pi_fuw').value.trim()||undefined,phase:$('#pi_ph').value,note:$('#pi_note')?($('#pi_note').value.trim()||undefined):undefined};
    const o=d.i!==''&&it[+d.i]?it[+d.i]:null;const x=o||{id:'p'+uidGen()};
    ['start','due','who','fu','fuWith','note'].forEach(k=>delete x[k]);Object.keys(v).forEach(k=>{if(v[k]!==undefined)x[k]=v[k]});
    x.st=st;if(st==='done'){if(!x.done)x.done={by:meName(),at:new Date().toISOString()}}else delete x.done;
    const upd=$('#pi_upd').value.trim();if(upd)x.log=[...(x.log||[]),{text:upd,by:meName(),at:new Date().toISOString()}].slice(-30);
    if(!o)it.push(x);
    if(await preWrite(l,{items:it})){closeSheet();toast(L('Saved','已保存'))}},
  preDel:async d=>{if(SH.confirmDel!==+d.i){SH.confirmDel=+d.i;drawSheet();return}const l=curLoc();const it=preItems(l).filter((_,i)=>i!==+d.i);if(await preWrite(l,{items:it}))closeSheet()},
};

/* ---------- Prep batches & expiry ----------
   Managers list what gets made in-store and how long it lasts (config/prep). Staff tap "Made a batch" (batches/<id>);
   the app shows what to write on the label, counts down, and the server pushes whoever is on shift before it expires,
   when it expires, and the store's managers + regional manager if it's still not thrown out 30 min later.
   Throwing out needs a photo; the regional manager reviews those photos in the Region tab. */
const PREP=()=>D.prepCfg||[];
const BAT=()=>Object.values(D.batches||{});
const batActive=l=>BAT().filter(b=>b.loc===l&&b.status==='active').sort((a,b)=>String(a.expAt).localeCompare(String(b.expAt)));
const lifeTxt=h=>h>=24&&h%24===0?L(`${h/24} day${h===24?'':'s'}`,`${h/24}天`):L(`${h} h`,`${h}小时`);
const batWarnMs=b=>Math.min(60*6e4,Math.max(15*6e4,(Date.parse(b.expAt)-Date.parse(b.madeAt))*0.2));
const batState=(b,now=Date.now())=>{const e=Date.parse(b.expAt);return now>=e?'exp':now>=e-batWarnMs(b)?'soon':'ok'};
function fmtLeft(ms){const m=Math.max(1,Math.round(Math.abs(ms)/6e4));if(m<60)return L(`${m} min`,`${m}分钟`);if(m<1440){const h=Math.floor(m/60),r=m%60;return L(`${h}h${r?' '+r+'m':''}`,`${h}小时${r?r+'分':''}`)}const d=Math.floor(m/1440),h=Math.floor(m%1440/60);return L(`${d}d${h?' '+h+'h':''}`,`${d}天${h?h+'小时':''}`)}
const dtShort=iso=>{const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${fmtT(hm(d))}`};
// Morning taste check: every batch made before today gets tasted once a day, before the store opens.
const tasteDue=b=>b.status==='active'&&b.madeDate<bizDate()&&batState(b)!=='exp';
const tasted=b=>b.tastes?.[bizDate()];
const openAt=l=>storeHrs(l,parseYmd(bizDate()).getDay())?.[0]||D.settings.prep1||'11:30';
function tasteState(l){const due=batActive(l).filter(tasteDue);const done=due.filter(tasted);const late=Date.now()>atTime(bizDate(),openAt(l)).getTime();
  const last=done.map(b=>b.tastes[bizDate()]).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];return{due,done,left:due.length-done.length,late,last}}
function batRow(b,opts={}){const s=batState(b);const left=Date.parse(b.expAt)-Date.now();
  const st=s==='exp'?chip('bad',L(`Expired ${fmtLeft(left)} ago`,`已过期 ${fmtLeft(left)}`)):s==='soon'?chip('warn',L(`Expires in ${fmtLeft(left)}`,`${fmtLeft(left)}后过期`)):`<span class="tiny muted">${L(`${fmtLeft(left)} left`,`还剩 ${fmtLeft(left)}`)}</span>`;
  return `<div class="li" style="flex-wrap:wrap;gap:8px;${s==='exp'?'background:var(--bad-bg,#fdecec)':''}"><div class="grow" style="min-width:55%"><div class="t">${s==='exp'?'🗑️ ':s==='soon'?'⏳ ':''}${esc(b.name)}${opts.store?` · <span class="small muted">${esc(locName(b.loc))}</span>`:''}</div>
    <div class="tiny muted">${L('Made','制作')} ${dtShort(b.madeAt)}${b.madeByName?' · '+esc(b.madeByName):''} → <b>${L('use by','用到')} ${dtShort(b.expAt)}</b></div></div>${st}
    ${tasteDue(b)&&s!=='exp'?(tasted(b)?`<div class="tiny" style="flex:1 1 100%;color:${tasted(b).ok?'var(--ok)':'var(--bad)'}">${tasted(b).ok?'👍':'👎'} ${L('Tasted today','今天已尝')} · ${esc(tasted(b).by)} ${fmtT(hm(new Date(tasted(b).at)))}</div>`
      :opts.ro?'':`<div class="row" style="gap:6px;flex:1 1 100%;align-items:center"><span class="tiny grow" style="color:var(--warn);font-weight:600">${L('Taste it today:','今天要尝：')}</span><button class="btn sm" data-act="batTaste" data-id="${esc(b.id)}" data-k="1">👍 ${L('Tastes right','味道对')}</button><button class="btn sm bad" data-act="batTaste" data-id="${esc(b.id)}" data-k="0">👎 ${L('Off','不对')}</button></div>`):''}
    ${opts.ro?'':`<div class="row" style="gap:6px;flex:1 1 100%;justify-content:flex-end">${s!=='exp'?`<button class="btn sm" data-act="batUsed" data-id="${esc(b.id)}">${L('Used up','用完了')}</button>`:''}<label class="btn sm ${s==='exp'||tasted(b)?.ok===false?'bad':''}" style="cursor:pointer">${ic('cam')} ${L('Thrown out','已丢弃')}<input type="file" accept="image/*" capture="environment" data-up="bdisc" data-id="${esc(b.id)}" hidden></label></div>`}</div>`}
function qcBody(){const l=curLoc();if(isPre(l))return'';const act=batActive(l);if(!PREP().length&&!isMgr)return'';const nExp=act.filter(b=>batState(b)==='exp').length;
  return `<div class="row"><h3 class="grow">${L('Batches & expiry','备料和保质期')}${nExp?` ${chip('bad',L(`${nExp} to throw out`,`${nExp} 个要扔`))}`:''}</h3>${PREP().length?`<button class="btn sm pri" data-act="batNew">${ic('plus')} ${L('Made a batch','做了一批')}</button>`:''}</div>
  ${!PREP().length?`<div class="card stack" style="gap:8px"><div class="small">${L('List what you make in-store (e.g. Black Sesame, boba, cream foam) and how long each lasts. Staff log each batch, the app counts down and reminds them to throw it out.','列出店里自己做的东西（比如 Black Sesame、珍珠、奶盖）和能放多久。员工每做一批就记一下，app 会倒计时并提醒扔掉。')}</div><button class="btn" data-act="prepCfg">${L('Set up prep items','设置备料')}</button></div>`
   :`${(()=>{const t=tasteState(l);if(!t.due.length)return'';return t.left?`<div class="card row" style="gap:10px;border-left:4px solid ${t.late?'var(--bad)':'var(--warn)'}"><span style="font-size:22px">👅</span><div class="grow"><div class="t">${L('Morning taste check','早上试味')} · ${t.done.length}/${t.due.length}</div><div class="small muted">${L(`Taste each one below before opening (${fmtT(openAt(l))}). If it's off, throw it out.`,`开店前（${fmtT(openAt(l))}）把下面每样尝一下。不对就扔掉。`)}</div></div>${t.late?chip('bad',L('Late','晚了')):''}</div>`
     :`<div class="small" style="color:var(--ok)">👅 ${L('Taste check done today','今天已试味')}${t.last?` · ${esc(t.last.by)} ${fmtT(hm(new Date(t.last.at)))}`:''}</div>`})()}
   <div class="card flush list">${act.map(b=>batRow(b)).join('')||`<div class="empty small">${L('Nothing open. Tap "Made a batch" each time you make something on the list.','目前没有。每做一批就点"做了一批"。')}</div>`}</div>`}`}
function qcLink(){const l=curLoc();if(isPre(l)||!PREP().length)return'';const act=batActive(l);const t=tasteState(l);const nExp=act.filter(b=>batState(b)==='exp').length;const nSoon=act.filter(b=>batState(b)==='soon').length;
  if(!t.left&&!nExp&&!nSoon)return'';const bad=nExp||(t.left&&t.late);
  return `<div class="card row tap" data-act="tab" data-k="${mode()==='emp'?'eqc':'qc'}" tabindex="0" style="gap:10px;border-left:4px solid ${bad?'var(--bad)':'var(--warn)'};cursor:pointer">${ic('qc')}<div class="grow"><div class="t">${L('Quality control','品控')}</div><div class="small">${[nExp?`<b style="color:var(--bad)">🗑️ ${L(`${nExp} to throw out`,`${nExp} 个要扔`)}</b>`:'',t.left?`<span style="color:${t.late?'var(--bad)':'var(--warn)'}">👅 ${L(`taste ${t.left} item${t.left>1?'s':''}`,`${t.left} 样要试味`)}</span>`:'',nSoon?`⏳ ${L(`${nSoon} expiring soon`,`${nSoon} 个快过期`)}`:''].filter(Boolean).join(' · ')}</div></div>${ic('chev')}</div>`}
function vQC(){const l=curLoc();const since=addDays(bizDate(),-7);
  if(isPre(l))return `<div class="stack"><div><div class="eyebrow">${esc(locName(l))}</div><h2>${L('Quality control','品控')}</h2></div><div class="card empty">${L('Starts when the store opens.','开业后开始。')}</div></div>`;
  const disc=BAT().filter(b=>b.loc===l&&['discarded','used'].includes(b.status)&&String(b.discardedAt||b.usedAt||'').slice(0,10)>=since).sort((a,b)=>String(b.discardedAt||b.usedAt).localeCompare(String(a.discardedAt||a.usedAt)));
  return `<div class="stack"><div><div class="eyebrow">${fmtD(bizDate(),{weekday:'long',month:'long',day:'numeric'})} · ${esc(locName(l))}</div><h2>${L('Quality control','品控')}</h2></div>
  ${qcBody()}
  ${PREP().length?`<p class="tiny muted" style="margin:0">${L('Log every batch you make. Write the label the app shows. Taste everything each morning before opening. Throw out anything expired or off, with a photo.','每做一批都记下来，按 app 显示的写标签。每天开店前把每样尝一遍。过期或味道不对的要扔，并拍照。')}</p>`:''}
  ${disc.length?`<h3>${L('Finished this week','本周用完/丢弃')}</h3><div class="card flush list">${disc.map(b=>`<div class="li" style="gap:8px;flex-wrap:wrap">${b.photo?`<img src="${BLOB}${esc(b.photo)}" alt="" data-act="viewPh" data-pid="${esc(b.photo)}" data-cap="${esc(b.name)}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:zoom-in">`:''}
    <div class="grow" style="min-width:50%"><div class="t">${esc(b.name)}</div><div class="tiny muted">${b.status==='used'?`${L('Used up','用完')} ${dtShort(b.usedAt)} · ${esc(b.usedByName||'')}`:`${L('Thrown out','丢弃')} ${dtShort(b.discardedAt)} · ${esc(b.discardedByName||'')}`}</div></div>
    ${b.status==='discarded'?(b.early?chip('info',L('Early','提前扔')):b.lateMin>0?chip(b.lateMin>60?'bad':'warn',L(`${fmtLeft(b.lateMin*6e4)} late`,`晚了 ${fmtLeft(b.lateMin*6e4)}`)):chip('ok',L('On time','准时'))):chip('',L('Used up','用完'))}
    ${b.review?chip(b.review.ok?'ok':'bad',b.review.ok?L('Checked ✓','已检查 ✓'):L('Problem','有问题')):''}</div>`).join('')}</div>`:''}
  ${isMgr&&PREP().length?`<button class="btn" data-act="prepCfg">${L('Prep items & shelf life','备料和保质期设置')}</button>`:''}
  </div>`}
function batNewSheet(){openSheet({title:()=>L('Made a batch','做了一批'),body:()=>UI.batLabel?(()=>{const b=D.batches?.[UI.batLabel];if(!b)return'';
    return `<div class="stack"><div class="hint">${L('Write this on the label and stick it on the container:','把这个写在标签上，贴在容器上：')}</div>

/* ---------- AI photo check ----------
   After a task photo is saved, Claude looks at it (with the item's example photo when there is one) and says whether
   the item looks done; a fingerprint of the picture also catches the same photo being reused. Results are saved on the
   photo log as ai[slot] = {photo, ok, issue, dup, at} and shown to staff right away and to managers in Review.
   AI only points things out; the manager still decides Passed / Has issues. */
const AIC={};                       // running checks: photo id → true
async function photoHash(blob){     // 64-bit difference hash, as 16 hex chars
  try{const bm=await createImageBitmap(blob);const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');x.drawImage(bm,0,0,9,8);
    const px=x.getImageData(0,0,9,8).data;const g=i=>px[i*4]*.299+px[i*4+1]*.587+px[i*4+2]*.114;let bits='';
    for(let r=0;r<8;r++)for(let k=0;k<8;k++)bits+=g(r*9+k)>g(r*9+k+1)?'1':'0';
    return bits.match(/.{4}/g).map(b=>parseInt(b,2).toString(16)).join('')}catch(e){return null}}
const hamming=(a,b)=>{let n=0;for(let i=0;i<a.length;i++){let v=parseInt(a[i],16)^parseInt(b[i],16);while(v){n+=v&1;v>>=1}}return n};
// same picture already used for this item on another day (last ~30 days of logs)
function photoDup(hash,type,slot,date,id){if(!hash)return null;const ones=hamming(hash,'0000000000000000');if(ones<8||ones>56)return null;   // blank/very dark pictures look alike
  let best=null;
  Object.values(D.photos||{}).forEach(doc=>{if(doc.type!==type||doc.date===date)return;Object.entries(doc.photos||{}).forEach(([sl,p])=>{if(p.id===id||!p.hash||p.hash.length!==hash.length)return;
    if(hamming(hash,p.hash)<=5&&(!best||doc.date>best))best=doc.date})});return best}
async function blobOf(id){try{const r=await fetch(BLOB+id);return r.ok?await r.blob():null}catch(e){return null}}
async function aiCheckPhoto({type,slot,date,loc,id,blob,hash}){
  if(!A.sample||AIC[id])return;AIC[id]=true;drawSheet();
  try{const sl=slotsOf(type,date).find(x=>x.id===slot)||{name:slot};const T=TASKS().find(t=>t.type===type);
    blob=blob||await blobOf(id);if(!blob)return;hash=hash||await photoHash(blob);
    const exr=exRef(sl,loc);const refB=exr?await blobOf(exr):null;
    const prompt=`You check checklist photos for a matcha / bubble tea shop. Task: "${T?T.name():type}". Item: "${sl.name}".
Image 1 is the photo a staff member just took for this item.${refB?' Image 2 is the manager\'s example of how it should look when done properly.':''}
Read the item name literally and check every part of it:
- If it says replenished / restocked / refilled / stocked / topped up / filled, each thing it names must look well stocked. Look at every container, holder and cup: flag any that is empty, nearly empty or clearly much lower than the others (for example a straw cup with only a few straws left).
- Every thing the item names (e.g. napkins, straws, spoons, lids, cups) should be visible in the photo; flag what is missing.
- If it is a cleaning item, flag visible dirt, spills, sticky residue, crumbs, trash, overflowing bins, food or cups left out, items not put away.
- Flag a photo that doesn't show this item or is too dark, blurry or close to judge.${refB?'\n- Compare with the example and flag clear differences in setup or fill level.':''}
Do not flag lighting colour, angle, normal wear, or things the item doesn't ask about.
Return JSON only: {"ok": true|false, "issue": "if not ok, what to fix in at most 12 plain words, e.g. 'White straw cup almost empty — refill straws', else empty", "sure": true|false}`;
    const r=await A.sample.json(prompt,{images:refB?[blob,refB]:[blob],modelTier:'default'});
    const dup=photoDup(hash,type,slot,date,id);
    const res={photo:id,ok:r?.ok!==false&&!dup,issue:dup?`Looks like the same photo as ${fmtD(dup,{month:'short',day:'numeric'})}`:String(r?.issue||'').slice(0,120),sure:r?.sure!==false,at:new Date().toISOString(),...(dup?{dup}:{})};
    const k=`${loc}_${date}_${type}`;const cur=D.photos[k];if(cur?.photos?.[slot]?.id!==id)return;   // replaced meanwhile
    await A.db.doc(`photoLogs/${k}`).update({ai:{[slot]:res}});
    D.photos[k]={...cur,ai:{...(cur.ai||{}),[slot]:res}};
    if(!res.ok&&SH)toast(`AI: ${sl.name} — ${res.issue}`);
  }catch(e){console.warn('ai photo',e)}finally{delete AIC[id];if(SH)drawSheet();render()}}
// what to show on a tile
function aiChip(doc,slot){const p=doc?.photos?.[slot];if(!p)return '';if(AIC[p.id])return `<span class="chip" style="border:0">AI checking…</span>`;
  const a=doc?.ai?.[slot];if(!a||a.photo!==p.id)return '';
  return a.ok?`<span class="chip ok" style="border:0" title="AI found no problem">AI ✓</span>`:`<span class="chip warn" style="border:0;white-space:normal;text-align:left" title="AI note">AI: ${esc(a.issue||'check this photo')}</span>`}
const aiIssues=doc=>Object.entries(doc?.ai||{}).filter(([sl,a])=>!a.ok&&doc.photos?.[sl]?.id===a.photo).length;
// managers: check photos that never got an AI result (e.g. AI was busy when staff uploaded)
function aiBackfill(date,type){if(!A.sample)return;const doc=photoDoc(date,type);if(!doc)return;
  Object.entries(doc.photos||{}).forEach(([slot,p])=>{if(!AIC[p.id]&&doc.ai?.[slot]?.photo!==p.id)aiCheckPhoto({type,slot,date,loc:curLoc(),id:p.id})})}
/* today's plan for a task, per store and date (config/tasknotes: staff read, managers write) */
// a note for that date, else the store's repeating note for that weekday (e.g. which deep-cleaning area is due)

function unitAt(it,st){const P=D.prices?.[it.id]?.[st];
  if(P&&num(P.price)>0&&num(P.per)>0&&Date.now()-Date.parse(P.at)<21*864e5)return{u:num(P.price)/num(P.per),price:num(P.price),per:num(P.per),label:P.product,url:P.url,src:'web',at:P.at,stock:P.stock,note:P.note||''};
  const h=Object.values(D.orders).filter(o=>o.store===st&&o.kind!=='stockin').sort((a,b)=>String(b.receivedDate||b.date).localeCompare(String(a.receivedDate||a.date)))
    .flatMap(o=>(o.lines||[]).filter(l=>l.itemId===it.id&&num(l.price)>0&&num(l.qty)>0).map(l=>({o,l})))[0];
  if(h){const per=lineMult(h.l),price=num(h.l.price)*orderFactor(h.o)/num(h.l.qty);return{u:price/per,price,per,label:h.l.name,src:'paid',at:h.o.receivedDate||h.o.date}}
  const b=(it.buy||[]).find(x=>x.store===st&&num(x.price)>0&&num(x.per)>0);if(b)return{u:num(b.price)/num(b.per),price:num(b.price),per:num(b.per),label:b.label,src:'item',buyId:b.id};
  return null}

function orderApply(st,r){if(r.store&&STORES.includes(r.store))st.store=r.store;{const ml=matchLoc(r.deliveryAddress);if(ml){st.loc=ml;st.locFound=true}}if(r.orderDate&&/^\d{4}-\d{2}-\d{2}$/.test(r.orderDate)){st.date=r.orderDate;st.expected=addDays(r.orderDate,1)}st.gotDel=false;if(r.deliveryDate&&/^\d{4}-\d{2}-\d{2}$/.test(r.deliveryDate)){st.expected=r.deliveryDate;st.gotDel=true}if(r.deliveryWindow)st.window=String(r.deliveryWindow).slice(0,40);if(r.orderNo)st.orderNo=String(r.orderNo).replace(/[^0-9-]/g,'').slice(0,30);if(num(r.total)>0)st.total=num(r.total);

async function orderRead(){const st=SH_ORDER;if(!st.shots.length||!A.sample)return;st.msg2='';grabOrderLines();st.busy=true;st.msg='';drawSheet();
  const prompt=`You are reading ${st.shots.length} screenshot(s) of online grocery / wholesale orders (usually BJ's Wholesale Club or Walmart) for a matcha and bubble tea shop. The images are numbered 0 to ${st.shots.length-1} in the order given.

Return JSON only, shaped exactly: {"orders":[{"screenshots":[image numbers in this order],"store":"BJ's"|"Walmart"|"Glacier Point"|"Other","orderDate":"YYYY-MM-DD" or null,"deliveryDate":"YYYY-MM-DD" or null,"deliveryWindow":string or null,"deliveryAddress":string or null,"orderNo":string or null,"total":number or null,"lines":[{"name":string,"qty":number,"price":number or null,"itemId":string or null}]}]}
deliveryDate is the scheduled or estimated delivery/pickup date shown (e.g. "Arrives Thu, Oct 16", "Delivery scheduled"); use the year of the order date if no year is shown; today is ${today()}. deliveryWindow is the time window shown, short form like "2pm-4pm", else null. deliveryAddress is the delivery or shipping address shown (or the billing address if no delivery address is shown), else null. orderNo is the order number shown (digits and dashes only, e.g. 6700501480 or 2000154-47332041), else null. total is the order total paid in dollars, else null.
Rules: include only purchased products (no fees, tax, totals, savings). qty is the number of units/packs ordered as shown. price is the total paid for that line (qty times unit price) in dollars. Keep names short.
Set itemId to the id of the matching shop inventory item below when the product is clearly the same thing, otherwise null.
When the item has buy sizes, set buyId to the size that matches what was bought (by package size/weight), else null; qty is then the number of that size.
Inventory items: ${JSON.stringify(D.items.map(i=>({id:i.id,name:i.name,countUnit:i.unit||'',buy:buyOpts(i).map(o=>({id:o.id,size:o.label,holds:o.per}))})))}`;
  try{const lim=(await A.sample.limits().catch(()=>null))?.images?.maxCount||st.shots.length;let r=await A.sample.json(prompt,{images:st.shots.slice(0,lim).map(x=>x.blob),modelTier:'default'});if(st.shots.length>lim)st.msg2=`Only the first ${lim} screenshots could be read at once.`;
    const all=st.shots.slice();let os=Array.isArray(r?.orders)?r.orders.filter(o=>o&&Array.isArray(o.lines)):Array.isArray(r?.lines)?[r]:[];
    if(os.length>1){const used=new Set();os=os.map(o=>{const ix=(Array.isArray(o.screenshots)?o.screenshots:[]).map(Number).filter(i=>i>=0&&i<all.length&&!used.has(i));ix.forEach(i=>used.add(i));return{...o,_shots:ix.map(i=>all[i])}});
      const left=all.filter((_,i)=>!used.has(i));if(left.length)os[0]._shots=[...os[0]._shots,...left];
      st.shots=os[0]._shots.length?os[0]._shots:all;st.queue=os.slice(1);st.split=os.length}
    r=os[0]||null;

  catch(e){console.warn(e);st.msg=e?.code==='not_granted'?L('Allow Claude access when asked to use automatic reading.','需要允许 Claude 访问才能自动识别。'):e?.code==='rate_limited'?L('Too many requests. Try again in a minute.','请求太频繁，请稍后再试。'):L('Could not read this screenshot. Enter items below.','无法识别这张截图，请手动填写。')}
  st.busy=false;drawSheet()}
