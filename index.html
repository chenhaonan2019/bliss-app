<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: phone-first app shell — sticky header, single scrolling column, fixed bottom tab bar, full-screen sheets for tasks */
:root{
  --bg:#F3F6EF; --surface:#FFFFFF; --sunk:#E8EEE2; --line:#D9E1D1;
  --ink:#1C2419; --muted:#626D5C; --brand:#4E6B45; --brand-ink:#FFFFFF; --matcha:#A7C06B;
  --ok:#1F8A55; --ok-bg:#DDF2E5; --warn:#B7700E; --warn-bg:#FCEBCB; --bad:#C0392F; --bad-bg:#F9DEDA; --info:#2C6A9E; --info-bg:#DCEAF6;
  --st0:#C9CFC4; --st1:#F2A93B; --st2:#2DB36F;
  --display:"Bricolage Grotesque","Figtree","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --body:"Figtree","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11160F; --surface:#1A2117; --sunk:#232B20; --line:#2F3A2B;
  --ink:#E6ECE1; --muted:#9AA592; --brand:#8DB27C; --brand-ink:#10170D; --matcha:#B9D07E;
  --ok:#5ACB8C; --ok-bg:#183626; --warn:#E9AE4E; --warn-bg:#3A2B12; --bad:#EE7A6E; --bad-bg:#3E1D19; --info:#7DB6E6; --info-bg:#172C3D;
  --st0:#3A4436; --st1:#C98A27; --st2:#249A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11160F; --surface:#1A2117; --sunk:#232B20; --line:#2F3A2B;
  --ink:#E6ECE1; --muted:#9AA592; --brand:#8DB27C; --brand-ink:#10170D; --matcha:#B9D07E;
  --ok:#5ACB8C; --ok-bg:#183626; --warn:#E9AE4E; --warn-bg:#3A2B12; --bad:#EE7A6E; --bad-bg:#3E1D19; --info:#7DB6E6; --info-bg:#172C3D;
  --st0:#3A4436; --st1:#C98A27; --st2:#249A5D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;line-height:1;margin-right:auto}
.logo .mk{width:38px;height:38px;flex:none;display:block}
.logo .tx{display:flex;flex-direction:column}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em}
.logo small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-top:3px}
.hbtn{background:color-mix(in srgb,var(--brand-ink) 16%,transparent);border:0;color:var(--brand-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flush{padding:0;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--sunk)}
.li .t{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.brand{background:var(--brand);color:var(--brand-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn:focus-visible,#ownsel,#locsel{max-width:52vw;appearance:auto;font-size:15px;padding:8px 14px}#ownsel option,#locsel option{color:#1C2419;background:#fff}
.hbtn:focus-visible,.tab:focus-visible,.li:focus-visible,.pill:focus-visible{outline:2px solid var(--matcha);outline-offset:2px}
.big{font-size:18px;min-height:58px;border-radius:16px}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatches label{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 2px;border-radius:12px;border:2px solid transparent}.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}.swatches .sw{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}.swatches small{font-size:11px;font-weight:600;color:var(--muted)}.swatches label:has(input:checked){border-color:var(--ink);background:var(--surface)}.swatches label:has(input:checked) small{color:var(--ink)}.swatches label:has(input:focus-visible){outline:2px solid var(--matcha)}
.seg.rad label{flex:1;position:relative;cursor:pointer}.seg.rad input{position:absolute;opacity:0;inset:0}.seg.rad span{display:block;text-align:center;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}.seg.rad input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}.seg.rad input:focus-visible+span{outline:2px solid var(--matcha)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 auto}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:center;min-width:52px}
.chips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chips button b{display:block;font-size:16px}
.chips button{position:relative}
.guide p{margin:6px 0}.gl{margin:6px 0 10px;padding-left:22px}.gl li{margin:4px 0;line-height:1.45}.gh{margin:14px 0 4px;font-size:15px}.gh:first-child{margin-top:0}
.gwarn{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;font-weight:600}
.gtbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}.gtbl th,.gtbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.gtbl th{background:var(--sunk);font-weight:700}
.grid-ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.grid-ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}.nobk{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.chips button span{font-size:11px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--brand)}
.tab .bdg{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-height:44px}
textarea.in{min-height:80px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--matcha);border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sheet .sh h2{font-size:18px;flex:1;min-width:0}
.sheet .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .sb>.wrap{padding-block:16px 24px}
.sheet .sf{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px}
.sheet .sf .btn{flex:1}
.x{border:0;background:var(--sunk);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border-radius:12px;overflow:hidden;background:var(--sunk);border:1px dashed var(--line);aspect-ratio:4/3;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;text-align:center;padding:8px}
.tile.has{border:0;padding:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgb(0 0 0/.72));color:#fff;padding:18px 8px 6px;font-size:12px;text-align:left}
.tile .flag{position:absolute;top:6px;right:6px}
.tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tile.busy::after{content:"";position:absolute;inset:0;background:rgb(255 255 255/.5)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.thumbs img,.thumbs .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--sunk);display:block;cursor:pointer}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:inherit}
.tbl tbody tr{background:var(--surface)}
.tbl td.neg{color:var(--bad)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--st0)}
.bar i{display:block;height:100%}
.bar .b2{background:var(--st2)}.bar .b1{background:var(--st1)}
/* board (monday-style) */
.grp{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.grp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-left:6px solid var(--gc);cursor:pointer}
.grp-h h3{color:var(--gc);flex:1}
.grp-cols{display:grid;grid-template-columns:1fr 132px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 0 6px 14px;border-left:6px solid var(--gc);border-top:1px solid var(--line)}
.grp-r{display:grid;grid-template-columns:1fr 132px;align-items:stretch;border-top:1px solid var(--line);border-left:6px solid color-mix(in srgb,var(--gc) 45%,transparent)}
.grp-r .n{padding:11px 14px;font-weight:500}
.pill{border:0;border-left:1px solid var(--line);font-weight:700;font-size:13px;color:#fff;cursor:pointer;background:var(--st0)}
.pill.s0{color:var(--muted)}.pill.s1{background:var(--st1)}.pill.s2{background:var(--st2)}
.pill[disabled]{cursor:default}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.score{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.sig{width:100%;height:120px;border:1px dashed var(--line);border-radius:10px;background:var(--surface);touch-action:none;display:block}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pin button{height:62px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.pindots{display:flex;gap:12px;justify-content:center;margin:12px 0 20px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.pindots i.f{background:var(--brand)}
.cele{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgb(0 0 0/.28);overflow:hidden;animation:cfade .2s ease-out;cursor:pointer}
.cele-box{position:relative;background:var(--surface);color:var(--ink);border-radius:22px;padding:26px 30px;text-align:center;display:grid;gap:6px;justify-items:center;max-width:300px;box-shadow:0 20px 50px rgb(0 0 0/.25);animation:cpop .45s cubic-bezier(.2,1.5,.4,1)}
.cele-box b{font-family:var(--display);font-size:22px}.cele-box span{color:var(--muted);font-size:14px}
.cele-check svg{width:76px;height:76px}.cele-check circle{fill:var(--ok-bg);stroke:var(--ok);stroke-width:3}
.cele-check path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44;animation:cdraw .45s .25s ease-out forwards}
.cele i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:cfall 2s ease-in forwards}
.cele.small{background:transparent;pointer-events:none}.cele.small .cele-box{padding:18px 22px}.cele.small .cele-check svg{width:56px;height:56px}.cele.small b{font-size:18px}
@keyframes cfade{from{opacity:0}}@keyframes cpop{from{transform:scale(.6);opacity:0}}@keyframes cdraw{to{stroke-dashoffset:0}}@keyframes cfall{to{transform:translateY(112vh) rotate(620deg)}}
@media (prefers-reduced-motion: reduce){.cele,.cele *{animation:none!important}.cele-check path{stroke-dashoffset:0}.cele i{display:none}}
.drag{flex:none;width:30px;align-self:stretch;display:grid;place-items:center;cursor:grab;touch-action:none;color:var(--muted);font-size:18px;letter-spacing:-3px;user-select:none;-webkit-user-select:none;border-radius:8px}
.drag:hover{background:var(--sunk)}.dragging{box-shadow:0 12px 30px rgb(0 0 0/.2);border-radius:12px;opacity:.97;cursor:grabbing}.drag-ph{background:var(--sunk);border:2px dashed var(--line);border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0/.25)}
.viewer{position:fixed;inset:0;z-index:70;background:rgb(0 0 0/.92);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px));color:#fff;align-items:center}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:13px}
.hint.warn{background:var(--warn-bg);color:var(--warn)}
details.std summary{cursor:pointer;font-size:13px;color:var(--info);font-weight:600}
details.std ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.evarea{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:start}
.clock{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>

<body>


<header class="top"><div class="wrap" id="hdr"><div class="logo"><img class="mk" src="logo-mark.png" alt=""><span class="tx"><b>BLISS</b><small>Matcha &amp; Beyond</small></span></div></div></header>
<main><div class="wrap" id="view"><div class="empty"><b>Loading…</b>Connecting to the shop data</div></div></main>
<nav class="tabs" id="nav" hidden><div class="in" id="navin"></div></nav>
<div id="sheet"></div>
<div id="viewer"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
"use strict";
/* ---------- basics ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem('bliss.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('bliss.'+k,v)}catch(e){}}};
const curLang=()=>'en';
const L=(en,zh)=>curLang()==='zh'?zh:en;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ymd(new Date());
const bizDate=()=>{const n=new Date();if(n.getHours()<4)n.setDate(n.getDate()-1);return ymd(n)};

async function compress(file){try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));return b||file}catch(e){return file}}
async function uploadImg(file){if(!A.assets){toast(L('Photo upload is not available on this account. Ask the manager.','此账号不能上传照片，请联系经理。'));return null}
  const b=await compress(file);const type=b.type&&['image/jpeg','image/png','image/webp','image/gif'].includes(b.type)?b.type:'image/jpeg';
  try{const r=await A.assets.upload(b,{type});return r.id}catch(e){console.warn(e);toast(errMsg(e));return null}}

  (CFGK(gk).sections||[]).forEach(sec=>{let a=0,b=0;(sec.items||[]).forEach(it=>{const v=tp[pre+sec.id+'__'+it.id]||0;tot++;if(v===1){s1++;a++}if(v===2){s2++;b++}});per[sec.id]={n:(sec.items||[]).length,s1:a,s2:b}});return{tot,s1,s2,per}}
const barHtml=(n,s1,s2)=>n?`<div class="bar" title="${s2}/${n}"><i class="b2" style="width:${s2/n*100}%"></i><i class="b1" style="width:${s1/n*100}%"></i></div>`:'';
function trainTabs(emp,editable){const has=(D.guideCfg?.sections||[]).length;const k=UI.tbk||(has?'guide':'training');
  return `<div class="stack">${editable?'':`<h2>${L('My training','我的培训')}</h2>`}<div class="seg" role="tablist" aria-label="Lists">${['guide','training'].map(x=>{const S=trainStats(emp,x);return `<button role="tab" class="${k===x?'on':''}" data-act="tbk" data-k="${x}">${LISTNAME(x)} <span class="tiny">${S.tot?Math.round(S.s2/S.tot*100):0}%</span></button>`}).join('')}</div>${trainBoard(emp,editable,k)}</div>`}
function trainBoard(emp,editable,gk){gk=gk||'training';const pre=kpre(gk);const cfg=CFGK(gk),tp=D.training[emp]||{};const st=tp.status||{};const S=trainStats(emp,gk);
  if(!(cfg.sections||[]).length)return `<div class="empty card"><b>No ${LISTNAME(gk).toLowerCase()} yet</b>${editable?`<button class="btn sm" data-act="trainEdit" data-k="${gk}">Add it</button>`:''}</div>`;
  const lbl=v=>v===2?null:v===1?L('Shown','已教过'):L('Not started','未开始');
  return `<div class="stack">
  <div class="card stack"><div class="row"><div class="grow"><div class="eyebrow">${LISTNAME(gk)}</div><div style="font-family:var(--display);font-weight:800;font-size:28px">${S.tot?Math.round(S.s2/S.tot*100):0}%</div></div><div class="small muted" style="text-align:right">${S.s2} ${L('fluent','熟练')}<br>${S.s1} ${L('shown','已教过')}<br>${S.tot-S.s1-S.s2} ${L('not started','未开始')}</div></div>
  ${barHtml(S.tot,S.s1,S.s2)}<div class="legend"><span><i style="background:var(--st2)"></i>${L('Fluent / Satisfactory','熟练 / 合格')}</span><span><i style="background:var(--st1)"></i>${L('Shown','已教过')}</span><span><i style="background:var(--st0)"></i>${L('Not started','未开始')}</span></div>
  ${editable?`<div class="tiny muted">Tap an item's name for its how-to. Tap a status to move it forward: Not started → Shown → Fluent. Trainees can mark items Shown themselves; only managers mark Fluent.</div>`:`<div class="tiny muted">Tap an item's name to read how to do it. Tap the status to mark it <b>Shown</b> once you have been taught it. Your manager marks it <b>${esc(D.trainCfg.sections[0]?.doneLabel||'Fluent')}</b> when you can do it on your own.</div>`}</div>
  ${editable?`<div class="row"><span class="grow"></span><button class="btn sm" data-act="trainEdit" data-k="${gk}">${ic('list')} Edit ${LISTNAME(gk).toLowerCase()}</button></div>`:''}
  ${cfg.sections.map((sec,gi)=>{const p=S.per[sec.id];const open=UI.openGrp[pre+sec.id]!==false;const done=sec.doneLabel||'Fluent';
    return `<div class="grp" style="--gc:${GC[gi%GC.length]}"><div class="grp-h" data-act="grpToggle" data-id="${pre+sec.id}"><h3>${esc(sec.title)}</h3><span class="small muted">${sec.hours?sec.hours+' h · ':''}${p.s2}/${p.n} ${esc(done)}</span><div style="width:70px">${barHtml(p.n,p.s1,p.s2)}</div></div>
    ${open?`<div class="grp-cols"><span>${L('Item','项目')}</span><span style="text-align:center">${L('Status','状态')}</span></div>${(sec.items||[]).map(it=>{const k=pre+sec.id+'__'+it.id,v=tStat(emp,k);const selfEd=!editable&&mode()==='emp'&&v<2;
      return `<div class="grp-r"><div class="n tap" data-act="guideGo" data-k="${gk}" data-s="${sec.id}" data-i="${it.id}" data-emp="${emp}" tabindex="0" role="button" style="cursor:pointer">${esc(it.name)}${it.body||(it.photos||[]).length?' <span style="color:var(--brand);font-weight:700">›</span>':''}</div><button class="pill s${v}" ${editable?`data-act="trainCycle" data-emp="${emp}" data-k="${k}"`:selfEd?`data-act="trainSelf" data-emp="${emp}" data-k="${k}" aria-label="Mark ${esc(it.name)} as ${v?'not started':'shown'}"`:'disabled'}>${v===2?esc(done):lbl(v)}</button></div>`}).join('')}
      ${editable&&gk==='training'?`<div class="grp-r" style="grid-template-columns:1fr"><button class="btn sm" style="margin:8px 14px;justify-self:start" data-act="trainAddItem" data-sec="${sec.id}">${ic('plus')} ${L('Add item','添加项目')}</button></div>`:''}`:''}</div>`}).join('')}
  ${gk!=='training'?'':docList(cfg).length||editable?`<div class="card stack"><div class="row"><h3 class="grow">${L('Documents to read','必读文档')}</h3>${editable?`<button class="btn sm" data-act="trainEdit">Edit</button>`:''}</div>${docList(cfg).map(dc=>{const r=tp.docs?.[dc.id];const f=dc.file&&(D.files||[]).find(x=>x.id===dc.file);return `<div class="row">${editable?`<input type="checkbox" id="doc_${esc(dc.id)}" data-act="trainDoc" data-emp="${emp}" data-k="${esc(dc.id)}" ${r?'checked':''}>`:(r?ic('check'):'<span style="width:20px"></span>')}<label for="doc_${esc(dc.id)}" class="grow">${esc(dc.name)}</label>${f?`<a class="btn sm" href="${BLOB}${esc(f.path)}" target="_blank" rel="noopener">Open</a>`:''}${r?chip('ok',L('Read','已读')):''}</div>`}).join('')||'<div class="small muted">No documents yet. Tap Edit to add them.</div>'}</div>`:''}
  ${gk!=='training'?'':`<div class="card stack"><h3>${L('Training time log','培训时间记录')}</h3>
  ${(tp.sessions||[]).length?(tp.sessions||[]).map((s,i)=>`<div class="row"><span class="chip">${i+1}</span><div class="grow">${fmtD(s.date)} · ${esc(s.time||'')}${s.trainer?` · ${L('with','带教')} ${esc(s.trainer)}`:''}</div>${editable?`<button class="btn sm bad" data-act="trainDelSess" data-emp="${emp}" data-i="${i}" aria-label="${L('Delete','删除')}">${ic('x')}</button>`:''}</div>`).join(''):`<div class="muted small">${L('No sessions logged yet.','还没有记录。')}</div>`}
  ${editable?`<div class="g3"><input class="in" type="date" id="ts_date" value="${today()}"><input class="in" id="ts_time" placeholder="9:30-18:00"><input class="in" id="ts_tr" placeholder="${L('Trainer','带教人')}"></div><button class="btn" data-act="trainAddSess" data-emp="${emp}">${ic('plus')} ${L('Add session','添加记录')}</button>`:''}</div>`}
  </div>`}

if(x.k==='review')return `<div class="li tap" data-act="goPhotos" data-d="${x.d}">${chip('info',L('Review','待检查'))}<div class="grow">${esc(taskName(x.type))} · ${fmtD(x.d,{month:'short',day:'numeric'})}</div>${ic('chev')}</div>`;
    if(x.k==='late')return `<div class="li tap" data-act="orderView" data-id="${x.o.id}">${chip('warn','Delivery')}<div class="grow">${esc(x.o.store)} · due ${fmtD(x.o.expected,{month:'short',day:'numeric'})}, not received yet</div>${ic('chev')}</div>`;
    if(x.k==='order')return `<div class="li tap" data-act="orderView" data-id="${x.o.id}">${chip('bad',L('Delivery','收货'))}<div class="grow">${esc(x.o.store)} · ${x.o.diffs?`${x.o.diffs} item${x.o.diffs>1?'s':''} counted differently than ordered`:'problem reported'}</div>${ic('chev')}</div>`;
    if(x.k==='avail')return `<div class="li tap" data-act="goAvail">${chip('warn',L('Availability','可上班时间'))}<div class="grow">${esc(empName(x.e))} ${L('updated','已更新')}</div>${ic('chev')}</div>`;

    if(x.k==='link')return `<div class="li tap" data-act="goTeam">${chip('info',L('New account','新账号'))}<div class="grow">${L('Someone is waiting to be linked','有员工等待关联账号')}</div>${ic('chev')}</div>`;
    if(x.k==='punch')return `<div class="li tap" data-act="punchEdit" data-id="${x.p.id}">${chip('bad',L('Clock-out','下班卡'))}<div class="grow">${esc(empName(x.p.empId))} · ${fmtD(x.p.date,{month:'short',day:'numeric'})} ${L('missing clock-out','忘记下班打卡')}</div>${ic('chev')}</div>`;return''}).join('')}</div>`:''}
function vHome(){const d=bizDate();const sh=shiftsOn(d);const att=attention();const lc=latestCount();
  const low=D.items.filter(it=>{const s=stockStatus(it,stockQty(it.id)?.q)[0];return s==='bad'||s==='warn'}).length;
  const onNow=Object.values(D.punches).filter(p=>!p.out&&p.date===d&&locOf(p.empId)===curLoc()).length;const tdone=tasksOn(d).filter(T=>['ontime','late'].includes(taskState(d,T.type).st)).length+(C()[d]?1:0);

  <div class="stats"><div class="stat"><b>${onNow}</b><span>${L('Clocked in now','正在上班')}</span></div><div class="stat"><b>${tdone}/${tasksOn(d).length+1}</b><span>${L('Tasks done','任务完成')}</span></div><div class="stat"><b style="color:${low?'var(--warn)':'inherit'}">${low}</b><span>${L('Low / out items','库存偏低')}</span></div><div class="stat"><b>${arriving}</b><span>${L('Deliveries due','待到货')}</span></div></div>

  ${reviewCard()}

    if(!p)c=Date.now()>atTime(d,s.start).getTime()+(D.settings.lateGrace||0)*6e4?chip('bad',L('Not clocked in','未打卡')):chip('',L('Not started','未开始'));

    else c=chip(p.late?'warn':'ok',`${fmtH(ps.reduce((a,x)=>a+punchHrs(x),0))} h`+(p.late?L(` · late ${p.late}m`,` · 迟到${p.late}分`):''));

   :`<div class="card empty"><b>${L('No shifts scheduled today','今天没有排班')}</b><button class="btn sm" data-act="tab" data-k="sched">${L('Open schedule','去排班')}</button></div>`}

function vStock(){const s=curSub('stock','now');
  return `<div class="stack"><h2>${L('Stock & orders','库存与订货')}</h2>${subTabs('stock',[['now',L('Stock','库存')],['use',L('Usage','消耗')],['orders',L('Orders','订单')],['items',L('Items','物品')]])}

function stockNow(){const rows=usageRows();const sug=suggestions();const flt=UI.stF||'all';
  const tiles=FREQS.map(([f,n])=>{const its=itemsOf(f);if(!its.length)return'';const g=groupState(f);const last=groupLast(f,addDays(bizDate(),1));
    const [k,t]=g.st==='done'?['ok','Done today']:g.st==='overdue'?['bad','Overdue']:g.st==='due'?['warn',f==='daily'?'Tonight':'Due today']:['',`Next ${fmtD(g.next,{weekday:'short'})}`];
    return `<div class="card stack" style="min-width:0;gap:8px"><div class="row"><b class="grow">${n}</b>${chip(k,t)}</div><div class="small muted">${its.length} items · ${daysTxt(f)}${MGR_ONLY_FREQ.includes(f)?' · manager counts':''}<br>${last?`Last ${fmtD(last.date,{month:'short',day:'numeric'})}${last.by?' · '+esc(empName(last.by).split(' ')[0]):''}`:'Not counted yet'}</div><button class="btn sm ${g.st==='due'||g.st==='overdue'?'pri':''}" data-act="countSheet" data-f="${f}">Count ${n.toLowerCase()} items</button></div>`}).join('');
  const all=D.items.map(it=>{const sq=stockQty(it.id);const lq=sq&&sq.date?{q:sq.q-sq.rec,date:sq.date,rec:sq.rec}:sq?{date:null,rec:sq.rec}:null;const q=sq?.q??null;return{it,q,lq,st:stockStatus(it,q),f:itemFreq(it)}});
  const base=all.filter(x=>(UI.stT||'all')==='all'||itemType(x.it)===UI.stT);const lowN=base.filter(x=>['bad','warn'].includes(x.st[0])).length;const fN=f=>base.filter(x=>x.f===f).length;
  const tf=UI.stT||'all';const shown=all.filter(x=>(tf==='all'||itemType(x.it)===tf)&&(flt==='all'||(flt==='low'?['bad','warn'].includes(x.st[0]):x.f===flt)));
  const cats=[...new Set(shown.map(x=>x.it.cat||'Other'))];
  return `<div class="g2"><button class="btn pri" data-act="itemEdit">${ic('plus')} Add item</button><button class="btn" data-act="orderList">${ic('list')} Order list${sug.length?` · ${sug.length}`:''}</button></div>
  <button class="btn" data-act="stockIn">${ic('box')} Add stock (wholesale, no delivery check)</button>
  ${D.items.length?`<div class="eyebrow">Counts</div><div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${tiles}</div>
  <div class="row" style="justify-content:space-between"><span class="eyebrow">Sections</span><button class="btn sm" data-act="typesEdit">${ic('list')} Edit sections</button></div>
  <div class="seg wrap" role="tablist" aria-label="Item type">${[['all','All'],...TYPES()].map(([k,n])=>`<button role="tab" class="${tf===k?'on':''}" data-act="stT" data-k="${k}">${n} <span class="muted" style="font-weight:400">${k==='all'?all.length:all.filter(x=>itemType(x.it)===k).length}</span></button>`).join('')}</div>
  <div class="chips" role="tablist">${[['all',`All ${base.length}`],...FREQS.filter(([f])=>itemsOf(f).length).map(([f,n])=>[f,`${n} ${fN(f)}`]),['low',`Low ${lowN}`]].map(([k,n])=>`<button role="tab" class="${flt===k?'on':''}" data-act="stF" data-k="${k}" style="padding:7px 12px"><b style="font-size:13px">${n}</b></button>`).join('')}</div>
  ${shown.length?TYPES().map(([t,tn])=>{const tc=cats.filter(c=>shown.some(x=>(x.it.cat||'Other')===c&&itemType(x.it)===t));return tc.length?`${tf==='all'?`<h3 style="margin-top:4px">${tn}</h3>`:''}`+tc.map(c=>`<div class="card flush"><div class="li" style="min-height:0;padding-block:8px;background:var(--sunk)"><span class="eyebrow grow">${esc(c)}</span></div><div class="list">${shown.filter(x=>(x.it.cat||'Other')===c&&itemType(x.it)===t).map(({it,q,lq,st,f})=>{const av=avgDaily(it.id,rows);const left=av&&av>0&&q!=null?q/av:null;
    return `<div class="li tap" data-act="itemEdit" data-id="${it.id}" tabindex="0"><div class="grow"><div class="t">${esc(it.name)}</div><div class="small muted">${freqName(f)}${lq?.date?` · counted ${fmtD(lq.date,{month:'numeric',day:'numeric'})}`:''}${lq?.rec?` · +${Math.round(lq.rec*100)/100} received since`:''}${av!=null?` · ${Math.round(av*10)/10}/day`:''}${left!=null?` · ≈${Math.floor(left)} days left`:''}</div></div><div style="text-align:right;min-width:72px"><div style="font-weight:700;font-size:17px">${q??'—'} <span class="small muted" style="font-weight:400">${esc(it.unit||'')}</span></div>${qtyText(it,q)?`<div class="tiny muted">${esc(qtyText(it,q))}</div>`:''}${chip(st[0],st[1])}</div></div>`}).join('')}</div></div>`).join(''):''}).join(''):`<div class="empty card">Nothing here.</div>`}
  ${Object.keys(C()).length>1?`<button class="btn sm" data-act="countHist" style="align-self:flex-start">Count history</button>`:''}`
  :`<div class="empty card"><b>No items yet</b>Tap "Add item" to add what staff should count.</div>`}`}
function stockUse(){const rows=usageRows();if(!rows.length)return `<div class="empty card"><b>${L('Usage appears after two counts','盘点两次后显示消耗')}</b>${L('Usage = previous count + deliveries received − current count.','消耗 = 上次剩余 + 期间到货 − 本次剩余')}</div>`;
  const show=rows.slice(-10).reverse();
  return `<div class="hint">${L('Usage = previous count + deliveries received − today’s count. Negative numbers usually mean a counting mistake or an unrecorded delivery.','消耗 = 上次剩余 + 期间到货 − 本次剩余。出现负数通常是盘点错误或有到货没登记。')}</div>
  <div class="tbl"><table><thead><tr><th>${L('Item','物品')}</th><th>${L('Avg/day','日均')}</th>${show.map(r=>`<th>${fmtD(r.date,{month:'numeric',day:'numeric'})}${r.days>1?` (${r.days}d)`:''}</th>`).join('')}</tr></thead>
  <tbody>${D.items.map(it=>{const av=avgDaily(it.id,rows);return `<tr><td>${esc(it.name)} <span class="muted tiny">${esc(it.unit||'')}</span></td><td><b>${av==null?'—':Math.round(av*10)/10}</b></td>${show.map(r=>{const v=r.u[it.id];return `<td class="${v<0?'neg':''}">${v==null?'—':v}${r.rec[it.id]?`<span class="tiny muted"> +${r.rec[it.id]}</span>`:''}${v!=null&&r.ud?.[it.id]>1?`<div class="tiny muted">${r.ud[it.id]} days</div>`:''}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div>

function payroll(ps,pl){const pe=addDays(ps,pl-1);const res={};Object.values(D.employees).filter(e=>locOf(e.id)===curLoc()).forEach(e=>{const P=Object.values(D.punches).filter(p=>p.empId===e.id&&p.date>=ps&&p.date<=pe);
    const W_=wageOf(e.id),TR=trainOf(e.id);let hrs=0,ot=0,pH=0,cH=0,payPay=0,cashPay=0,trH=0,trPay=0;
    for(let w=0;w<pl;w+=7){const a=addDays(ps,w),b=addDays(ps,Math.min(w+6,pl-1));const Pw=P.filter(p=>p.date>=a&&p.date<=b);const h=Pw.reduce((s,p)=>s+punchHrs(p),0);const o=Math.max(0,h-(D.settings.otWeekly||40));hrs+=h;ot+=o;
      const th=Pw.filter(p=>inTraining(e.id,p.date)).reduce((s,p)=>s+punchHrs(p),0),rh=h-th;const oR=Math.min(o,rh),oT=o-oR;
      const[ph,ch]=splitHrs(rh,W_);const oc=Math.min(ch,oR),op=oR-oc;pH+=ph;cH+=ch;
      payPay+=(ph-op)*W_.pay+op*W_.pay*1.5;cashPay+=(ch-oc)*W_.cash+oc*W_.cash*1.5;
      if(th){const tp=th*TR.rate+oT*TR.rate*.5;trH+=th;trPay+=tp;if(TR.via==='cash'){cashPay+=tp;cH+=th}else{payPay+=tp;pH+=th}}}
    const late=P.filter(p=>p.late>0);const sched=Object.values(D.shifts).filter(s=>s.empId===e.id&&s.date>=ps&&s.date<=pe).reduce((s,x)=>s+shiftHrs(x),0);
    const tasks=Object.values(D.photos).filter(x=>x.completedBy===e.id&&x.date>=ps&&x.date<=pe);const onT=tasks.filter(x=>taskState(x.date,x.type,x.loc).st==='ontime').length;const issues=tasks.filter(x=>x.review?.status==='issue').length;
    let bon=null;if(bonusOn()){const days=bonusDays(e.id,P);const okN=days.filter(x=>x.ok).length;bon={days,ok:okN,amt:seePay()?okN*num(bonusCfg().perShift):0};if(bon.amt){if(bonusCfg().via==='cash')cashPay+=bon.amt;else payPay+=bon.amt}}
    const rate=W_.pay||W_.cash||TR.rate;const pay=payPay+cashPay;
    if(P.length||sched)res[e.id]={e,P,bon,hrs,ot,late:late.length,lateMin:late.reduce((s,p)=>s+p.late,0),sched,tasks:tasks.length,onT,issues,rate,pay,payPay,cashPay,pH,cH,trH,trPay,TR,W:W_,type:payType(e.id),open:P.filter(p=>!p.out).length}});return res}

/* ---------- AI photo check ----------
   After a task photo is saved, Claude looks at it (with the item's example photo when there is one) and says whether
   the item looks done; a fingerprint of the picture also catches the same photo being reused. Results are saved on the
   photo log as ai[slot] = {photo, ok, issue, dup, at} and shown to staff right away and to managers in Review.
   AI only points things out; the manager still decides Passed / Has issues. */
const AIC={};                       // running checks: photo id → true
async function photoHash(blob){     // 64-bit difference hash, as 16 hex chars
  try{const bm=await createImageBitmap(blob);const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');x.drawImage(bm,0,0,9,8);
    const px=x.getImageData(0,0,9,8).data;const g=i=>px[i*4]*.299+px[i*4+1]*.587+px[i*4+2]*.114;let bits='';
    for(let r=0;r<8;r++)for(let k=0;k<8;k++)bits+=g(r*9+k)>g(r*9+k+1)?'1':'0';
    return bits.match(/.{4}/g).map(b=>parseInt(b,2).toString(16)).join('')}catch(e){return null}}
const hamming=(a,b)=>{let n=0;for(let i=0;i<a.length;i++){let v=parseInt(a[i],16)^parseInt(b[i],16);while(v){n+=v&1;v>>=1}}return n};
// same picture already used for this item on another day (last ~30 days of logs)
function photoDup(hash,type,slot,date,id){if(!hash)return null;const ones=hamming(hash,'0000000000000000');if(ones<8||ones>56)return null;   // blank/very dark pictures look alike
  let best=null;
  Object.values(D.photos||{}).forEach(doc=>{if(doc.type!==type||doc.date===date)return;Object.entries(doc.photos||{}).forEach(([sl,p])=>{if(p.id===id||!p.hash||p.hash.length!==hash.length)return;
    if(hamming(hash,p.hash)<=5&&(!best||doc.date>best))best=doc.date})});return best}
async function blobOf(id){try{const r=await fetch(BLOB+id);return r.ok?await r.blob():null}catch(e){return null}}
async function aiCheckPhoto({type,slot,date,loc,id,blob,hash}){
  if(!A.sample||AIC[id])return;AIC[id]=true;drawSheet();
  try{const sl=slotsOf(type,date).find(x=>x.id===slot)||{name:slot};const T=TASKS().find(t=>t.type===type);
    blob=blob||await blobOf(id);if(!blob)return;hash=hash||await photoHash(blob);
    const refB=sl.ref?await blobOf(sl.ref):null;
    const prompt=`You check checklist photos for a matcha / bubble tea shop. Task: "${T?T.name():type}". Item: "${sl.name}".
Image 1 is the photo a staff member just took for this item.${refB?' Image 2 is the manager\'s example of how it should look when done properly.':''}
Read the item name literally and check every part of it:
- If it says replenished / restocked / refilled / stocked / topped up / filled, each thing it names must look well stocked. Look at every container, holder and cup: flag any that is empty, nearly empty or clearly much lower than the others (for example a straw cup with only a few straws left).
- Every thing the item names (e.g. napkins, straws, spoons, lids, cups) should be visible in the photo; flag what is missing.
- If it is a cleaning item, flag visible dirt, spills, sticky residue, crumbs, trash, overflowing bins, food or cups left out, items not put away.
- Flag a photo that doesn't show this item or is too dark, blurry or close to judge.${refB?'\n- Compare with the example and flag clear differences in setup or fill level.':''}
Do not flag lighting colour, angle, normal wear, or things the item doesn't ask about.
Return JSON only: {"ok": true|false, "issue": "if not ok, what to fix in at most 12 plain words, e.g. 'White straw cup almost empty — refill straws', else empty", "sure": true|false}`;
    const r=await A.sample.json(prompt,{images:refB?[blob,refB]:[blob],modelTier:'default'});
    const dup=photoDup(hash,type,slot,date,id);
    const res={photo:id,ok:r?.ok!==false&&!dup,issue:dup?`Looks like the same photo as ${fmtD(dup,{month:'short',day:'numeric'})}`:String(r?.issue||'').slice(0,120),sure:r?.sure!==false,at:new Date().toISOString(),...(dup?{dup}:{})};
    const k=`${loc}_${date}_${type}`;const cur=D.photos[k];if(cur?.photos?.[slot]?.id!==id)return;   // replaced meanwhile
    await A.db.doc(`photoLogs/${k}`).update({ai:{[slot]:res}});
    D.photos[k]={...cur,ai:{...(cur.ai||{}),[slot]:res}};
    if(!res.ok&&SH)toast(`AI: ${sl.name} — ${res.issue}`);
  }catch(e){console.warn('ai photo',e)}finally{delete AIC[id];if(SH)drawSheet();render()}}

function aiChip(doc,slot){const p=doc?.photos?.[slot];if(!p)return '';if(AIC[p.id])return `<span class="chip" style="border:0">AI checking…</span>`;
  const a=doc?.ai?.[slot];if(!a||a.photo!==p.id)return '';
  return a.ok?`<span class="chip ok" style="border:0" title="AI found no problem">AI ✓</span>`:`<span class="chip warn" style="border:0;white-space:normal;text-align:left" title="AI note">AI: ${esc(a.issue||'check this photo')}</span>`}

async function itemSave(id){const name=$('#it_name').value.trim();if(!name){toast(L('Enter a name','请填写名称'));return}

  ibGrab();const buy=IB.filter(b=>String(b.label||'').trim()&&num(b.per)>0).map(b=>({id:b.id||'b'+uidGen().slice(-5),label:b.label.trim(),store:b.store||'',per:num(b.per),...(num(b.price)>0?{price:num(b.price)}:{})}));
  if(IB.some(b=>String(b.label||'').trim()&&!(num(b.per)>0))){toast('Enter how many count units each size holds');return}

  {const bl=$('#it_bigl').value.trim(),bp=num($('#it_bigp').value);if(bl&&bp>1)it.big={label:bl,per:bp};else if(bl||bp!=null){if(bl&&!(bp>1)){toast('Enter how many count units the bigger unit holds');return}}}

let SH_ORDER=null;
function orderTotalsHtml(st){const o={store:st.store,fee:st.fee,feePct:st.feePct,lines:st.lines};const sub=orderSub(o),fee=orderFee(o);return `<div class="row"><span class="grow small muted">Items</span><span>${money(sub)}</span></div><div class="row"><span class="grow small muted">Delivery ${num(st.fee)!=null?'(entered $)':num(st.feePct)!=null?`(${st.feePct}%)`:`(${delivPct(st.store)}% usual)`}</span><span>${money(fee)}</span></div><div class="row"><span class="grow small muted">Order total</span><b>${money(sub+fee)}</b></div>`}
function grabOrderLines(){const st=SH_ORDER;if($('#o_fee')){st.feeUnit=$('#o_feeunit')?.value||st.feeUnit||'%';const v=num($('#o_fee').value);if(st.feeUnit==='%'){st.feePct=v;st.fee=null}else{st.fee=v;st.feePct=null}}st.store=$('#o_store')?.value||st.store;st.loc=$('#o_loc')?.value||st.loc;st.date=$('#o_date')?.value||st.date;st.expected=$('#o_exp')?.value||st.expected;st.window=$('#o_win')?.value??st.window;st.recv=$('#o_recv')?.value||st.recv;
  st.lines=st.lines.map((l,i)=>{const itemId=$('#ol_i'+i)?.value??l.itemId;const it=itemById(itemId);let buyId=$('#ol_b'+i)?.value??l.buyId;if(it&&(!buyId||![...buyOpts(it),unitOpt(it)].some(o=>o.id===buyId)))buyId=(buyOpts(it)[0]||unitOpt(it)).id;
    return {name:$('#ol_n'+i)?.value??l.name,qty:num($('#ol_q'+i)?.value)??l.qty,itemId,...(it?{buyId}:{}),price:$('#ol_p'+i)?num($('#ol_p'+i).value):(l.price??null)}})}
async function orderRead(){const st=SH_ORDER;if(!st.shots.length||!A.sample)return;st.msg2='';grabOrderLines();st.busy=true;st.msg='';drawSheet();
  const prompt=`You are reading one or more screenshots of the SAME online grocery or wholesale order (pages of one order; if items repeat across overlapping screenshots, list each product once) (usually BJ's Wholesale Club or Walmart) for a matcha and bubble tea shop.
Return JSON only, shaped exactly: {"store":"BJ's"|"Walmart"|"Glacier Point"|"Other","orderDate":"YYYY-MM-DD" or null,"deliveryDate":"YYYY-MM-DD" or null,"deliveryWindow":string or null,"deliveryAddress":string or null,"lines":[{"name":string,"qty":number,"price":number or null,"itemId":string or null}]}
deliveryDate is the scheduled or estimated delivery/pickup date shown (e.g. "Arrives Thu, Oct 16", "Delivery scheduled"); use the year of the order date if no year is shown; today is ${today()}. deliveryWindow is the time window shown, short form like "2pm-4pm", else null. deliveryAddress is the delivery or shipping address shown (or the billing address if no delivery address is shown), else null.
Rules: include only purchased products (no fees, tax, totals, savings). qty is the number of units/packs ordered as shown. price is the total paid for that line (qty times unit price) in dollars. Keep names short.
Set itemId to the id of the matching shop inventory item below when the product is clearly the same thing, otherwise null.
When the item has buy sizes, set buyId to the size that matches what was bought (by package size/weight), else null; qty is then the number of that size.
Inventory items: ${JSON.stringify(D.items.map(i=>({id:i.id,name:i.name,countUnit:i.unit||'',buy:buyOpts(i).map(o=>({id:o.id,size:o.label,holds:o.per}))})))}`;
  try{const lim=(await A.sample.limits().catch(()=>null))?.images?.maxCount||st.shots.length;const r=await A.sample.json(prompt,{images:st.shots.slice(0,lim).map(x=>x.blob),modelTier:'default'});if(st.shots.length>lim)st.msg2=`Only the first ${lim} screenshots could be read at once.`;
    if(r&&Array.isArray(r.lines)){if(r.store&&STORES.includes(r.store))st.store=r.store;{const ml=matchLoc(r.deliveryAddress);if(ml){st.loc=ml;st.locFound=true}}if(r.orderDate&&/^\d{4}-\d{2}-\d{2}$/.test(r.orderDate)){st.date=r.orderDate;st.expected=addDays(r.orderDate,1)}st.gotDel=false;if(r.deliveryDate&&/^\d{4}-\d{2}-\d{2}$/.test(r.deliveryDate)){st.expected=r.deliveryDate;st.gotDel=true}if(r.deliveryWindow)st.window=String(r.deliveryWindow).slice(0,40);
      st.lines=r.lines.filter(l=>l&&l.name).map(l=>{const it=itemById(l.itemId);return {name:String(l.name).slice(0,120),qty:num(l.qty)??1,price:num(l.price),itemId:it?l.itemId:'',...(it?{buyId:buyOpts(it).some(o=>o.id===l.buyId)?l.buyId:(buyOpts(it)[0]||unitOpt(it)).id}:{})}});
      st.msg=`Found ${st.lines.length} items for ${esc(locName(st.loc))}${st.gotDel?` · delivery ${fmtD(st.expected)}${st.window?' '+st.window:''}`:' · no delivery date found, please set it'}. Please check before saving.`}else st.msg=L('Could not read items. Enter them below.','没能识别出商品，请手动填写。')}
  catch(e){console.warn(e);st.msg=e?.code==='not_granted'?L('Allow Claude access when asked to use automatic reading.','需要允许 Claude 访问才能自动识别。'):e?.code==='rate_limited'?L('Too many requests. Try again in a minute.','请求太频繁，请稍后再试。'):L('Could not read this screenshot. Enter items below.','无法识别这张截图，请手动填写。')}
  st.busy=false;drawSheet()}
async function orderSave(){grabOrderLines();const st=SH_ORDER;const lines=st.lines.filter(l=>l.name&&l.name.trim());if(!lines.length){toast(L('Add at least one item','至少添加一项'));return}
  const shotIds=[];for(const x of st.shots){const id=await uploadImg(x.blob);if(!id)return;shotIds.push(id)}const shotId=shotIds[0]||null;

function sigPad(id){const c=$('#'+id);if(!c)return;const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2;x.lineCap='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink');let dn=false;c.dataset.drawn='';
  const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{dn=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};c.onpointermove=e=>{if(!dn)return;x.lineTo(...p(e));x.stroke();c.dataset.drawn='1'};c.onpointerup=()=>dn=false}

/* ---------- auto-scheduling ---------- */
const PRIO=[['high','Preferred'],['normal','Normal'],['low','Less']];
const DEF_NEEDS=[{start:'11:00',end:'17:00',n:2},{start:'17:00',end:'22:30',n:2}];
function needsFor(loc,dow){const st=D.settings.staffing?.[loc];const l=st?.[dow];return Array.isArray(l)?l:DEF_NEEDS}
/* ---------- sales forecast → staffing ----------
   Hourly sales history (mgr/hourly_<store>) → forecast for each future hour → number of people.
   Forecast = recent same-weekday average (newer weeks count more, odd days trimmed)
              × weather adjustment learned from this store's own history (Open-Meteo, no key needed).
   People   = 1 up to "one person max" ($150 by default), then one more per "$ per person" ($100).
   Staffing uses forecast + a safety margin based on how much that hour usually swings,
   so busy, unpredictable hours (weekends) get a bit more cover automatically. */
const FC_DEF={on:true,cap:100,max1:150,minStaff:1,buffer:0.5,weeks:8};
const FC_BUF=[[0,'Lean','Staff to the average'],[0.5,'Normal','Small cushion for busy swings'],[1,'Safe','Bigger cushion, fewer rushes']];
const DEF_GEO={wh:{lat:41.7621,lon:-72.742,name:'West Hartford, CT'},nh:{lat:41.3046,lon:-72.9157,name:'New Haven, CT'}};
const fcCfg=()=>({...FC_DEF,...(D.schedCfg?.forecast||{})});
const fcGeo=loc=>fcCfg().geo?.[loc]||DEF_GEO[loc]||null;
const hourlyOf=loc=>(D.hourly||{})[loc]||{};
const dayTot=v=>Object.values(v||{}).reduce((a,x)=>a+(+x?.[0]||0),0);
// hour values are [net sales, orders, tips, tax, account receivable]; older data may only have the first two
const daySum=(v,i)=>Object.values(v||{}).reduce((a,x)=>a+(+x?.[i]||0),0);
const hasExtra=v=>Object.values(v||{}).some(x=>Array.isArray(x)&&x.length>=5);
function dayMoney(v){return{net:dayTot(v),tips:daySum(v,2),tax:daySum(v,3),recv:daySum(v,4),full:hasExtra(v)}}
const fcHas=loc=>Object.values(hourlyOf(loc)).filter(v=>dayTot(v)>=30).length>=21;
function fcPeople(s,c){c=c||fcCfg();if(!(s>0))return 0;const step=Math.max(1,+c.cap||100),one=Math.max(step,+c.max1||150);return s<=one?1:Math.ceil((s-(one-step))/step)}
/* weather */
const WX={};
const WXQ='daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,weather_code&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=America%2FNew_York';
async function wxFetch(url){const r=await fetch(url);if(!r.ok)throw new Error('weather '+r.status);const j=await r.json();const d=j.daily||{};const o={};
  (d.time||[]).forEach((t,i)=>{if(d.temperature_2m_max?.[i]==null)return;o[t]={tmax:d.temperature_2m_max[i],tmin:d.temperature_2m_min?.[i],rain:d.precipitation_sum?.[i]||0,snow:d.snowfall_sum?.[i]||0,code:d.weather_code?.[i]}});return o}
function wxAll(){return Promise.all(Object.keys(D.hourly||{}).map(wxFor))}
function wxNow(loc){const g=fcGeo(loc);return g?(WX[`${loc}|${g.lat},${g.lon}`]?.data||null):null}
function wxFor(loc){const g=fcGeo(loc);if(!g)return Promise.resolve({});const key=`${loc}|${g.lat},${g.lon}`;const c=WX[key];
  if(c?.data&&Date.now()-c.at<3*3600e3)return Promise.resolve(c.data);if(c?.p)return c.p;
  const p=(async()=>{const data={};const dates=Object.keys(hourlyOf(loc)).sort();const first=dates[0];const archEnd=addDays(today(),-7);

const MS_ORIGIN='https://cloud.menusifucloud.com';let HS_IN=null,HS_T=null;
function hsGuess(name){const n=String(name||'').toLowerCase();const L2=LOCS();
  const hit=L2.find(l=>n.includes(String(l.name).toLowerCase()))||L2.find(l=>String(l.name).toLowerCase().split(/\s+/).some(w=>w.length>3&&n.includes(w)))||(/new haven/.test(n)?L2.find(l=>/^nh\b|new haven/i.test(l.name)||l.id==='nh'):null)||(/west hartford/.test(n)?L2.find(l=>/west hartford/i.test(l.name)||l.id==='wh'):null);return hit?.id||''}
function hsReady(){if(location.hash!=='#import-hourly'||!window.opener)return;let n=0;clearInterval(HS_T);HS_T=setInterval(()=>{if(HS_IN||++n>30){clearInterval(HS_T);return}try{window.opener.postMessage({type:'bliss-ready'},MS_ORIGIN)}catch(e){clearInterval(HS_T)}},1000)}
window.addEventListener('message',e=>{if(e.origin!==MS_ORIGIN||e.data?.type!=='bliss-hourly'||!Array.isArray(e.data.stores))return;if(!isOwner){toast('Only the owner can import sales');return}
  HS_IN={src:e.source,stores:e.data.stores.slice(0,10).map(x=>{const days={};Object.entries(x.days||{}).forEach(([d,v])=>{if(!/^\d{4}-\d\d-\d\d$/.test(d)||!v||typeof v!=='object')return;const o={};Object.entries(v).forEach(([h,a])=>{h=+h;if(h>=0&&h<24&&Array.isArray(a))o[h]=a.length>=5?[Math.round((+a[0]||0)*100)/100,Math.round(+a[1]||0),+a[2]||0,+a[3]||0,+a[4]||0]:[Math.round((+a[0]||0)*100)/100,Math.round(+a[1]||0)]});days[d]=o});const ds=Object.keys(days).sort();return{name:String(x.name||'').slice(0,120),days,from:ds[0],to:ds[ds.length-1],n:ds.length,loc:hsGuess(x.name)}})};
  clearInterval(HS_T);hsImportSheet()});

function schedChart(shifts,ws,n,gaps,me){gaps=gaps||[];const days=[...Array(n)].map((_,i)=>addDays(ws,i));
  const mins=[];shifts.forEach(s=>{mins.push(toMin(s.start),toMin(s.end)<=toMin(s.start)?toMin(s.end)+1440:toMin(s.end))});days.forEach(d=>needsAt(curLoc(),d).forEach(x=>{mins.push(toMin(x.start),toMin(x.end))}));
  let lo=mins.length?Math.floor(Math.min(...mins)/60)*60:540,hi=mins.length?Math.ceil(Math.max(...mins)/60)*60:1380;if(hi-lo<360)hi=lo+360;const span=hi-lo;const X=m=>((m-lo)/span*100).toFixed(2)+'%';
  const hrsL=[];for(let m=lo;m<=hi;m+=60)hrsL.push(m);const step=span>720?2:1;
  const lbl=m=>{const h=Math.floor(m/60)%24;return LANG_HOUR(h)};
  const gantt=`<div style="overflow-x:auto"><div style="min-width:520px">
   <div style="display:flex;margin-left:62px;position:relative;height:18px">${hrsL.map((m,i)=>i%step?'':`<span class="tiny muted" style="position:absolute;left:${X(m)};transform:translateX(-50%)">${lbl(m)}</span>`).join('')}</div>
   ${days.map(d=>{const ds=shifts.filter(s=>s.date===d).sort((a,b)=>toMin(a.start)-toMin(b.start));const lanes=[];ds.forEach(s=>{let li=lanes.findIndex(e=>e<=toMin(s.start));if(li<0){li=lanes.length;lanes.push(0)}lanes[li]=toMin(s.end);s._lane=li});
     const L=Math.max(1,lanes.length);const gp=gaps.filter(g=>g.date===d);
     return `<div style="display:flex;align-items:stretch;border-top:1px solid var(--line)"><div style="width:62px;flex:none;padding:6px 4px"><b class="small">${WD()[parseYmd(d).getDay()]}</b><div class="tiny muted">${fmtD(d,{month:'numeric',day:'numeric'})}</div></div>
      <div style="position:relative;flex:1;height:${L*26+10+(gp.length?8:0)}px">
       ${hrsL.map(m=>`<i style="position:absolute;top:0;bottom:0;left:${X(m)};border-left:1px solid var(--line)"></i>`).join('')}
       ${ds.map(s=>{const c=D.employees[s.empId]?.color||COLORS[0];const e=toMin(s.end)<=toMin(s.start)?toMin(s.end)+1440:toMin(s.end);const tap=!me&&s.id&&D.shifts[s.id]&&mode()==='mgr';return `<div title="${esc(empName(s.empId))} ${esc(fmtT(s.start))}–${esc(fmtT(s.end))}"${tap?` data-act="swapPick" data-id="${esc(s.id)}" role="button" tabindex="0"`:''} style="${tap?'cursor:pointer;':''}position:absolute;top:${5+s._lane*26}px;height:22px;left:${X(toMin(s.start))};width:calc(${X(e)} - ${X(toMin(s.start))});background:${esc(c)};${s.warn?.length?'outline:2px solid var(--bad);outline-offset:1px;':me&&s.empId===me?'outline:2px solid var(--ink);outline-offset:1px;':''}border-radius:6px;color:#fff;font-size:11px;font-weight:600;line-height:22px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(empName(s.empId).split(' ')[0])}${me&&s.empId===me?' (you)':''} ${esc(fmtT(s.start))}–${esc(fmtT(s.end))}</div>`}).join('')}
       ${gp.map(g=>`<div title="Short ${g.missing}" style="position:absolute;bottom:2px;height:5px;left:${X(toMin(g.start))};width:calc(${X(toMin(g.end))} - ${X(toMin(g.start))});background:var(--bad);border-radius:3px"></div>`).join('')}
      </div></div>`}).join('')}</div></div>`;
  const ids=[...new Set(shifts.map(s=>s.empId))].sort((a,b)=>empName(a).localeCompare(empName(b)));
  const grid=ids.length?`<div class="tbl"><table><thead><tr><th>Staff</th>${days.map(d=>`<th>${WD()[parseYmd(d).getDay()]} ${fmtD(d,{month:'numeric',day:'numeric'})}</th>`).join('')}<th>Hours</th></tr></thead><tbody>${ids.map(id=>{const tot=shifts.filter(s=>s.empId===id).reduce((a,s)=>a+shiftHrs(s),0);
    return `<tr><td><span class="dot" style="display:inline-block;background:${esc(D.employees[id]?.color||COLORS[0])};margin-right:6px"></span>${esc(empName(id))}</td>${days.map(d=>{const x=shifts.filter(s=>s.empId===id&&s.date===d);return `<td style="text-align:center">${x.length?x.map(s=>`<span class="chip" style="background:${esc(D.employees[id]?.color||COLORS[0])};color:#fff">${esc(fmtT(s.start))}–${esc(fmtT(s.end))}</span>`).join('<br>'):'<span class="muted">—</span>'}</td>`}).join('')}<td><b>${fmtH(tot)}</b></td></tr>`}).join('')}</tbody></table></div>`:'';
  return `<div class="stack">${gantt}${gaps.length?`<div class="tiny" style="color:var(--bad)">Red underline = not enough people at that time.</div>`:''}${grid}</div>`}
const LANG_HOUR=h=>h===0?'12a':h===12?'12p':h<12?h+'a':(h-12)+'p';

async function doClockIn(selfie,now){const me=actor();if(!me)return;if(openPunch(me)){toast(L('Already clocked in','已经打过卡'));return}now=now||new Date();const d=bizDate();
  const sh=shiftsOn(d,me);let best=null;sh.forEach(s=>{const dt=Math.abs(now-atTime(d,s.start));if(!best||dt<best.dt)best={s,dt}});
  let late=0;if(best){const m=(now-atTime(d,best.s.start))/6e4;if(m>(D.settings.lateGrace||0))late=Math.round(m)}
  const body={empId:me,loc:locOf(me),date:d,in:now.toISOString(),out:null,shiftId:best?.s.id||null,late,selfie:selfie||null};
  if(await W(A.db.doc('punches/'+uidGen()).set(body)))toast(late?L(`Clocked in · ${late} min late`,`已打卡 · 迟到 ${late} 分钟`):L('Clocked in. Have a great shift!','已打卡，上班愉快！'))}

const id0=id=>id?D.shifts[id]:null;
/* ---------- backups: every shift should have someone free to cover it ---------- */
// Free for the whole shift per their availability, same store, not already working then.
function backupCands(s){const loc=s.loc||locOf(s.empId);const ws=weekStart(s.date),we=addDays(ws,6);const wk=id=>Object.values(D.shifts).filter(x=>x.empId===id&&x.date>=ws&&x.date<=we).reduce((a,x)=>a+shiftHrs(x),0);
  return Object.values(D.employees).filter(e=>e.active!==false&&e.id!==s.empId&&locOf(e.id)===loc&&!cvClash(e.id,s)&&availFor(e.id,s.date,s.start,s.end)==='yes').sort((a,b)=>wk(a.id)-wk(b.id)||a.name.localeCompare(b.name)).map(e=>e.id)}
// The chosen backup (a manager can pick one; otherwise the free person with the fewest hours that week).
function backupSetCard(){if(!isMgr)return'';const on=backupOn();return `<div class="card stack"><h3>Backups</h3><p class="small muted">${on?'Every shift gets a backup: someone free for the whole shift (from availability), who is asked first if the person can\'t come. Shifts with no one free are flagged in Schedule. You can turn this off for single shifts when you edit them.':'Turn on to give every shift a backup person who is asked first if someone can\'t come.'}</p><button class="btn ${on?'':'pri'}" data-act="backupToggle">${on?'Turn off backups':'Turn on backups'}</button></div>`}
const backupOn=()=>D.settings.backupOn!==false;
const needsBackup=s=>backupOn()&&!s?.noBackup;
function backupOf(s){if(!needsBackup(s))return null;const c=backupCands(s);if(s.backup&&c.includes(s.backup))return s.backup;return c[0]||null}
const backupLine=s=>{if(!backupOn())return'';if(s.noBackup)return '<span class="tiny muted">No backup needed</span>';const b=backupOf(s);return b?`<span class="tiny muted">Backup: ${esc(first(b))}${s.backup===b?'':' (auto)'}</span>`:`<span class="tiny" style="color:var(--bad);font-weight:600">⚠ No backup: no one else is free then</span>`};
function noBackupCount(days){return days.reduce((n,d)=>n+shiftsOn(d).filter(s=>needsBackup(s)&&atTime(s.date,s.start).getTime()>Date.now()&&!backupOf(s)).length,0)}
function backupDuty(me){const up=Object.values(D.shifts).filter(s=>shiftVisible(s)&&s.empId!==me&&s.date>=today()&&s.date<=addDays(today(),13)&&atTime(s.date,s.start).getTime()>Date.now()&&backupOf(s)===me).sort((a,b)=>a.date.localeCompare(b.date)||toMin(a.start)-toMin(b.start));
  return up.length?`<div class="card stack"><h3>You're the backup</h3><p class="small muted">You're free at these times, so if someone can't come you'll be asked first.</p><div class="list">${up.slice(0,6).map(s=>`<div class="li" style="padding-inline:0"><div class="grow"><div class="t">${fmtD(s.date)} · ${fmtT(s.start)}–${fmtT(s.end)}</div><div class="small muted">for ${esc(first(s.empId))}</div></div></div>`).join('')}</div></div>`:''}

/* ---------- schedule review: managers send a week to the owner; staff see it once the owner approves ---------- */
const ownerAct=()=>isOwner&&!UI.pv;
const PUB=()=>D.schedPub||{};
const pubOn=()=>PUB().on===true;
const pubKey=(loc,ws)=>`${loc}_${ws}`;
const pubShifts=(loc,ws)=>{const we=addDays(ws,6);return Object.values(D.shifts).filter(s=>(s.loc||locOf(s.empId))===loc&&s.date>=ws&&s.date<=we)};
const shSnap=s=>({id:s.id,e:s.empId,d:s.date,s:s.start,t:s.end});
function weekState(loc,ws){if(!pubOn()||ws<(PUB().from||'9999'))return'live';const k=pubKey(loc,ws);const p=PUB().weeks?.[k];const s=D.schedSub?.[k];
  if(p?.status==='published')return'published';if(s?.at&&(!p?.at||s.at>p.at))return'submitted';if(p?.status==='changes')return'changes';return'draft'}
// Staff only see weeks that are live or approved.
const shiftVisible=s=>mode()!=='emp'||['live','published'].includes(weekState(s.loc||locOf(s.empId),weekStart(s.date)));
function pubDiff(loc,ws){const p=PUB().weeks?.[pubKey(loc,ws)];if(p?.status!=='published'||!p.snap)return[];const old=Object.fromEntries(p.snap.map(x=>[x.id,x]));const now=pubShifts(loc,ws).map(shSnap);const cur=Object.fromEntries(now.map(x=>[x.id,x]));const out=[];
  now.forEach(x=>{const o=old[x.id];if(!o)out.push({k:'add',n:x});else if(o.e!==x.e||o.d!==x.d||o.s!==x.s||o.t!==x.t)out.push({k:'chg',o,n:x})});
  p.snap.forEach(o=>{if(!cur[o.id])out.push({k:'del',o})});return out.sort((a,b)=>((a.n||a.o).d+(a.n||a.o).s).localeCompare((b.n||b.o).d+(b.n||b.o).s))}
const PUBST={live:['','Published'],draft:['','Draft · staff can\'t see it yet'],submitted:['warn','Waiting for owner review'],changes:['bad','Owner asked for changes'],published:['ok','Approved · staff can see it']};
function pubWeeks(){const ws=weekStart(today());return [0,7,14,21].map(n=>addDays(ws,n))}
function pubAttention(){const a=[];if(!pubOn())return a;const locs=ownerAct()?LOCS().map(l=>l.id):[curLoc()];
  for(const loc of locs)for(const ws of pubWeeks()){const st=weekState(loc,ws);
    if(ownerAct()&&st==='submitted')a.push({k:'pub',loc,ws,html:pubRow(loc,ws,chip('warn','Schedule'),`${esc(locName(loc))} · week of ${fmtD(ws,{month:'short',day:'numeric'})} is waiting for your review`)});
    if(ownerAct()&&st==='published'&&addDays(ws,6)>=today()){const n=pubDiff(loc,ws).length;if(n)a.push({k:'pub',loc,ws,html:pubRow(loc,ws,chip('info','Changed'),`${esc(locName(loc))} · week of ${fmtD(ws,{month:'short',day:'numeric'})}: ${n} change${n>1?'s':''} since you approved`)})}
    if(!ownerAct()&&st==='changes')a.push({k:'pub',loc,ws,html:pubRow(loc,ws,chip('bad','Schedule'),`Owner asked for changes · week of ${fmtD(ws,{month:'short',day:'numeric'})}${PUB().weeks?.[pubKey(loc,ws)]?.note?`<div class="small muted">“${esc(PUB().weeks[pubKey(loc,ws)].note)}”</div>`:''}`)})}
  return a}
const pubRow=(loc,ws,c,t)=>`<div class="li tap" data-act="pubOpen" data-l="${esc(loc)}" data-ws="${ws}">${c}<div class="grow">${t}</div>${ic('chev')}</div>`;

function pubBar(ws){if(!pubOn())return ownerAct()?`<div class="small muted row wrapr"><span class="grow">Owner review is off: schedules go to staff right away.</span><button class="btn sm" data-act="pubToggle" data-on="1">Turn on review</button></div>`:'';
  const loc=curLoc();const st=weekState(loc,ws);if(st==='live')return'';const [k,t]=PUBST[st];const n=st==='published'?pubDiff(loc,ws).length:0;const sub=D.schedSub?.[pubKey(loc,ws)];const p=PUB().weeks?.[pubKey(loc,ws)];
  const btn=ownerAct()?(st==='published'?(n?`<button class="btn sm" data-act="pubOpen" data-l="${loc}" data-ws="${ws}">See ${n} change${n>1?'s':''}</button>`:''):`<button class="btn sm pri" data-act="pubOpen" data-l="${loc}" data-ws="${ws}">Review & publish</button>`)
    :(st==='draft'||st==='changes'?`<button class="btn sm pri" data-act="pubOpen" data-l="${loc}" data-ws="${ws}">Send to owner</button>`:`<button class="btn sm" data-act="pubOpen" data-l="${loc}" data-ws="${ws}">Details</button>`);
  return `<div class="card row wrapr" style="border-left:4px solid var(--${k||'line'})"><div class="grow"><div class="t">${chip(k,t)}</div><div class="small muted" style="margin-top:4px">${st==='submitted'?`Sent ${sub?.byName?'by '+esc(sub.byName)+' ':''}${fmtDT(sub?.at)}`:st==='published'?`Approved ${p?.byName?'by '+esc(p.byName)+' ':''}${fmtDT(p?.at)}${n?` · ${n} change${n>1?'s':''} since`:''}`:st==='changes'&&p?.note?`“${esc(p.note)}”`:'Staff will see this week after the owner approves it.'}</div></div>${btn}</div>`}

function pubSheet(loc,ws){openSheet({live:true,title:()=>`${esc(locName(loc))} · week of ${fmtD(ws,{month:'short',day:'numeric'})}`,body:()=>{const st=weekState(loc,ws);const sh=pubShifts(loc,ws).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const [k,t]=PUBST[st];const sub=D.schedSub?.[pubKey(loc,ws)];const p=PUB().weeks?.[pubKey(loc,ws)];
  const hrs={};sh.forEach(s=>{hrs[s.empId]=(hrs[s.empId]||0)+shiftHrs(s)});const tot=Object.values(hrs).reduce((a,b)=>a+b,0);
  const cost=seePay()?Object.entries(hrs).reduce((a,[e,h])=>{const W_=wageOf(e);return a+h*(W_.pay||W_.cash||trainOf(e).rate||0)},0):null;
  const future=sh.filter(s=>atTime(s.date,s.start).getTime()>Date.now());const nobk=future.filter(s=>needsBackup(s)&&!backupOf(s));const unav=sh.filter(s=>['no','off'].includes(availFor(s.empId,s.date,s.start,s.end)));const dbl=sh.filter(s=>sh.some(x=>x!==s&&x.empId===s.empId&&ovl(x,s)));
  const max=D.schedCfg?.maxHrs||{};const over=Object.entries(hrs).filter(([e,h])=>num(max[e])&&h>num(max[e]));
  const diff=st==='published'?pubDiff(loc,ws):[];const line=x=>`${esc(empName(x.e))} · ${fmtD(x.d,{weekday:'short',month:'numeric',day:'numeric'})} ${fmtT(x.s)}–${fmtT(x.t)}`;
  return `<div class="card stack"><div>${chip(k,t)}</div>${sub?.at?`<div class="small muted">Sent by ${esc(sub.byName||'manager')} · ${fmtDT(sub.at)}${sub.note?`<br>“${esc(sub.note)}”`:''}</div>`:''}${p?.at?`<div class="small muted">${p.status==='published'?'Approved':'Changes asked'} by ${esc(p.byName||'owner')} · ${fmtDT(p.at)}${p.status==='changes'&&p.note?`<br>“${esc(p.note)}”`:''}</div>`:''}</div>
   ${diff.length?`<div class="card stack" style="border-left:4px solid var(--info)"><h3>Changed since you approved</h3>${diff.map(x=>`<div class="small">${x.k==='add'?`<b style="color:var(--ok)">Added</b> ${line(x.n)}`:x.k==='del'?`<b style="color:var(--bad)">Removed</b> ${line(x.o)}`:`<b style="color:var(--warn)">Changed</b> ${line(x.o)} → ${x.n.e!==x.o.e?esc(empName(x.n.e))+' · ':''}${fmtD(x.n.d,{weekday:'short'})} ${fmtT(x.n.s)}–${fmtT(x.n.t)}${D.shifts[x.n.id]?.coverId?' <span class="muted">(shift cover)</span>':''}`}</div>`).join('')}${ownerAct()?`<button class="btn" data-act="pubAck" data-l="${loc}" data-ws="${ws}">${ic('check')} Got it</button>`:''}</div>`:''}
   <div class="stats" style="grid-template-columns:repeat(${cost!=null?3:2},1fr)"><div class="stat"><b>${sh.length}</b><span>Shifts</span></div><div class="stat"><b>${fmtH(tot)}</b><span>Total hours</span></div>${cost!=null?`<div class="stat"><b>${money(cost)}</b><span>Est. labor</span></div>`:''}</div>
   ${[[nobk,'bad',x=>`No backup: ${esc(empName(x.empId))} ${fmtD(x.date,{weekday:'short'})} ${fmtT(x.start)}–${fmtT(x.end)}`],[unav,'warn',x=>`Not available then: ${esc(empName(x.empId))} ${fmtD(x.date,{weekday:'short'})} ${fmtT(x.start)}–${fmtT(x.end)}`],[dbl,'bad',x=>`Double-booked: ${esc(empName(x.empId))} ${fmtD(x.date,{weekday:'short'})}`],[over,'warn',([e,h])=>`Over max hours: ${esc(empName(e))} ${fmtH(h)} h (max ${fmtH(num(max[e]))})`]].filter(([l])=>l.length).map(([l,c,f])=>`<div class="hint ${c==='bad'?'warn':''}">${l.slice(0,8).map(f).join('<br>')}${l.length>8?`<br>+${l.length-8} more`:''}</div>`).join('')||(sh.length?'<div class="small" style="color:var(--ok)">✓ No problems found: everyone is available, no double-booking, every shift has a backup.</div>':'')}
   ${sh.length?`<div class="small muted">Tap a shift to see who else can work it and swap them in.</div>`+schedChart(sh,ws,7,[]):'<div class="empty card">No shifts this week yet.</div>'}
   <div class="card stack"><h3>Hours per person</h3>${Object.entries(hrs).sort((a,b)=>b[1]-a[1]).map(([e,h])=>`<div class="row">${avatar(e)}<span class="grow">${esc(empName(e))}</span><b>${fmtH(h)} h</b></div>`).join('')||'<div class="small muted">—</div>'}</div>
   ${ownerAct()&&st!=='published'||(!ownerAct()&&['draft','changes','submitted'].includes(st))?`<label class="f">${ownerAct()?'Note for the manager (needed if you ask for changes)':'Note for the owner (optional)'}<textarea class="in" id="pub_note" rows="2" placeholder="${ownerAct()?'e.g. Too many hours on Monday':'e.g. Bella is off Friday'}"></textarea></label>`:''}`},
  foot:()=>{const st=weekState(loc,ws);if(ownerAct())return st==='published'?`<button class="btn" data-act="pubUnpub" data-l="${loc}" data-ws="${ws}">Hide from staff</button><button class="btn pri" data-act="closeSheet">Close</button>`:`<button class="btn" data-act="pubChanges" data-l="${loc}" data-ws="${ws}">Ask for changes</button><button class="btn pri" data-act="pubApprove" data-l="${loc}" data-ws="${ws}">${ic('check')} Approve & publish</button>`;
   return st==='published'?`<button class="btn pri" data-act="closeSheet">Close</button>`:`<button class="btn" data-act="closeSheet">Close</button><button class="btn pri" data-act="pubSubmit" data-l="${loc}" data-ws="${ws}">${st==='submitted'?'Send again':'Send to owner for review'}</button>`}})}

function pubSetCard(){if(!ownerAct())return'';const on=pubOn();

function swapSheet(sid){const back=SH;openSheet({live:true,title:()=>{const s=D.shifts[sid];return s?`Replace ${esc(first(s.empId))}`:'Shift'},body:()=>{const s=D.shifts[sid];if(!s)return'<div class="empty">This shift was removed.</div>';
  const loc=s.loc||locOf(s.empId);const ws=weekStart(s.date),we=addDays(ws,6);const wk=id=>Object.values(D.shifts).filter(x=>x.empId===id&&x.date>=ws&&x.date<=we).reduce((a,x)=>a+shiftHrs(x),0);const max=D.schedCfg?.maxHrs||{};const bk=backupOf(s);
  const rows=Object.values(D.employees).filter(e=>e.active!==false&&e.id!==s.empId&&locOf(e.id)===loc).map(e=>{const clash=cvClash(e.id,s);const av=availFor(e.id,s.date,s.start,s.end);const h=wk(e.id);const over=num(max[e.id])&&h+shiftHrs(s)>num(max[e.id]);
    const g=clash?3:av==='yes'?0:av==='partial'||av==='unknown'?1:2;return{e,clash,av,h,over,g}}).sort((a,b)=>a.g-b.g||(b.e.id===bk)-(a.e.id===bk)||(b.e.role==='Manager')-(a.e.role==='Manager')||a.h-b.h||a.e.name.localeCompare(b.e.name));
  const grp=[[0,'Free the whole time'],[1,'Maybe (partly free or availability not filled in)'],[2,'Not available then'],[3,'Already working then']];

   ${grp.map(([g,t])=>{const r=rows.filter(x=>x.g===g);return r.length?`<div class="eyebrow">${t}</div><div class="card flush list">${r.map(x=>`<div class="li tap" data-act="swapDo" data-id="${esc(sid)}" data-e="${esc(x.e.id)}" tabindex="0" style="${g>=2?'opacity:.6':''}">${avatar(x.e.id)}<div class="grow"><div class="t">${esc(x.e.name)}${x.e.role==='Manager'?' · Manager':''}</div><div class="small muted">${fmtH(x.h)} h this week${num(max[x.e.id])?` (max ${fmtH(num(max[x.e.id]))})`:''}${x.e.id===bk?' · <b style="color:var(--ok)">backup</b>':''}</div></div>${x.over?chip('warn','Over max'):''}${x.clash?chip('bad','Already on'):availChip(x.av)}</div>`).join('')}</div>`:''}).join('')||'<div class="empty card">No one else at this store.</div>'}`},
  foot:()=>back?`<button class="btn block" data-act="swapBack">Back</button>`:`<button class="btn block" data-act="closeSheet">Close</button>`});SH.back=back}

// Body format: "## " heading · "- " bullet · "1. " step · "! " important · "| a | b |" table (first row is the header)
function guideHtml(body){const L0=String(body||'').split('\n');let h='',list=null,tbl=null;
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const close=()=>{if(list){h+=`</${list}>`;list=null}if(tbl){h+=`<div style="overflow-x:auto"><table class="gtbl"><thead><tr>${tbl[0].map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${tbl.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;tbl=null}};
  for(const raw of L0){const l=raw.trim();
    if(/^\|.*\|$/.test(l)){if(list){h+=`</${list}>`;list=null}(tbl=tbl||[]).push(l.slice(1,-1).split('|').map(c=>c.trim()));continue}
    if(tbl)close();
    if(l.startsWith('- ')){if(list!=='ul'){close();h+='<ul class="gl">';list='ul'}h+=`<li>${inl(l.slice(2))}</li>`;continue}
    if(/^\d+\.\s/.test(l)){if(list!=='ol'){close();h+='<ol class="gl">';list='ol'}h+=`<li>${inl(l.replace(/^\d+\.\s/,''))}</li>`;continue}
    close();if(!l)continue;
    if(l.startsWith('## '))h+=`<h4 class="gh">${inl(l.slice(3))}</h4>`;else if(l.startsWith('! '))h+=`<div class="gwarn">⚠️ ${inl(l.slice(2))}</div>`;else h+=`<p>${inl(l)}</p>`}
  close();return h}

   return `<div class="row wrapr" style="gap:6px"><span class="chip" style="background:${GC[g.si%GC.length]};color:#fff">${esc(g.sec.title)}</span>${g.sec.hours?`<span class="small muted">${g.sec.hours} h section</span>`:''}</div>
   ${g.it.check?`<div class="card" style="border-left:4px solid var(--ok)"><div class="eyebrow">You're ${esc(done.toLowerCase())} when</div><div>${esc(g.it.check)}</div></div>`:''}

   ${emp?`<div class="card row wrapr"><div class="grow"><div class="eyebrow">${esc(empName(emp))}</div><div class="t">${v===2?esc(done):v===1?'Shown':'Not started'}</div></div>${mgr?`<button class="btn sm" data-act="guideSet" data-emp="${emp}" data-k="${k}" data-v="1">Shown</button><button class="btn sm pri" data-act="guideSet" data-emp="${emp}" data-k="${k}" data-v="2">${esc(done)}</button>`:v<2?`<button class="btn sm ${v?'':'pri'}" data-act="trainSelf" data-emp="${emp}" data-k="${k}">${v?'Undo shown':"I've been shown this"}</button>`:''}</div>`:''}
