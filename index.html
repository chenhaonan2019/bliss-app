   ${(()=>{const d2=photoDoc(date,type)||doc;const n=aiIssues(d2);return n?`<div class="hint warn">AI noticed ${n} possible issue${n>1?'s':''} — look at the yellow notes. You decide.</div>`:''})()}
   <div class="tiles">${slots.map(sl=>{const p=doc.photos?.[sl.id];return p?`<div class="tile has" style="cursor:default"><img src="${BLOB}${esc(p.id)}" alt="" data-act="viewPh" data-pid="${esc(p.id)}" data-cap="${esc(sl.name)}" style="cursor:zoom-in"><span class="cap"><b>${esc(sl.name)}</b><br>${esc(empName(p.by))} · ${fmtT(hm(new Date(p.at)))}${aiChip(doc,sl.id)?'<br>'+aiChip(doc,sl.id):''}</span><span class="flag"><button class="chip ${flags[sl.id]?'bad':''}" style="border:0;cursor:pointer" data-act="flagPh" data-slot="${sl.id}">${flags[sl.id]?L('Flagged','已标记'):L('Flag','标记')}</button></span></div>`:doc.checks?.[sl.id]?`<div class="tile has" style="cursor:default;display:grid;place-items:center;text-align:center;padding:10px"><div><div style="font-size:28px;color:var(--ok)">✓</div><b>${esc(sl.name)}</b><div class="tiny muted">${esc(empName(doc.checks[sl.id].by))} · ${fmtT(hm(new Date(doc.checks[sl.id].at)))}</div></div></div>`:`<div class="tile">${esc(sl.name)}<br>${L('missing','缺')}</div>`}).join('')}</div>
   <label class="f">${L('Note to staff','给员工的备注')}<textarea class="in" id="rv_note" placeholder="${L('e.g. wipe under the blender, drains not cleaned','例如：搅拌机下面没擦，下水道没清理')}">${esc(doc.review?.note||'')}</textarea></label>`,
   foot:()=>`<button class="btn bad" data-act="reviewSave" data-st="issue">${L('Has issues','有问题')}</button><button class="btn pri" data-act="reviewSave" data-st="ok">${ic('check')} ${L('Passed','合格')}${RQ&&RQ.i<RQ.list.length-1?' · next':''}</button>`,mount:()=>{SH.flags=flags;SH.date=date;SH.type=type;aiBackfill(date,type)}})}

function shiftSheet(id,date){const s=id?D.shifts[id]:{empId:'',date,start:'11:00',end:'17:00',note:''};const ems=emps();
  SH={editId:id||null};openSheet({editId:id||null,title:()=>id?L('Edit shift','编辑班次'):L('Add shift','添加班次'),body:()=>`
   <label class="f">${L('Date','日期')}<input class="in" type="date" id="sh_date" value="${esc(s.date)}"></label>
   <div class="g2"><label class="f">${L('Start','开始')}<input class="in" type="time" id="sh_start" value="${esc(s.start)}"></label><label class="f">${L('End','结束')}<input class="in" type="time" id="sh_end" value="${esc(s.end)}"></label></div>
   <div class="row wrapr">${[['10:30','16:30'],['11:00','17:00'],['16:00','22:30'],['17:00','23:00']].map(([a,b])=>`<button class="btn sm" data-act="shPreset" data-a="${a}" data-b="${b}">${fmtT(a)}–${fmtT(b)}</button>`).join('')}</div>
   <div class="eyebrow">${L('Who','员工')}</div><div class="card flush list" id="sh_emps">${shEmpList(ems,s)}</div>
   <label class="f">${L('Note','备注')}<input class="in" id="sh_note" value="${esc(s.note||'')}" placeholder="${L('e.g. opening, closing','例如：开店、打烊')}"></label>
   ${id&&backupOn()?(()=>{const c=backupCands(s);return `<label class="row" style="gap:8px"><input type="checkbox" id="sh_needbk" ${s.noBackup?'':'checked'} onchange="document.getElementById('sh_bkf').hidden=!this.checked"> Needs a backup</label><label class="f" id="sh_bkf" ${s.noBackup?'hidden':''}>Backup (asked first if they can't come)<select class="in" id="sh_backup"><option value="">${c.length?'Automatic: '+esc(empName(c[0])):'No one is free then'}</option>${c.map(e=>`<option value="${e}" ${s.backup===e?'selected':''}>${esc(empName(e))}</option>`).join('')}</select>${c.length?'':'<span class="tiny" style="color:var(--bad)">No one else has this time open in their availability.</span>'}</label>`})():''}
   ${id&&atTime(s.date,s.start).getTime()>Date.now()?(coverFor(id)?`<button class="btn block" data-act="cvOpen" data-id="${esc(coverFor(id).id)}">Finding cover… see offers</button>`:`<button class="btn block" data-act="cvCant" data-id="${id}">${ic('users')} Mark can't come · find cover</button>`):''}`,
   foot:()=>`${id?`<button class="btn bad" data-act="shiftDel" data-id="${id}">${L('Delete','删除')}</button>`:''}<button class="btn pri" data-act="shiftSave" data-id="${id||''}">${L('Save','保存')}</button>`,
   mount:()=>{SH.emp=s.empId;['sh_date','sh_start','sh_end'].forEach(k=>{const el=$('#'+k);el&&el.addEventListener('change',()=>{$('#sh_emps').innerHTML=shEmpList(ems,{empId:SH.emp,date:$('#sh_date').value,start:$('#sh_start').value,end:$('#sh_end').value})})})}})}
function shEmpList(emps,s){return emps.map(e=>{const av=availFor(e.id,s.date,s.start,s.end);const clash=Object.values(D.shifts).some(x=>x.empId===e.id&&x.date===s.date&&x!==D.shifts[SH?.editId]&&toMin(x.start)<toMin(s.end)&&toMin(s.start)<toMin(x.end));
  return `<label class="li tap"><input type="radio" name="sh_emp" value="${e.id}" ${s.empId===e.id?'checked':''} data-act="shEmp">${avatar(e.id)}<span class="grow t">${esc(e.name)}</span>${clash?chip('bad',L('Already on','已有班')):''}${availChip(av)}</label>`}).join('')||`<div class="empty">${L('Add team members first.','请先添加员工。')}</div>`}

function availSheet(emp){const a=D.avail[emp]||{weekly:{},off:[]};const wk=JSON.parse(JSON.stringify(a.snap?.[nextWk()]?.weekly||a.weekly||{}));const sel=[nextWk()];const off=[...(a.off||[])];
  openSheet({sel,title:()=>`${L('Availability','可上班时间')} · ${esc(empName(emp))}`,body:()=>{const A_=availState(emp);return `<div class="hint ${A_.st==='overdue'?'warn':''}"><b>For the week of ${fmtD(A_.wk,{month:'short',day:'numeric'})} – ${fmtD(addDays(A_.wk,6),{month:'short',day:'numeric'})}</b> · due ${fmtD(A_.due,{weekday:'long',month:'short',day:'numeric'})}${A_.at?` · sent ${fmtDT(A_.at)}`:''}<br>Check your times, add any days off, then tap Submit. Submit every week, even if nothing changed.</div>
   <div class="card stack"><div class="row"><b class="grow">Weeks to submit</b><button class="btn sm" data-act="avWkAll">Next 4 weeks</button></div>
    <div class="row wrapr" style="gap:6px">${[0,1,2,3,4,5].map(i=>{const w=addDays(nextWk(),7*(i-1));const on=SH?.sel?.includes(w);const sent=D.avail[emp]?.weeks?.[w];return `<button class="btn sm ${on?'pri':''}" data-act="avWk" data-w="${w}" aria-pressed="${on?'true':'false'}" style="flex-direction:column;gap:0;line-height:1.2;padding:6px 10px">${fmtD(w,{month:'short',day:'numeric'})}–${fmtD(addDays(w,6),{day:'numeric'})}<span style="font-size:10px;font-weight:500;opacity:.85">${i===0?'This week':i===1?'Next week':''}${sent?(i<2?' · ':'')+'Sent ✓':''}</span></button>`}).join('')}</div>
    <div class="tiny muted">Tap to choose one or more weeks. The times below are saved for every week you choose and become your usual availability.</div></div><p class="small muted">${L('For each weekday, choose when you can work. Add specific days off below.','选择每周每天能上班的时间，下方添加具体请假日期。')}</p>
   <div class="card flush list">${[1,2,3,4,5,6,0].map(i=>{const w=wk[i]||{mode:'no'};return `<div class="li" style="flex-wrap:wrap"><b style="width:44px">${WD()[i]}</b><select class="in grow" style="min-width:120px" id="av_m${i}" data-act="avMode" data-i="${i}"><option value="no" ${w.mode==='no'?'selected':''}>${L('Can’t work','不能上班')}</option><option value="all" ${w.mode==='all'?'selected':''}>${L('Any time','全天都可以')}</option><option value="custom" ${w.mode==='custom'?'selected':''}>${L('Between…','指定时间段')}</option></select>
     <div class="row" id="av_t${i}" style="width:100%" ${w.mode==='custom'?'':'hidden'}><input class="in" type="time" id="av_f${i}" value="${esc(w.from||'11:00')}" aria-label="from"><span>–</span><input class="in" type="time" id="av_to${i}" value="${esc(w.to||'23:00')}" aria-label="to"></div></div>`}).join('')}</div>
   <div class="card stack"><h3>${L('Days off','请假日期')}</h3><div class="row wrapr" id="av_off">${off.sort().map(x=>`<button class="chip" style="border:0;cursor:pointer" data-act="avOffDel" data-d="${x}">${fmtD(x,{month:'short',day:'numeric'})} ✕</button>`).join('')||`<span class="muted small">${L('None','无')}</span>`}</div>
    <div class="row"><input class="in grow" type="date" id="av_offin" min="${today()}"><button class="btn" data-act="avOffAdd">${L('Add','添加')}</button></div></div>
   <label class="f">${L('Note for manager','给经理的备注')}<textarea class="in" id="av_note" placeholder="${L('e.g. max 25 hours a week during school','例如：上学期间每周最多 25 小时')}">${esc(a.note||'')}</textarea></label>`},
   foot:()=>`<button class="btn pri big" data-act="availSave" data-id="${emp}">Submit availability</button>`,mount:()=>{SH.wk=wk;SH.off=off;if(!SH.sel)SH.sel=sel}})}
function grabAvail(){[1,2,3,4,5,6,0].forEach(i=>{const m=$('#av_m'+i)?.value||'no';SH.wk[i]=m==='custom'?{mode:m,from:$('#av_f'+i).value,to:$('#av_to'+i).value}:{mode:m}})}

function empSheet(id){const e=id?D.employees[id]:{name:'',email:'',role:'Staff',active:true,color:COLORS[Object.keys(D.employees).length%COLORS.length]};
  openSheet({title:()=>id?esc(e.name):L('New team member','新员工'),body:()=>`
   <label class="f">${L('Name','姓名')}<input class="in" id="e_name" value="${esc(e.name)}"></label>
   <label class="f">Location<select class="in" id="e_loc">${LOCS().map(l=>`<option value="${l.id}" ${(e.loc||curLoc())===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>
   ${LOCS().length>1?`<div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)">Can also work at<div class="row wrapr" style="gap:12px">${LOCS().map(l=>`<label class="row small" style="gap:6px;color:var(--ink);font-weight:500"><input type="checkbox" data-eloc="${esc(l.id)}" ${(e.locs||[]).includes(l.id)?'checked':''}> ${esc(l.name)}</label>`).join('')}</div><span class="tiny" style="font-weight:400">They can switch stores at the top of their app, be scheduled there, clock in there and do that store's tasks. Their main location is always included.</span></div>`:''}
   <div class="g2"><label class="f">${L('Email','邮箱')}<input class="in" type="email" id="e_email" value="${esc(e.email||'')}"></label><label class="f">Phone<input class="in" type="tel" inputmode="tel" id="e_phone" value="${esc(e.phone||'')}" placeholder="(860) 555-0123"></label></div>
   ${(()=>{const lockMgr=!isOwner&&e.role==='Manager';const roles=isOwner||lockMgr?['Staff','Shift Lead','Manager','Trainee']:['Staff','Shift Lead','Trainee'];
     return `<div class="g2"><label class="f">${L('Role','职位')}<select class="in" id="e_role" ${lockMgr?'disabled':''}>${roles.map(r=>`<option ${e.role===r?'selected':''}>${r}</option>`).join('')}</select></label><span></span></div>${isOwner?`<label class="row small" style="gap:6px"><input type="checkbox" id="e_regional" ${e.regional?'checked':''}> <span><b>${L('Regional manager','区域经理')}</b> · ${L('a Manager who sees and runs every store, and gets the weekly regional checklist','经理身份，可以看所有门店，并有每周区域清单')}</span></label>`:''}${lockMgr?'<p class="tiny muted">Only an owner can change a manager\'s role.</p>':isOwner?'':'<p class="tiny muted">Only an owner can add a manager.</p>'}`})()}
${seePay()?`   <div class="g3"><label class="f">Payroll $/h<input class="in" type="number" step="0.01" id="e_wage" value="${esc(D.wages[id]??'')}"></label><label class="f">Cash $/h<input class="in" type="number" step="0.01" id="e_cash" value="${esc(D.cashRates?.[id]??'')}"></label><label class="f">Payroll hours/week<input class="in" type="number" step="0.5" id="e_cap" value="${esc(D.payCaps?.[id]??'')}" placeholder="all"></label></div>
   <p class="tiny muted">With both rates, the first hours each week go on payroll and the rest are paid in cash. Leave payroll hours blank to put every hour on payroll.</p>
   <div class="card stack" style="gap:8px;background:var(--sunk)"><div class="eyebrow">Training pay (optional)</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><label class="f" style="min-width:0">Training $/h<input class="in" type="number" step="0.01" id="e_trate" value="${esc(D.trainRates?.[id]??'')}" style="min-width:0"></label>
     <label class="f" style="min-width:0">Paid as<select class="in" id="e_tvia" style="min-width:0"><option value="payroll" ${D.trainVia?.[id]!=='cash'?'selected':''}>Payroll</option><option value="cash" ${D.trainVia?.[id]==='cash'?'selected':''}>Cash</option></select></label>
     <label class="f" style="min-width:0;grid-column:1/-1">Training ends<input class="in" type="date" id="e_tuntil" value="${esc(D.trainUntil?.[id]||'')}" style="min-width:0"></label></div>
    <p class="tiny muted" style="margin:0">Hours worked up to and including the end date are paid at the training rate; after that the normal rate applies. Leave the end date empty to use the training rate while their role is Trainee.</p></div>
   <label class="row"><input type="checkbox" id="e_noearly" ${D.noEarly?.[id]?'checked':''}> ${L("Don't count time before their shift starts","提前打卡不算工时")}</label>
   <label class="row"><input type="checkbox" id="e_nolate" ${D.noLate?.[id]?'checked':''}> ${L("Don't count time after their shift ends","晚于下班时间打卡不算工时")}</label>
   <p class="tiny muted" style="margin-top:-6px">${L('Early clock-in counts from the scheduled start; late clock-out counts only to the scheduled end. Only owners see these.','提前打卡从排班开始时间算起；晚下班只算到排班结束时间。只有老板能看到这些设置。')}</p>`:''}
   <label class="f">${L('Store-phone PIN','共用手机 PIN')}<input class="in" inputmode="numeric" maxlength="6" id="e_pin" value="${esc(D.mgrSet.pins?.[id]||'')}"></label>
   <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)">Color on schedule<div class="swatches" role="radiogroup" aria-label="Color">${COLORS.map((c,i)=>`<label title="${COLOR_NAMES[i]}"><input type="radio" name="e_color" value="${c}" ${(e.color||COLORS[0])===c?'checked':''}><span class="sw" style="background:${c}">${esc((e.name||'A').trim().charAt(0).toUpperCase())}</span><small>${COLOR_NAMES[i]}</small></label>`).join('')}</div></div>
   <label class="row"><input type="checkbox" id="e_active" ${e.active!==false?'checked':''}> ${L('Active (shows in schedule and store phone)','在职（显示在排班和共用手机）')}</label>
   <p class="tiny muted">${seePay()?'Pay rates are only visible to owners. The PIN is visible to managers.':'The PIN is only visible to managers and owners.'}</p>`,
   foot:()=>`${id&&(isOwner||e.role!=='Manager')?`<button class="btn bad" data-act="empDel" data-id="${id}">${SH.confirmDel===id?'Tap again to delete':'Delete'}</button>`:''}<button class="btn pri" data-act="empSave" data-id="${id||''}">${L('Save','保存')}</button>`})}

const EVAL=[{sec:'A',title:'Drink Quality & Recipe Accuracy',areas:[
  {id:'matcha',name:'Matcha Preparation',max:10,std:['Uses 3.5 matcha + 30–35g water at 80°C (3 points)','Whisking 20 times for one shot (3 points)','No obvious clumps or powder dropping down in milk or coconut water (4 points)']},
  {id:'recipe',name:'Recipe Accuracy',max:25,std:['Uses scale/measuring tools instead of estimating (5 points)','Follows exact ingredient amounts and milk-specific sugar standards (5 points)','Uses correct Matcha Liquid / Cloud / fruit / jam / tea amounts (5 points)','Check 5 drinks for compliance (10 points, 2 each)']},
  {id:'prep',name:'Morning Prep Quality',max:20,std:['Follows prep SOP for boba, tea, cloud, fruit, whipped cream, sparkling water and desserts','Uses required ratios, temperatures, timing and holding procedures','Labels/stores prepared items appropriately','Check 4 items made by the employee, 5 points each']}]},
 {sec:'B',title:'Cleanliness & Hygiene',areas:[
  {id:'hygiene',name:'Personal Hygiene, Food Handling & Workstation',max:5,std:['Washes hands frequently; handles food/tools hygienically','Prevents cross-contamination; addresses spills immediately','Keeps countertops and drink station clean throughout shift','Keeps tools organized; avoids dirty-dish buildup']},
  {id:'night',name:'Night Cleanliness',max:10,std:['Monitors floors, trash, tables/chairs, dining/pickup area and drains','Does not leave obvious sanitation issues for the next shift'],evidence:'close'}]},
 {sec:'C',title:'Service & Shift Performance',areas:[
  {id:'service',name:'Service',max:15,std:['Greets customers when they come in (5 points)','Says order number, drink name, and "Thank you, have a good one" when serving (5 points)','Explains and makes suggestions well when taking orders (5 points)']},
  {id:'shift',name:'Shift Responsibility',max:15,std:['Restocks cups, lids, bags, trays, straws and supplies as needed (5 points)','Completes opening prep, closing checklist and inventory sheets with pictures (5 points)','Actively looks for things to do during slow times (5 points)'],evidence:'tasks'}]}];
const VIOL=['Major recipe deviation / making drinks by guessing','Serious hygiene or food-handling issue','Ignoring an obvious sanitation issue','Repeated same mistake after coaching','Repeated failure to measure ingredients','Failure to clean equipment as required','Incorrect equipment operation','Attitude toward customers or coworkers'];
const FOLLOW=['No Action Needed','Coaching / Verbal Feedback','Retraining Required','Re-evaluation Required'];
function evidence(emp){const from=addDays(today(),-30);const tasks=Object.values(D.photos).filter(x=>x.completedBy===emp&&x.date>=from);
  const onT=tasks.filter(x=>taskState(x.date,x.type,x.loc).st==='ontime').length;const iss=tasks.filter(x=>x.review?.status==='issue').length;
  const cnt=Object.values(D.counts).filter(c=>c.by===emp&&c.date>=from).length;const P=Object.values(D.punches).filter(p=>p.empId===emp&&p.date>=from);const late=P.filter(p=>p.late>0).length;
  return `<div class="hint">${L('Last 30 days','最近 30 天')}: ${L(`photo checklists ${tasks.length} (on time ${onT}, issues ${iss}) · inventory counts ${cnt} · shifts ${P.length}, late ${late}`,`照片任务 ${tasks.length} 次（按时 ${onT}，有问题 ${iss}）· 盘点 ${cnt} 次 · 上班 ${P.length} 次，迟到 ${late} 次`)}</div>`}
function evalSheet(){const ems=emps();const st={emp:ems[0]?.id||''};
  openSheet({title:()=>L('Performance evaluation','绩效评估'),body:()=>`
   <div class="card stack"><div class="g2"><label class="f">Employee<select class="in" id="ev_emp">${ems.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><label class="f">Evaluator<input class="in" id="ev_by" value="${esc(ls.get('evaluator')||'')}"></label></div>
   <div class="g2"><label class="f">Location<input class="in" id="ev_loc" value="${esc('BLISS '+locName(curLoc()))}"></label><label class="f">Evaluation period<input class="in" id="ev_per" placeholder="${fmtD(addDays(today(),-30),{month:'short',day:'numeric'})} – ${fmtD(today(),{month:'short',day:'numeric'})}"></label></div>
   <div id="ev_evi">${st.emp?evidence(st.emp):''}</div></div>
   ${EVAL.map(sec=>`<div class="card stack"><div class="eyebrow">${sec.sec}. ${esc(sec.title)} · ${sec.areas.reduce((s,a)=>s+a.max,0)} pts</div>${sec.areas.map(a=>`<div class="evarea"><div><div style="font-weight:600">${esc(a.name)}</div><details class="std"><summary>${L('Standards','评分标准')}</summary><ul>${a.std.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details></div><label class="f" style="text-align:right">/ ${a.max}<input class="in" style="text-align:right" type="number" min="0" max="${a.max}" step="0.5" id="ev_s_${a.id}" data-max="${a.max}"></label></div>
     <input class="in" id="ev_n_${a.id}" placeholder="${L('Manager notes','经理备注')}">`).join('')}</div>`).join('')}
   <div class="card row"><div class="grow"><div class="eyebrow">Total score</div><div class="score" id="ev_total">0</div></div><div id="ev_lvl"></div></div>
   <div class="card stack"><div class="eyebrow">Critical SOP violations</div>${VIOL.map((v,i)=>`<label class="row small"><input type="checkbox" id="ev_v${i}"> ${esc(v)}</label>`).join('')}
    <label class="f">Incident / details<textarea class="in" id="ev_inc"></textarea></label></div>
   <div class="card stack"><div class="eyebrow">Manager summary</div><label class="f">Main area requiring improvement<textarea class="in" id="ev_main"></textarea></label><label class="f">Specific expectation for next evaluation<textarea class="in" id="ev_next"></textarea></label></div>
   <div class="card stack"><div class="eyebrow">Follow-up action</div>${FOLLOW.map((f,i)=>`<label class="row small"><input type="radio" name="ev_f" value="${i}" ${i===0?'checked':''}> ${esc(f)}</label>`).join('')}
    <label class="f">Follow-up date<input class="in" type="date" id="ev_fd"></label></div>
   <div class="card stack"><div class="row"><span class="eyebrow grow">Manager signature</span><button class="btn sm" data-act="sigClear" data-c="sig_m">${L('Clear','清除')}</button></div><canvas class="sig" id="sig_m"></canvas>
    <div class="row"><span class="eyebrow grow">Employee signature</span><button class="btn sm" data-act="sigClear" data-c="sig_e">${L('Clear','清除')}</button></div><canvas class="sig" id="sig_e"></canvas>

/* File pickers. While the camera is open the app may redraw (new data arrives) and replace the <input> that opened it,
   so the photo is lost. Every file input in the app instead opens one input that lives outside the page and is never redrawn;
   its change event reaches the handlers below with the same data-* attributes. */
const PICK=document.createElement('input');PICK.type='file';PICK.tabIndex=-1;PICK.setAttribute('aria-hidden','true');
PICK.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';document.body.appendChild(PICK);
let PICKING=0,UPLOADS=0;window.BLISS_BUSY=()=>PICKING>Date.now()||UPLOADS>0;
const PICK_ATTR=/^(data-.+|accept|capture|multiple)$/;
document.addEventListener('click',e=>{const t=e.target;if(!(t instanceof HTMLInputElement)||t.type!=='file'||t===PICK)return;
  e.preventDefault();[...PICK.attributes].forEach(a=>{if(PICK_ATTR.test(a.name))PICK.removeAttribute(a.name)});
  [...t.attributes].forEach(a=>{if(PICK_ATTR.test(a.name))PICK.setAttribute(a.name,a.value)});
  PICK.value='';PICKING=Date.now()+10*60e3;
  if(t.hasAttribute('capture')&&useInAppCam()){camOpen(t.getAttribute('capture')==='user'?'user':'environment');return}
  try{PICK.click()}catch(err){PICKING=0}},true);
/* In-app camera. On Android, Chrome hands the photo to the system camera app, and the phone often closes the web page
   in the background to free memory; coming back reloads the app and the photo is lost. Taking the photo inside the page
   avoids that. The photo is handed to the same upload code through the picker above. */
const useInAppCam=()=>/Android/i.test(navigator.userAgent)&&!!navigator.mediaDevices?.getUserMedia&&typeof DataTransfer==='function'&&localStorage.getItem('bliss.nativecam')!=='1';
let CAM=null;
function camHand(file){try{const dt=new DataTransfer();dt.items.add(file);PICK.files=dt.files;PICKING=Date.now()+20e3;PICK.dispatchEvent(new Event('change',{bubbles:true}))}catch(e){console.warn(e);toast('Could not use this photo')}}
function camClose(){if(!CAM)return;CAM.stream?.getTracks().forEach(t=>t.stop());CAM.el.remove();if(CAM.url)URL.revokeObjectURL(CAM.url);CAM=null}
async function camStart(){const v=CAM.el.querySelector('video');CAM.stream?.getTracks().forEach(t=>t.stop());CAM.stream=null;camMsg('');
  try{CAM.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:CAM.facing},width:{ideal:1920},height:{ideal:1440}}});
    if(!CAM)return;v.srcObject=CAM.stream;v.style.transform=CAM.facing==='user'?'scaleX(-1)':'';await v.play().catch(()=>{})}
  catch(e){console.warn(e);camMsg(/NotAllowed|Permission/i.test(e?.name||'')?'Camera access is off for this site. Allow the camera in Chrome (lock icon → Permissions), or use the buttons below.':'The camera could not start. Use the buttons below.')}}
function camMsg(t){const m=CAM?.el.querySelector('.cam-msg');if(m){m.textContent=t;m.hidden=!t}}
function camOpen(facing){camClose();const el=document.createElement('div');el.id='cam';el.setAttribute('role','dialog');el.setAttribute('aria-label','Camera');
  el.style.cssText='position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;color:#fff';
  el.innerHTML=`<div style="position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden">
     <video playsinline muted autoplay style="width:100%;height:100%;object-fit:contain;background:#000"></video>
     <img alt="Photo preview" hidden style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000">
     <div class="cam-msg" hidden style="position:absolute;left:16px;right:16px;top:40%;text-align:center;font-size:15px;line-height:1.4"></div></div>
   <div class="cam-shoot" style="display:flex;align-items:center;justify-content:space-around;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))">
     <button type="button" data-cam="cancel" style="background:none;border:0;color:#fff;font-size:16px;padding:10px;min-width:72px">Cancel</button>
     <button type="button" data-cam="snap" aria-label="Take photo" style="width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25)"></button>
     <button type="button" data-cam="flip" style="background:none;border:0;color:#fff;font-size:16px;padding:10px;min-width:72px">Flip</button></div>
   <div class="cam-check" hidden style="display:flex;align-items:center;justify-content:space-around;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))">
     <button type="button" data-cam="retake" style="background:none;border:1px solid #fff;color:#fff;font-size:16px;padding:12px 22px;border-radius:12px">Retake</button>
     <button type="button" data-cam="use" style="background:#fff;border:0;color:#111;font-weight:700;font-size:16px;padding:12px 26px;border-radius:12px">Use photo</button></div>
   <div style="display:flex;gap:18px;justify-content:center;padding:0 16px 14px;font-size:13px">
     <button type="button" data-cam="native" style="background:none;border:0;color:#bbb;text-decoration:underline;padding:6px">Use phone camera</button>
     <button type="button" data-cam="gallery" style="background:none;border:0;color:#bbb;text-decoration:underline;padding:6px">Choose from gallery</button></div>`;
  document.body.appendChild(el);CAM={el,facing,stream:null,blob:null,url:null};
  el.addEventListener('click',async e=>{const b=e.target.closest('[data-cam]');if(!b||!CAM)return;const k=b.dataset.cam,v=el.querySelector('video'),img=el.querySelector('img');
    if(k==='cancel'){PICKING=0;camClose()}
    else if(k==='flip'){CAM.facing=CAM.facing==='user'?'environment':'user';camStart()}
    else if(k==='snap'){if(!v.videoWidth){camMsg('The camera is not ready yet.');return}const sc=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);CAM.blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!CAM.blob){camMsg('Could not take the photo.');return}
      CAM.url=URL.createObjectURL(CAM.blob);img.src=CAM.url;img.hidden=false;el.querySelector('.cam-shoot').hidden=true;el.querySelector('.cam-check').hidden=false;v.pause()}
    else if(k==='retake'){img.hidden=true;el.querySelector('.cam-shoot').hidden=false;el.querySelector('.cam-check').hidden=true;v.play().catch(()=>{})}
    else if(k==='use'){const f=new File([CAM.blob],`photo-${Date.now()}.jpg`,{type:'image/jpeg'});camClose();camHand(f)}
    else if(k==='native'||k==='gallery'){camClose();if(k==='gallery')PICK.removeAttribute('capture');PICKING=Date.now()+10*60e3;try{PICK.click()}catch(err){}}});
  camStart()}

function schedChart(shifts,ws,n,gaps,me){gaps=gaps||[];const days=[...Array(n)].map((_,i)=>addDays(ws,i));

  let lo=mins.length?Math.floor(Math.min(...mins)/60)*60:540,hi=mins.length?Math.ceil(Math.max(...mins)/60)*60:1380;if(hi-lo<360)hi=lo+360;const span=hi-lo;const X=m=>((m-lo)/span*100).toFixed(2)+'%';
  const hrsL=[];for(let m=lo;m<=hi;m+=60)hrsL.push(m);const step=span>720?2:1;
  const lbl=m=>{const h=Math.floor(m/60)%24;return LANG_HOUR(h)};
  const gantt=`<div style="overflow-x:auto"><div style="min-width:520px">
   <div style="display:flex;margin-left:62px;position:relative;height:18px">${hrsL.map((m,i)=>i%step?'':`<span class="tiny muted" style="position:absolute;left:${X(m)};transform:translateX(-50%)">${lbl(m)}</span>`).join('')}</div>
   ${days.map(d=>{const ds=shifts.filter(s=>s.date===d).sort((a,b)=>toMin(a.start)-toMin(b.start));const lanes=[];ds.forEach(s=>{let li=lanes.findIndex(e=>e<=toMin(s.start));if(li<0){li=lanes.length;lanes.push(0)}lanes[li]=toMin(s.end);s._lane=li});
     const L=Math.max(1,lanes.length);const gp=gaps.filter(g=>g.date===d);
     return `<div style="display:flex;align-items:stretch;border-top:1px solid var(--line)"><div style="width:62px;flex:none;padding:6px 4px"><b class="small">${WD()[parseYmd(d).getDay()]}</b><div class="tiny muted">${fmtD(d,{month:'numeric',day:'numeric'})}</div></div>
      <div style="position:relative;flex:1;height:${L*26+10+(gp.length?8:0)}px">
       ${hrsL.map(m=>`<i style="position:absolute;top:0;bottom:0;left:${X(m)};border-left:1px solid var(--line)"></i>`).join('')}
       ${ds.map(s=>{const c=D.employees[s.empId]?.color||COLORS[0];const e=toMin(s.end)<=toMin(s.start)?toMin(s.end)+1440:toMin(s.end);const tap=!me&&s.id&&D.shifts[s.id]&&mode()==='mgr';return `<div title="${esc(empName(s.empId))} ${esc(fmtT(s.start))}–${esc(fmtT(s.end))}"${tap?` data-act="swapPick" data-id="${esc(s.id)}" role="button" tabindex="0"`:''} style="${tap?'cursor:pointer;':''}position:absolute;top:${5+s._lane*26}px;height:22px;left:${X(toMin(s.start))};width:calc(${X(e)} - ${X(toMin(s.start))});background:${esc(c)};${s.warn?.length?'outline:2px solid var(--bad);outline-offset:1px;':me&&s.empId===me?'outline:2px solid var(--ink);outline-offset:1px;':''}border-radius:6px;color:#fff;font-size:11px;font-weight:600;line-height:22px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(empName(s.empId).split(' ')[0])}${me&&s.empId===me?' (you)':''} ${esc(fmtT(s.start))}–${esc(fmtT(s.end))}</div>`}).join('')}
       ${gp.map(g=>`<div title="Short ${g.missing}" style="position:absolute;bottom:2px;height:5px;left:${X(toMin(g.start))};width:calc(${X(toMin(g.end))} - ${X(toMin(g.start))});background:var(--bad);border-radius:3px"></div>`).join('')}
      </div></div>`}).join('')}</div></div>`;
  const ids=[...new Set(shifts.map(s=>s.empId))].sort((a,b)=>empName(a).localeCompare(empName(b)));
  const grid=ids.length?`<div class="tbl"><table><thead><tr><th>Staff</th>${days.map(d=>`<th>${WD()[parseYmd(d).getDay()]} ${fmtD(d,{month:'numeric',day:'numeric'})}</th>`).join('')}<th>Hours</th></tr></thead><tbody>${ids.map(id=>{const tot=shifts.filter(s=>s.empId===id).reduce((a,s)=>a+shiftHrs(s),0);
    return `<tr><td><span class="dot" style="display:inline-block;background:${esc(D.employees[id]?.color||COLORS[0])};margin-right:6px"></span>${esc(empName(id))}</td>${days.map(d=>{const x=shifts.filter(s=>s.empId===id&&s.date===d);return `<td style="text-align:center">${x.length?x.map(s=>`<span class="chip" style="background:${esc(D.employees[id]?.color||COLORS[0])};color:#fff">${esc(fmtT(s.start))}–${esc(fmtT(s.end))}</span>`).join('<br>'):'<span class="muted">—</span>'}</td>`}).join('')}<td><b>${fmtH(tot)}</b></td></tr>`}).join('')}</tbody></table></div>`:'';
  return `<div class="stack">${gantt}${gaps.length?`<div class="tiny" style="color:var(--bad)">Red underline = not enough people at that time.</div>`:''}${grid}</div>`}
const LANG_HOUR=h=>h===0?'12a':h===12?'12p':h<12?h+'a':(h-12)+'p';

// Clock-in always needs a selfie: any path without one opens the camera instead.
function pickSelfie(kind,id){const x=document.createElement('input');x.type='file';x.accept='image/*';x.setAttribute('capture','user');x.dataset.up=kind||'selfie';if(id)x.dataset.id=id;x.hidden=true;document.body.appendChild(x);x.addEventListener('change',()=>setTimeout(()=>x.remove(),0));x.click()}
async function doClockIn(selfie,now){if(!selfie){pickSelfie();return null}const me=actor();if(!me)return;if(openPunch(me)){toast(L('Already clocked in','已经打过卡'));return}now=now||new Date();const d=bizDate();
  const sh=shiftsOn(d,me);let best=null;sh.forEach(s=>{const dt=Math.abs(now-atTime(d,s.start));if(!best||dt<best.dt)best={s,dt}});
  let late=0;if(best){const m=(now-atTime(d,best.s.start))/6e4;if(m>(D.settings.lateGrace||0))late=Math.round(m)}
  const body={empId:me,loc:curLoc(),date:d,in:now.toISOString(),out:null,shiftId:best?.s.id||null,late,selfie:selfie||null};const pid=uidGen();
  if(await W(A.db.doc('punches/'+pid).set(body))){D.punches[pid]={id:pid,...body};toast(late?L(`Clocked in · ${late} min late`,`已打卡 · 迟到 ${late} 分钟`):L('Clocked in. Have a great shift!','已打卡，上班愉快！'));return pid}return null}
/* AI: the clock-in selfie should show a person at the store with the BLISS logo (B with a leaf, or the word BLISS) */
async function aiCheckSelfie(pid,photoId,blob,out){const K=(out?'so':'s')+pid,F=out?'selfieOut':'selfie',FA=out?'selfieOutAi':'selfieAi';if(!A.sample||AIC[K])return;AIC[K]=true;render();
  try{blob=blob||await blobOf(photoId);if(!blob)return;
    const r=await A.sample.json(`This is a ${out?'clock-out':'clock-in'} selfie from a staff member at BLISS, a matcha shop. The rule: the selfie must be taken in the store with the BLISS logo visible behind the person.
The BLISS logo is a white or green outline letter "B" with a leaf inside it, and/or the word "BLISS" (often with "MATCHA AND BEYOND"); it may be on a wall, sign, window, cup, menu board or apron.
Check: 1) a person's face is visible; 2) the BLISS logo or word BLISS is visible anywhere in the photo (it can be small, partly covered or at an angle).
Return JSON only: {"person": true|false, "logo": true|false, "note": "if something is missing, say what in at most 10 words, else empty"}`,{images:[blob],modelTier:'default'});
    const ok=r?.logo!==false&&r?.person!==false;const res={ok,logo:r?.logo!==false,person:r?.person!==false,note:String(r?.note||'').slice(0,100),photo:photoId,at:new Date().toISOString()};
    if(D.punches[pid]?.[F]!==photoId)return;
    await A.db.doc('punches/'+pid).update({[FA]:res});D.punches[pid]={...D.punches[pid],[FA]:res};
    if(!ok)toast(L('BLISS logo not visible — please retake your selfie','看不到 BLISS logo，请重拍自拍'));
  }catch(e){console.warn('ai selfie',e)}finally{delete AIC[K];render()}}

// First guess at who can cover (the server checks again, including max weekly hours).

const id0=id=>id?D.shifts[id]:null;
/* ---------- backups: every shift should have someone free to cover it ---------- */
// Free for the whole shift per their availability, same store, not already working then.
function backupCands(s){const loc=s.loc||locOf(s.empId);const ws=weekStart(s.date),we=addDays(ws,6);const wk=id=>Object.values(D.shifts).filter(x=>x.empId===id&&x.date>=ws&&x.date<=we).reduce((a,x)=>a+shiftHrs(x),0);
  return Object.values(D.employees).filter(e=>e.active!==false&&e.id!==s.empId&&worksAt(e.id,loc)&&!cvClash(e.id,s)&&availFor(e.id,s.date,s.start,s.end)==='yes').sort((a,b)=>wk(a.id)-wk(b.id)||a.name.localeCompare(b.name)).map(e=>e.id)}
// The chosen backup (a manager can pick one; otherwise the free person with the fewest hours that week).
function backupSetCard(){if(!isMgr)return'';const on=backupOn();return `<div class="card stack"><h3>Backups</h3><p class="small muted">${on?'Every shift gets a backup: someone free for the whole shift (from availability), who is asked first if the person can\'t come. Shifts with no one free are flagged in Schedule. You can turn this off for single shifts when you edit them.':'Turn on to give every shift a backup person who is asked first if someone can\'t come.'}</p><button class="btn ${on?'':'pri'}" data-act="backupToggle">${on?'Turn off backups':'Turn on backups'}</button></div>`}
const backupOn=()=>D.settings.backupOn!==false;
const needsBackup=s=>backupOn()&&!s?.noBackup;
function backupOf(s){if(!needsBackup(s))return null;const c=backupCands(s);if(s.backup&&c.includes(s.backup))return s.backup;return c[0]||null}
const backupLine=s=>{if(!backupOn())return'';if(s.noBackup)return '<span class="tiny muted">No backup needed</span>';const b=backupOf(s);return b?`<span class="tiny muted">Backup: ${esc(first(b))}${s.backup===b?'':' (auto)'}</span>`:`<span class="tiny" style="color:var(--bad);font-weight:600">⚠ No backup: no one else is free then</span>`};
function noBackupCount(days){return days.reduce((n,d)=>n+shiftsOn(d).filter(s=>needsBackup(s)&&atTime(s.date,s.start).getTime()>Date.now()&&!backupOf(s)).length,0)}
function backupDuty(me){const up=Object.values(D.shifts).filter(s=>shiftVisible(s)&&s.empId!==me&&s.date>=today()&&s.date<=addDays(today(),13)&&atTime(s.date,s.start).getTime()>Date.now()&&backupOf(s)===me).sort((a,b)=>a.date.localeCompare(b.date)||toMin(a.start)-toMin(b.start));
  return up.length?`<div class="card stack"><h3>You're the backup</h3><p class="small muted">You're free at these times, so if someone can't come you'll be asked first.</p><div class="list">${up.slice(0,6).map(s=>`<div class="li" style="padding-inline:0"><div class="grow"><div class="t">${fmtD(s.date)} · ${fmtT(s.start)}–${fmtT(s.end)}</div><div class="small muted">for ${esc(first(s.empId))}</div></div></div>`).join('')}</div></div>`:''}

/* ---------- schedule review: managers send a week to the owner; staff see it once the owner approves ---------- */
const ownerAct=()=>isOwner&&!UI.pv;
const PUB=()=>D.schedPub||{};
const pubOn=()=>PUB().on===true;
const pubKey=(loc,ws)=>`${loc}_${ws}`;
const pubShifts=(loc,ws)=>{const we=addDays(ws,6);return Object.values(D.shifts).filter(s=>(s.loc||locOf(s.empId))===loc&&s.date>=ws&&s.date<=we)};
const shSnap=s=>({id:s.id,e:s.empId,d:s.date,s:s.start,t:s.end});
function weekState(loc,ws){if(!pubOn()||ws<(PUB().from||'9999'))return'live';const k=pubKey(loc,ws);const p=PUB().weeks?.[k];const s=D.schedSub?.[k];
  if(p?.status==='published')return'published';if(s?.at&&(!p?.at||s.at>p.at))return'submitted';if(p?.status==='changes')return'changes';return'draft'}
// Staff only see weeks that are live or approved.
const shiftVisible=s=>mode()!=='emp'||['live','published'].includes(weekState(s.loc||locOf(s.empId),weekStart(s.date)));
function pubDiff(loc,ws){const p=PUB().weeks?.[pubKey(loc,ws)];if(p?.status!=='published'||!p.snap)return[];const old=Object.fromEntries(p.snap.map(x=>[x.id,x]));const now=pubShifts(loc,ws).map(shSnap);const cur=Object.fromEntries(now.map(x=>[x.id,x]));const out=[];
  now.forEach(x=>{const o=old[x.id];if(!o)out.push({k:'add',n:x});else if(o.e!==x.e||o.d!==x.d||o.s!==x.s||o.t!==x.t)out.push({k:'chg',o,n:x})});
  p.snap.forEach(o=>{if(!cur[o.id])out.push({k:'del',o})});return out.sort((a,b)=>((a.n||a.o).d+(a.n||a.o).s).localeCompare((b.n||b.o).d+(b.n||b.o).s))}
const PUBST={live:['','Published'],draft:['','Draft · staff can\'t see it yet'],submitted:['warn','Waiting for owner review'],changes:['bad','Owner asked for changes'],published:['ok','Approved · staff can see it']};
function pubWeeks(){const ws=weekStart(today());return [0,7,14,21].map(n=>addDays(ws,n))}
function pubAttention(){const a=[];if(!pubOn())return a;const locs=ownerAct()?LOCS().map(l=>l.id):[curLoc()];
  for(const loc of locs)for(const ws of pubWeeks()){const st=weekState(loc,ws);
    if(ownerAct()&&st==='submitted')a.push({k:'pub',loc,ws,html:pubRow(loc,ws,chip('warn','Schedule'),`${esc(locName(loc))} · week of ${fmtD(ws,{month:'short',day:'numeric'})} is waiting for your review`)});
    if(ownerAct()&&st==='published'&&addDays(ws,6)>=today()){const n=pubDiff(loc,ws).length;if(n)a.push({k:'pub',loc,ws,html:pubRow(loc,ws,chip('info','Changed'),`${esc(locName(loc))} · week of ${fmtD(ws,{month:'short',day:'numeric'})}: ${n} change${n>1?'s':''} since you approved`)})}
    if(!ownerAct()&&st==='changes')a.push({k:'pub',loc,ws,html:pubRow(loc,ws,chip('bad','Schedule'),`Owner asked for changes · week of ${fmtD(ws,{month:'short',day:'numeric'})}${PUB().weeks?.[pubKey(loc,ws)]?.note?`<div class="small muted">“${esc(PUB().weeks[pubKey(loc,ws)].note)}”</div>`:''}`)})}
  return a}
const pubRow=(loc,ws,c,t)=>`<div class="li tap" data-act="pubOpen" data-l="${esc(loc)}" data-ws="${ws}">${c}<div class="grow">${t}</div>${ic('chev')}</div>`;

// Bar at the top of Schedule for the week being planned.
function pubBar(ws){if(!pubOn())return ownerAct()?`<div class="small muted row wrapr"><span class="grow">Owner review is off: schedules go to staff right away.</span><button class="btn sm" data-act="pubToggle" data-on="1">Turn on review</button></div>`:'';
  const loc=curLoc();const st=weekState(loc,ws);if(st==='live')return'';const [k,t]=PUBST[st];const n=st==='published'?pubDiff(loc,ws).length:0;const sub=D.schedSub?.[pubKey(loc,ws)];const p=PUB().weeks?.[pubKey(loc,ws)];
  const btn=ownerAct()?(st==='published'?(n?`<button class="btn sm" data-act="pubOpen" data-l="${loc}" data-ws="${ws}">See ${n} change${n>1?'s':''}</button>`:''):`<button class="btn sm pri" data-act="pubOpen" data-l="${loc}" data-ws="${ws}">Review & publish</button>`)
    :(st==='draft'||st==='changes'?`<button class="btn sm pri" data-act="pubOpen" data-l="${loc}" data-ws="${ws}">Send to owner</button>`:`<button class="btn sm" data-act="pubOpen" data-l="${loc}" data-ws="${ws}">Details</button>`);
  return `<div class="card row wrapr" style="border-left:4px solid var(--${k||'line'})"><div class="grow"><div class="t">${chip(k,t)}</div><div class="small muted" style="margin-top:4px">${st==='submitted'?`Sent ${sub?.byName?'by '+esc(sub.byName)+' ':''}${fmtDT(sub?.at)}`:st==='published'?`Approved ${p?.byName?'by '+esc(p.byName)+' ':''}${fmtDT(p?.at)}${n?` · ${n} change${n>1?'s':''} since`:''}`:st==='changes'&&p?.note?`“${esc(p.note)}”`:'Staff will see this week after the owner approves it.'}</div></div>${btn}</div>`}

function pubSheet(loc,ws){openSheet({live:true,title:()=>`${esc(locName(loc))} · week of ${fmtD(ws,{month:'short',day:'numeric'})}`,body:()=>{const st=weekState(loc,ws);const sh=pubShifts(loc,ws).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const [k,t]=PUBST[st];const sub=D.schedSub?.[pubKey(loc,ws)];const p=PUB().weeks?.[pubKey(loc,ws)];
  const hrs={};sh.forEach(s=>{hrs[s.empId]=(hrs[s.empId]||0)+shiftHrs(s)});const tot=Object.values(hrs).reduce((a,b)=>a+b,0);
  const cost=seePay()?Object.entries(hrs).reduce((a,[e,h])=>{const W_=wageOf(e);return a+h*(W_.pay||W_.cash||trainOf(e).rate||0)},0):null;
  const future=sh.filter(s=>atTime(s.date,s.start).getTime()>Date.now());const nobk=future.filter(s=>needsBackup(s)&&!backupOf(s));const unav=sh.filter(s=>['no','off'].includes(availFor(s.empId,s.date,s.start,s.end)));const dbl=sh.filter(s=>sh.some(x=>x!==s&&x.empId===s.empId&&ovl(x,s)));
  const max=D.schedCfg?.maxHrs||{};const over=Object.entries(hrs).filter(([e,h])=>num(max[e])&&h>num(max[e]));
  const diff=st==='published'?pubDiff(loc,ws):[];const line=x=>`${esc(empName(x.e))} · ${fmtD(x.d,{weekday:'short',month:'numeric',day:'numeric'})} ${fmtT(x.s)}–${fmtT(x.t)}`;
  return `<div class="card stack"><div>${chip(k,t)}</div>${sub?.at?`<div class="small muted">Sent by ${esc(sub.byName||'manager')} · ${fmtDT(sub.at)}${sub.note?`<br>“${esc(sub.note)}”`:''}</div>`:''}${p?.at?`<div class="small muted">${p.status==='published'?'Approved':'Changes asked'} by ${esc(p.byName||'owner')} · ${fmtDT(p.at)}${p.status==='changes'&&p.note?`<br>“${esc(p.note)}”`:''}</div>`:''}</div>
   ${diff.length?`<div class="card stack" style="border-left:4px solid var(--info)"><h3>Changed since you approved</h3>${diff.map(x=>`<div class="small">${x.k==='add'?`<b style="color:var(--ok)">Added</b> ${line(x.n)}`:x.k==='del'?`<b style="color:var(--bad)">Removed</b> ${line(x.o)}`:`<b style="color:var(--warn)">Changed</b> ${line(x.o)} → ${x.n.e!==x.o.e?esc(empName(x.n.e))+' · ':''}${fmtD(x.n.d,{weekday:'short'})} ${fmtT(x.n.s)}–${fmtT(x.n.t)}${D.shifts[x.n.id]?.coverId?' <span class="muted">(shift cover)</span>':''}`}</div>`).join('')}${ownerAct()?`<button class="btn" data-act="pubAck" data-l="${loc}" data-ws="${ws}">${ic('check')} Got it</button>`:''}</div>`:''}
   <div class="stats" style="grid-template-columns:repeat(${cost!=null?3:2},1fr)"><div class="stat"><b>${sh.length}</b><span>Shifts</span></div><div class="stat"><b>${fmtH(tot)}</b><span>Total hours</span></div>${cost!=null?`<div class="stat"><b>${money(cost)}</b><span>Est. labor</span></div>`:''}</div>
   ${[[nobk,'bad',x=>`No backup: ${esc(empName(x.empId))} ${fmtD(x.date,{weekday:'short'})} ${fmtT(x.start)}–${fmtT(x.end)}`],[unav,'warn',x=>`Not available then: ${esc(empName(x.empId))} ${fmtD(x.date,{weekday:'short'})} ${fmtT(x.start)}–${fmtT(x.end)}`],[dbl,'bad',x=>`Double-booked: ${esc(empName(x.empId))} ${fmtD(x.date,{weekday:'short'})}`],[over,'warn',([e,h])=>`Over max hours: ${esc(empName(e))} ${fmtH(h)} h (max ${fmtH(num(max[e]))})`]].filter(([l])=>l.length).map(([l,c,f])=>`<div class="hint ${c==='bad'?'warn':''}">${l.slice(0,8).map(f).join('<br>')}${l.length>8?`<br>+${l.length-8} more`:''}</div>`).join('')||(sh.length?'<div class="small" style="color:var(--ok)">✓ No problems found: everyone is available, no double-booking, every shift has a backup.</div>':'')}
   ${sh.length?`<div class="small muted">Tap a shift to see who else can work it and swap them in.</div>`+schedChart(sh,ws,7,[]):'<div class="empty card">No shifts this week yet.</div>'}
   <div class="card stack"><h3>Hours per person</h3>${Object.entries(hrs).sort((a,b)=>b[1]-a[1]).map(([e,h])=>`<div class="row">${avatar(e)}<span class="grow">${esc(empName(e))}</span><b>${fmtH(h)} h</b></div>`).join('')||'<div class="small muted">—</div>'}</div>
   ${ownerAct()&&st!=='published'||(!ownerAct()&&['draft','changes','submitted'].includes(st))?`<label class="f">${ownerAct()?'Note for the manager (needed if you ask for changes)':'Note for the owner (optional)'}<textarea class="in" id="pub_note" rows="2" placeholder="${ownerAct()?'e.g. Too many hours on Monday':'e.g. Bella is off Friday'}"></textarea></label>`:''}`},
  foot:()=>{const st=weekState(loc,ws);if(ownerAct())return st==='published'?`<button class="btn" data-act="pubUnpub" data-l="${loc}" data-ws="${ws}">Hide from staff</button><button class="btn pri" data-act="closeSheet">Close</button>`:`<button class="btn" data-act="pubChanges" data-l="${loc}" data-ws="${ws}">Ask for changes</button><button class="btn pri" data-act="pubApprove" data-l="${loc}" data-ws="${ws}">${ic('check')} Approve & publish</button>`;
   return st==='published'?`<button class="btn pri" data-act="closeSheet">Close</button>`:`<button class="btn" data-act="closeSheet">Close</button><button class="btn pri" data-act="pubSubmit" data-l="${loc}" data-ws="${ws}">${st==='submitted'?'Send again':'Send to owner for review'}</button>`}})}

async function pubSave(key,val){const cur=PUB();const weeks={...(cur.weeks||{}),[key]:val};const doc={...cur,weeks};delete doc.id;if(await W(A.db.doc('schedpub/state').set(doc))){D.schedPub={...doc};return true}return false}
const pubNotify=(event,loc,ws,note)=>window.blissCover?.notifySched?.(event,loc,ws,note).catch(e=>console.warn('sched notify',e));
Object.assign(ACT,{
 pubOpen:d=>pubSheet(d.l,d.ws),
 pubSubmit:async d=>{const note=$('#pub_note')?.value.trim()||'';const k=pubKey(d.l,d.ws);const v={at:new Date().toISOString(),byName:myName(),note};
   if(await W(A.db.doc('mgr/schedsub').set({...(D.schedSub||{}),[k]:v}))){D.schedSub={...(D.schedSub||{}),[k]:v};toast('Sent to the owner for review');pubNotify('submitted',d.l,d.ws,note);closeSheet()}},
 pubApprove:async d=>{const v={status:'published',at:new Date().toISOString(),byName:myName(),snap:pubShifts(d.l,d.ws).map(shSnap)};
   if(await pubSave(pubKey(d.l,d.ws),v)){celebrate('Schedule published','Staff can see this week now.');pubNotify('approved',d.l,d.ws,'');closeSheet()}},
 pubChanges:async d=>{const note=$('#pub_note')?.value.trim()||'';if(!note){toast('Write a note so the manager knows what to change');$('#pub_note')?.focus();return}
   if(await pubSave(pubKey(d.l,d.ws),{status:'changes',at:new Date().toISOString(),byName:myName(),note})){toast('Sent back to the manager');pubNotify('changes',d.l,d.ws,note);closeSheet()}},
 pubAck:async d=>{const k=pubKey(d.l,d.ws);const p=PUB().weeks?.[k];if(await pubSave(k,{...p,snap:pubShifts(d.l,d.ws).map(shSnap),ackAt:new Date().toISOString()})){toast('Marked as seen');closeSheet()}},
 pubUnpub:async d=>{if(!confirm('Hide this week from staff until you approve it again?'))return;if(await pubSave(pubKey(d.l,d.ws),{status:'draft',at:new Date().toISOString(),byName:myName()})){toast('Hidden from staff');closeSheet()}},
 pubToggle:async d=>{const on=d.on==='1';const cur=PUB();const doc={...cur,on,from:on?(cur.from&&cur.on?cur.from:pubFrom()):cur.from||pubFrom(),weeks:cur.weeks||{}};delete doc.id;
   if(on&&!cur.from){/* weeks already planned before turning this on stay visible */}
   if(await W(A.db.doc('schedpub/state').set(doc))){D.schedPub=doc;toast(on?`Review is on, starting the week of ${fmtD(doc.from,{month:'short',day:'numeric'})}`:'Review is off');render()}},
});
function pubSetCard(){if(!ownerAct())return'';const on=pubOn();
  return `<div class="card stack"><h3>Schedule review</h3><p class="small muted">${on?`Managers send each week to you. Staff only see a week after you approve it. Changes after you approve go live right away, and you get a "Schedule changed" alert. Applies from the week of ${fmtD(PUB().from,{month:'short',day:'numeric'})}.`:'Turn this on to approve each week\'s schedule before staff can see it.'}</p><button class="btn ${on?'':'pri'}" data-act="pubToggle" data-on="${on?'0':'1'}">${on?'Turn off review':'Turn on review'}</button></div>`}
// First week with nothing scheduled yet (any store), so weeks already planned stay visible to staff.
function pubFrom(){let ws=nextWk();for(let i=0;i<8;i++){if(!Object.values(D.shifts).some(s=>s.date>=ws&&s.date<=addDays(ws,6)))return ws;ws=addDays(ws,7)}return ws}

/* ---------- replace who works a shift (tap a shift in the chart) ---------- */
function swapSheet(sid){const back=SH;openSheet({live:true,title:()=>{const s=D.shifts[sid];return s?`Replace ${esc(first(s.empId))}`:'Shift'},body:()=>{const s=D.shifts[sid];if(!s)return'<div class="empty">This shift was removed.</div>';
  const loc=s.loc||locOf(s.empId);const ws=weekStart(s.date),we=addDays(ws,6);const wk=id=>Object.values(D.shifts).filter(x=>x.empId===id&&x.date>=ws&&x.date<=we).reduce((a,x)=>a+shiftHrs(x),0);const max=D.schedCfg?.maxHrs||{};const bk=backupOf(s);
  const rows=Object.values(D.employees).filter(e=>e.active!==false&&e.id!==s.empId&&worksAt(e.id,loc)).map(e=>{const clash=cvClash(e.id,s);const av=availFor(e.id,s.date,s.start,s.end);const h=wk(e.id);const over=num(max[e.id])&&h+shiftHrs(s)>num(max[e.id]);
    const g=clash?3:av==='yes'?0:av==='partial'||av==='unknown'?1:2;return{e,clash,av,h,over,g}}).sort((a,b)=>a.g-b.g||(b.e.id===bk)-(a.e.id===bk)||(b.e.role==='Manager')-(a.e.role==='Manager')||a.h-b.h||a.e.name.localeCompare(b.e.name));
  const grp=[[0,'Free the whole time'],[1,'Maybe (partly free or availability not filled in)'],[2,'Not available then'],[3,'Already working then']];
  return `<div class="card row">${avatar(s.empId)}<div class="grow"><div class="t">${esc(empName(s.empId))}</div><div class="small muted">${fmtD(s.date,{weekday:'long',month:'short',day:'numeric'})} · ${fmtT(s.start)}–${fmtT(s.end)} · ${fmtH(shiftHrs(s))} h</div></div><button class="btn sm" data-act="swapEdit" data-id="${esc(sid)}">Edit times</button></div>
   ${grp.map(([g,t])=>{const r=rows.filter(x=>x.g===g);return r.length?`<div class="eyebrow">${t}</div><div class="card flush list">${r.map(x=>`<div class="li tap" data-act="swapDo" data-id="${esc(sid)}" data-e="${esc(x.e.id)}" tabindex="0" style="${g>=2?'opacity:.6':''}">${avatar(x.e.id)}<div class="grow"><div class="t">${esc(x.e.name)}${x.e.role==='Manager'?(x.e.regional?' · Regional Manager':' · Manager'):''}</div><div class="small muted">${fmtH(x.h)} h this week${num(max[x.e.id])?` (max ${fmtH(num(max[x.e.id]))})`:''}${x.e.id===bk?' · <b style="color:var(--ok)">backup</b>':''}</div></div>${x.over?chip('warn','Over max'):''}${x.clash?chip('bad','Already on'):availChip(x.av)}</div>`).join('')}</div>`:''}).join('')||'<div class="empty card">No one else at this store.</div>'}`},
  foot:()=>back?`<button class="btn block" data-act="swapBack">Back</button>`:`<button class="btn block" data-act="closeSheet">Close</button>`});SH.back=back}
Object.assign(ACT,{
 setCat:d=>{UI.setCat=d.k||null;window.scrollTo(0,0);render()},
 backupToggle:async()=>{const v=!backupOn();if(await W(A.db.doc('config/settings').update({backupOn:v}))){D.settings.backupOn=v;toast(v?'Backups are on':'Backups are off');render()}},
 swapPick:d=>swapSheet(d.id),
 swapBack:()=>{const b=SH?.back;if(b){SH=b;drawSheet()}else closeSheet()},
 swapEdit:d=>{const s=D.shifts[d.id];if(s)shiftSheet(d.id,s.date)},
 swapDo:async d=>{const s=D.shifts[d.id];if(!s)return;const e=D.employees[d.e];const warn=cvClash(d.e,s)?`\n${e.name} is already working then.`:['no','off'].includes(availFor(d.e,s.date,s.start,s.end))?`\n${e.name} said they're not available then.`:'';
   if(!confirm(`Give ${fmtD(s.date,{weekday:'short',month:'short',day:'numeric'})} ${fmtT(s.start)}–${fmtT(s.end)} to ${e.name} instead of ${empName(s.empId)}?${warn}`))return;
   const body={...s,empId:d.e,loc:shLoc(s),replaced:s.empId};delete body.id;delete body.backup;
   if(!await W(A.db.doc('shifts/'+d.id).set(body)))return;D.shifts[d.id]={id:d.id,...body};
   // the owner's own change doesn't need a "changed since you approved" alert
   const loc=body.loc,ws=weekStart(s.date),k=pubKey(loc,ws),p=PUB().weeks?.[k];
   if(ownerAct()&&p?.status==='published'&&p.snap&&pubDiff(loc,ws).length===1)await pubSave(k,{...p,snap:pubShifts(loc,ws).map(shSnap)});
   toast(`${first(d.e)} has the shift now`);ACT.swapBack()},
});

/* ---------- edit the training checklist (config/training) or the training list of how-tos (config/guide) ---------- */

async function saveCfg(k,cfg){cfg={...cfg};delete cfg.id;if(!await W(A.db.doc('config/'+k).set(cfg)))return false;if(k==='guide')D.guideCfg=cfg;else D.trainCfg=cfg;return true}
const docList=cfg=>(cfg?.docs||[]).map(d=>typeof d==='string'?{id:slug(d),name:d}:d).filter(d=>d&&d.name);
function trGrab(){if(!TR)return;{const ln=$('#tr_listname');if(ln)TR.listName=ln.value}document.querySelectorAll('[data-trs]').forEach(el=>{const x=TR.S[+el.dataset.trs];if(x&&+el.dataset.trs!==TR.cur)x.title=el.value});const sec=TR.S[TR.cur];if(!sec)return;const t=$('#tr_title');if(t)sec.title=t.value;const dl=$('#tr_done');if(dl)sec.doneLabel=dl.value.trim();const hh=$('#tr_hours');if(hh)sec.hours=hh.value===''?undefined:+hh.value;
  document.querySelectorAll('[data-trn]').forEach(el=>{const it=sec.items[+el.dataset.trn];if(it)it.name=el.value});

// Body format: "## " heading · "- " bullet · "1. " step · "! " important · "| a | b |" table (first row is the header)
function guideHtml(body){const L0=String(body||'').split('\n');let h='',list=null,tbl=null;
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const close=()=>{if(list){h+=`</${list}>`;list=null}if(tbl){h+=`<div style="overflow-x:auto"><table class="gtbl"><thead><tr>${tbl[0].map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${tbl.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;tbl=null}};
  for(const raw of L0){const l=raw.trim();
    if(/^\|.*\|$/.test(l)){if(list){h+=`</${list}>`;list=null}(tbl=tbl||[]).push(l.slice(1,-1).split('|').map(c=>c.trim()));continue}
    if(tbl)close();
    if(l.startsWith('- ')){if(list!=='ul'){close();h+='<ul class="gl">';list='ul'}h+=`<li>${inl(l.slice(2))}</li>`;continue}
    if(/^\d+\.\s/.test(l)){if(list!=='ol'){close();h+='<ol class="gl">';list='ol'}h+=`<li>${inl(l.replace(/^\d+\.\s/,''))}</li>`;continue}
    close();if(!l)continue;
    if(l.startsWith('## '))h+=`<h4 class="gh">${inl(l.slice(3))}</h4>`;else if(l.startsWith('! '))h+=`<div class="gwarn">⚠️ ${inl(l.slice(2))}</div>`;else h+=`<p>${inl(l)}</p>`}
  close();return h}

/* ---------- shift bonus: paid per shift when the tasks due during that shift were done ---------- */
const bonusCfg=()=>({perShift:0,minPct:100,noIssues:true,onTime:false,via:'payroll',...(D.bonusCfg||{})});
const bonusOn=()=>num(bonusCfg().perShift)>0;
// One worked day = one shift (several punches on the same day are joined). A task belongs to the shift when it is due between clock-in and clock-out (+ photo grace).
function bonusDays(emp,P){const c=bonusCfg();const by={};P.filter(p=>p.out).forEach(p=>{(by[p.date]=by[p.date]||[]).push(p)});
  return Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,ps])=>{const a=Math.min(...ps.map(p=>new Date(p.in).getTime())),b=Math.max(...ps.map(p=>new Date(p.out).getTime()))+(D.settings.photoGrace||0)*6e4;const loc=ps[0].loc||locOf(emp);const late=Math.max(0,...ps.map(p=>p.late||0));
    const due=tasksOn(date).filter(T=>{const t=atTime(date,T.time(date,loc)).getTime();return t>=a&&t<=b}).map(T=>({T,s:taskState(date,T.type,loc)}));
    const on=due.filter(x=>x.s.st==='ontime').length,iss=due.filter(x=>x.s.doc?.review?.status==='issue').length;const pct=due.length?Math.round(on/due.length*100):100;
    const why=[];if(pct<num(c.minPct))why.push(`tasks on time ${on}/${due.length}`);if(c.noIssues&&iss)why.push(`${iss} task${iss>1?'s':''} flagged`);if(c.onTime&&late)why.push(`late ${late} min`);
    return{date,due,on,iss,pct,late,ok:!why.length,why}})}
function bonusCard(ps,pl,R){if(!isMgr)return'';const c=bonusCfg();const own=seePay();
  if(!bonusOn())return own?`<div class="card row wrapr"><div class="grow"><div class="t">Shift bonus</div><div class="small muted">Pay a bonus for each shift where the tasks were done on time.</div></div><button class="btn sm" data-act="bonusEdit">Set up</button></div>`:'';
  const rows=Object.values(R).filter(r=>r.bon&&r.bon.days.length);const ok=rows.reduce((a,r)=>a+r.bon.ok,0),all=rows.reduce((a,r)=>a+r.bon.days.length,0);
  return `<div class="card stack"><div class="row wrapr"><div class="grow"><div class="t">Shift bonus${own?` · ${money(num(c.perShift))} per shift`:''}</div><div class="small muted">${num(c.minPct)}% of tasks on time${c.noIssues?' · no flagged tasks':''}${c.onTime?' · clocked in on time':''}${own?` · paid ${c.via==='cash'?'in cash':'with payroll'}`:''}</div></div>${own?`<button class="btn sm" data-act="bonusEdit">Edit</button>`:''}</div>
   <div class="stats" style="grid-template-columns:repeat(${own?3:2},1fr)"><div class="stat"><b>${ok}/${all}</b><span>Shifts earned it</span></div><div class="stat"><b>${rows.filter(r=>r.bon.ok).length}</b><span>People</span></div>${own?`<div class="stat"><b>${money(rows.reduce((a,r)=>a+r.bon.amt,0))}</b><span>Bonus total</span></div>`:''}</div></div>`}
function bonusDetail(emp,ps,pl){if(!bonusOn())return'';const pe=addDays(ps,pl-1);const P=Object.values(D.punches).filter(p=>p.empId===emp&&p.date>=ps&&p.date<=pe);const B=bonusDays(emp,P);if(!B.length)return'';const ok=B.filter(x=>x.ok).length;
  return `<div class="eyebrow">Shift bonus · ${ok}/${B.length} shifts${seePay()?` · ${money(ok*num(bonusCfg().perShift))}`:''}</div><div class="card flush list">${B.map(x=>`<div class="li"><span style="font-size:18px;color:${x.ok?'var(--ok)':'var(--bad)'}">${x.ok?'✓':'✗'}</span><div class="grow"><div class="t">${fmtD(x.date)}</div><div class="small muted">${x.due.length?`${x.on}/${x.due.length} tasks on time: ${x.due.map(d=>esc(d.T.name())+(d.s.st==='ontime'?' ✓':d.s.st==='late'?' (late)':' ✗')).join(', ')}`:'No tasks due during this shift'}${x.why.length?` · <b style="color:var(--bad)">${esc(x.why.join(', '))}</b>`:''}</div></div></div>`).join('')}</div>`}
function bonusSheet(){const c=bonusCfg();openSheet({title:()=>'Shift bonus',body:()=>`<p class="small muted">Each shift is checked on its own. A task counts for a shift when it's due between that person's clock-in and clock-out. Shifts with no tasks due still earn it if the other rules are met.</p>
   <div class="g2"><label class="f">Bonus per shift ($)<input class="in" type="number" min="0" step="0.5" id="bo_amt" value="${num(c.perShift)||''}" placeholder="0 = off"></label><label class="f">Tasks on time at least (%)<input class="in" type="number" min="0" max="100" step="5" id="bo_pct" value="${num(c.minPct)}"></label></div>
   <label class="row" style="gap:8px"><input type="checkbox" id="bo_iss" ${c.noIssues?'checked':''}> No task flagged by a manager review</label>
   <label class="row" style="gap:8px"><input type="checkbox" id="bo_late" ${c.onTime?'checked':''}> Clocked in on time</label>
   <label class="f">Paid<select class="in" id="bo_via"><option value="payroll" ${c.via!=='cash'?'selected':''}>With payroll</option><option value="cash" ${c.via==='cash'?'selected':''}>In cash</option></select></label>`,
  foot:()=>`<button class="btn" data-act="closeSheet">Cancel</button><button class="btn pri" data-act="bonusSave">Save</button>`})}
Object.assign(ACT,{
 bonusEdit:()=>bonusSheet(),
 bonusSave:async()=>{const v={perShift:Math.max(0,num($('#bo_amt').value)||0),minPct:Math.min(100,Math.max(0,num($('#bo_pct').value)??100)),noIssues:$('#bo_iss').checked,onTime:$('#bo_late').checked,via:$('#bo_via').value};
   const ref=A.db.doc('mgr/wages');if(await W(ref.update({bonus:v}).catch(()=>ref.set({rates:D.wages||{},bonus:v})))){D.bonusCfg=v;toast(v.perShift?`Bonus: ${money(v.perShift)} per shift`:'Shift bonus is off');closeSheet()}},
});

Object.assign(SORT,{
  fixed:ids=>ACT.fixedOrder(ids),
  types:ids=>{if(!SH?.T)return;typesGrab();const L0=SH.T.list;SH.T.list=ids.map(i=>L0[+i]);drawSheet()},
  tkitems:ids=>{if(!TK)return;tkGrab();const L0=tkList().slice();const t=TK.E[TK.cur];const vis=ids.map(i=>L0[+i]);let k=0;const shown=new Set(vis);const nl=L0.map(x=>shown.has(x)?vis[k++]:x);if(t.byDay)t.dayItems[TK.day]=nl;else t.items=nl;drawSheet()}});
boot();
</script>
