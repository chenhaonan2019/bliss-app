<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4E6B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BLISS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BLISS Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: phone-first app shell — sticky header, single scrolling column, fixed bottom tab bar, full-screen sheets for tasks */
:root{
  --bg:#F3F6EF; --surface:#FFFFFF; --sunk:#E8EEE2; --line:#D9E1D1;
  --ink:#1C2419; --muted:#626D5C; --brand:#4E6B45; --brand-ink:#FFFFFF; --matcha:#A7C06B;
  --ok:#1F8A55; --ok-bg:#DDF2E5; --warn:#B7700E; --warn-bg:#FCEBCB; --bad:#C0392F; --bad-bg:#F9DEDA; --info:#2C6A9E; --info-bg:#DCEAF6;
  --st0:#C9CFC4; --st1:#F2A93B; --st2:#2DB36F;
  --display:"Bricolage Grotesque","Figtree","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --body:"Figtree","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11160F; --surface:#1A2117; --sunk:#232B20; --line:#2F3A2B;
  --ink:#E6ECE1; --muted:#9AA592; --brand:#8DB27C; --brand-ink:#10170D; --matcha:#B9D07E;
  --ok:#5ACB8C; --ok-bg:#183626; --warn:#E9AE4E; --warn-bg:#3A2B12; --bad:#EE7A6E; --bad-bg:#3E1D19; --info:#7DB6E6; --info-bg:#172C3D;
  --st0:#3A4436; --st1:#C98A27; --st2:#249A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11160F; --surface:#1A2117; --sunk:#232B20; --line:#2F3A2B;
  --ink:#E6ECE1; --muted:#9AA592; --brand:#8DB27C; --brand-ink:#10170D; --matcha:#B9D07E;
  --ok:#5ACB8C; --ok-bg:#183626; --warn:#E9AE4E; --warn-bg:#3A2B12; --bad:#EE7A6E; --bad-bg:#3E1D19; --info:#7DB6E6; --info-bg:#172C3D;
  --st0:#3A4436; --st1:#C98A27; --st2:#249A5D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em}
.logo small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-top:3px}
.hbtn{background:color-mix(in srgb,var(--brand-ink) 16%,transparent);border:0;color:var(--brand-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flush{padding:0;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--sunk)}
.li .t{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.brand{background:var(--brand);color:var(--brand-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn:focus-visible,#ownsel,#locsel{max-width:52vw;appearance:auto;font-size:15px;padding:8px 14px}#ownsel option,#locsel option{color:#1C2419;background:#fff}
.hbtn:focus-visible,.tab:focus-visible,.li:focus-visible,.pill:focus-visible{outline:2px solid var(--matcha);outline-offset:2px}
.big{font-size:18px;min-height:58px;border-radius:16px}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatches label{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 2px;border-radius:12px;border:2px solid transparent}.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}.swatches .sw{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}.swatches small{font-size:11px;font-weight:600;color:var(--muted)}.swatches label:has(input:checked){border-color:var(--ink);background:var(--surface)}.swatches label:has(input:checked) small{color:var(--ink)}.swatches label:has(input:focus-visible){outline:2px solid var(--matcha)}
.seg.rad label{flex:1;position:relative;cursor:pointer}.seg.rad input{position:absolute;opacity:0;inset:0}.seg.rad span{display:block;text-align:center;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}.seg.rad input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}.seg.rad input:focus-visible+span{outline:2px solid var(--matcha)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 auto}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:center;min-width:52px}
.chips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chips button b{display:block;font-size:16px}
.chips button span{font-size:11px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--brand)}
.tab .bdg{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);min-height:44px}
textarea.in{min-height:80px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--matcha);border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sheet .sh h2{font-size:18px;flex:1;min-width:0}
.sheet .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .sb>.wrap{padding-block:16px 24px}
.sheet .sf{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px}
.sheet .sf .btn{flex:1}
.x{border:0;background:var(--sunk);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border-radius:12px;overflow:hidden;background:var(--sunk);border:1px dashed var(--line);aspect-ratio:4/3;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;text-align:center;padding:8px}
.tile.has{border:0;padding:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgb(0 0 0/.72));color:#fff;padding:18px 8px 6px;font-size:12px;text-align:left}
.tile .flag{position:absolute;top:6px;right:6px}
.tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tile.busy::after{content:"";position:absolute;inset:0;background:rgb(255 255 255/.5)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.thumbs img,.thumbs .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--sunk);display:block;cursor:pointer}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:inherit}
.tbl tbody tr{background:var(--surface)}
.tbl td.neg{color:var(--bad)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--st0)}
.bar i{display:block;height:100%}
.bar .b2{background:var(--st2)}.bar .b1{background:var(--st1)}
/* board (monday-style) */
.grp{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.grp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-left:6px solid var(--gc);cursor:pointer}
.grp-h h3{color:var(--gc);flex:1}
.grp-cols{display:grid;grid-template-columns:1fr 132px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 0 6px 14px;border-left:6px solid var(--gc);border-top:1px solid var(--line)}
.grp-r{display:grid;grid-template-columns:1fr 132px;align-items:stretch;border-top:1px solid var(--line);border-left:6px solid color-mix(in srgb,var(--gc) 45%,transparent)}
.grp-r .n{padding:11px 14px;font-weight:500}
.pill{border:0;border-left:1px solid var(--line);font-weight:700;font-size:13px;color:#fff;cursor:pointer;background:var(--st0)}
.pill.s0{color:var(--muted)}.pill.s1{background:var(--st1)}.pill.s2{background:var(--st2)}
.pill[disabled]{cursor:default}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.score{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.sig{width:100%;height:120px;border:1px dashed var(--line);border-radius:10px;background:var(--surface);touch-action:none;display:block}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pin button{height:62px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.pindots{display:flex;gap:12px;justify-content:center;margin:12px 0 20px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.pindots i.f{background:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0/.25)}
.viewer{position:fixed;inset:0;z-index:70;background:rgb(0 0 0/.92);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px));color:#fff;align-items:center}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:13px}
.hint.warn{background:var(--warn-bg);color:var(--warn)}
details.std summary{cursor:pointer;font-size:13px;color:var(--info);font-weight:600}
details.std ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.evarea{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:start}
.clock{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>


<header class="top"><div class="wrap" id="hdr"><div class="logo"><b>BLISS</b><small>Matcha &amp; Beyond</small></div></div></header>
<main><div class="wrap" id="view"><div class="empty"><b>Loading…</b>Connecting to the shop data</div></div></main>
<nav class="tabs" id="nav" hidden><div class="in" id="navin"></div></nav>
<div id="sheet"></div>
<div id="viewer"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
"use strict";
/* ---------- basics ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem('bliss.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('bliss.'+k,v)}catch(e){}}};
const curLang=()=>'en';
const L=(en,zh)=>curLang()==='zh'?zh:en;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ymd(new Date());
const bizDate=()=>{const n=new Date();if(n.getHours()<4)n.setDate(n.getDate()-1);return ymd(n)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const toMin=t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+(m||0)};
const atTime=(date,t)=>{const d=parseYmd(date);const[h,m]=(t||'0:0').split(':').map(Number);d.setHours(h,m||0,0,0);return d};
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const weekStart=s=>{const d=parseYmd(s);return addDays(s,-((d.getDay()+6)%7))};
const fmtT=t=>{if(!t)return'';if(curLang()==='zh')return t;const[h,m]=t.split(':').map(Number);return `${(h%12)||12}:${pad(m)}${h<12?'a':'p'}`};
const fmtD=(s,o={weekday:'short',month:'short',day:'numeric'})=>parseYmd(s).toLocaleDateString(curLang()==='zh'?'zh-CN':'en-US',o);
const fmtDT=iso=>{if(!iso)return'';const d=new Date(iso);return `${fmtD(ymd(d),{month:'short',day:'numeric'})} ${fmtT(hm(d))}`};
const fmtH=h=>(Math.round(h*100)/100).toFixed(2);
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||('x'+Math.random().toString(36).slice(2,7));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const WD=()=>curLang()==='zh'?['日','一','二','三','四','五','六']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ICON={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 box:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c1.8.8 3 2.5 3.5 5.2"/>',
 grad:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',
 left:'<path d="M15 6l-6 6 6 6"/>',
 check:'<path d="M5 12l5 5 9-10"/>',

function usageRows(){const CC=C();const ds=Object.keys(CC).sort();const byDate={};const recs=[];
  ORD().forEach(o=>{if(!o.receivedDate)return;(o.lines||[]).forEach(l=>{if(!l.itemId)return;const it=itemById(l.itemId);recs.push({d:o.receivedDate,id:l.itemId,q:(num(l.recvQty)??num(l.qty)??0)*(num(it?.packSize)||1)})})});
  D.items.forEach(it=>{let prev=null;ds.forEach(d=>{const v=num(CC[d].counts?.[it.id]);if(v==null)return;
    if(prev){const rec=recs.filter(x=>x.id===it.id&&x.d>prev.d&&x.d<=d).reduce((a,x)=>a+x.q,0);const r=byDate[d]||(byDate[d]={date:d,prev:prev.d,days:Math.max(1,diffDays(prev.d,d)),u:{},ud:{},rec:{}});
      r.u[it.id]=Math.round((prev.v+rec-v)*100)/100;r.ud[it.id]=Math.max(1,diffDays(prev.d,d));if(rec)r.rec[it.id]=rec;if(r.ud[it.id]<r.days){r.days=r.ud[it.id];r.prev=prev.d}}
    prev={d,v}})});
  return Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date))}
function avgDaily(itemId,rows){const r=rows.filter(x=>x.u[itemId]!=null);let days=0,use=0;for(let i=r.length-1;i>=0;i--){const dd=r[i].ud?.[itemId]||r[i].days;days+=dd;use+=r[i].u[itemId];if(days>=14)break}return days?use/days:null}
function itemUnitCost(it){if(!it)return null;const pk=num(it.packSize)||1;if(num(it.cost)!=null)return num(it.cost)/pk;
  const o=Object.values(D.orders).filter(o=>(o.lines||[]).some(l=>l.itemId===it.id&&num(l.price)&&num(l.qty))).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  if(!o)return null;const l=o.lines.find(l=>l.itemId===it.id&&num(l.price)&&num(l.qty));return num(l.price)/num(l.qty)/pk}
const orderTotal=o=>(o.lines||[]).reduce((a,l)=>a+(num(l.price)||0),0);
function invCost(ws,we){const rows=usageRows().filter(r=>r.date>=ws&&r.date<=we);let used=0,miss=new Set();rows.forEach(r=>Object.entries(r.u).forEach(([id,u])=>{const c=itemUnitCost(itemById(id));if(c==null){if(u)miss.add(id)}else used+=u*c}));
  const buy=ORD().filter(o=>o.date>=ws&&o.date<=we).reduce((a,o)=>a+orderTotal(o),0);let onHand=0;D.items.forEach(it=>{const q=stockQty(it.id)?.q,c=itemUnitCost(it);if(q!=null&&c!=null)onHand+=q*c});
  const byItem={};rows.forEach(r=>Object.entries(r.u).forEach(([id,u])=>{const c=itemUnitCost(itemById(id));if(c!=null)byItem[id]=(byItem[id]||0)+u*c}));
  return{used,buy,onHand,miss:miss.size,byItem,hasCounts:rows.length>0}}
function stockStatus(it,q){if(q==null)return['',L('Not counted','未盘点')];if(q<=0)return['bad',L('Out','缺货')];if(num(it.min)!=null&&q<=num(it.min))return['warn',L('Low','偏低')];return['ok','OK']}
function storeUrl(it){if(it.url)return it.url;const q=encodeURIComponent(it.name);if(it.store==='Walmart')return'https://www.walmart.com/search?q='+q;if(it.store==="BJ's")return'https://www.bjs.com/search/'+q+'/q';if(it.store==="Trader Joe's")return'https://www.traderjoes.com/home/search?q='+q;return''}
function suggestions(){return D.items.map(it=>{const q=stockQty(it.id)?.q;if(q==null)return null;const par=num(it.par),min=num(it.min);
  if(par==null||!(q<=(min??par)))return null;const need=par-q;if(need<=0)return null;const pk=num(it.packSize)||1;return{it,q,packs:Math.ceil(need/pk)}}).filter(Boolean)}
const nextWk=d=>addDays(weekStart(d||today()),7);
const availDue=d=>addDays(weekStart(d||today()),((D.settings.availDueDay??3)+6)%7);
function availState(emp,d){d=d||today();const wk=nextWk(d);const at=D.avail[emp]?.weeks?.[wk];const due=availDue(d);return{wk,due,at,st:at?'done':d<due?'todo':d===due?'due':'overdue'}}
function availRow(emp){const a=availState(emp);const c=a.st==='done'?chip('ok','Done'):a.st==='overdue'?chip('bad','Overdue'):a.st==='due'?chip('warn','Due today'):chip('',`Due ${fmtD(a.due,{weekday:'short'})}`);
  return `<div class="li tap" data-act="availSheet" data-id="${emp}" tabindex="0">${ic('cal')}<div class="grow"><div class="t">Fill availability for next week</div><div class="small muted">${fmtD(a.wk,{month:'short',day:'numeric'})} – ${fmtD(addDays(a.wk,6),{month:'short',day:'numeric'})}${a.at?' · sent '+fmtDT(a.at):` · due ${fmtD(a.due,{weekday:'long'})}`}</div></div>${c}${ic('chev')}</div>`}
const MGR_ONLY_FREQ=['weekly'];
function countRows(d,mgr){return usedFreqs().filter(f=>mgr||!MGR_ONLY_FREQ.includes(f)).map(f=>{const g=groupState(f,d);if(!g||g.st==='later')return'';const n=itemsOf(f).length;
  const t=f==='daily'?'Night inventory count':`${freqName(f)} inventory count`;
  const sub=g.st==='done'?`${esc(empName(g.by))} · ${fmtT(hm(new Date(g.at)))}`:`${n} items${g.last&&f!=='daily'?` · last ${fmtD(g.last.date,{month:'short',day:'numeric'})}`:''}`;
  const c=g.st==='done'?chip('ok','Done'):g.st==='overdue'?chip('bad','Overdue'):chip(f==='daily'?'':'warn',f==='daily'?'Tonight':'Due today');
  return `<div class="li tap" data-act="countSheet" data-f="${f}" tabindex="0">${ic('list')}<div class="grow"><div class="t">${t}${MGR_ONLY_FREQ.includes(f)?' <span class="chip" style="vertical-align:1px">Manager</span>':''}</div><div class="small muted">${sub}</div></div>${c}${ic('chev')}</div>`}).join('')}
function badgeCount(){if(mode()!=='mgr')return 0;return attention().length}
function attention(){const a=[];const t=bizDate();
  for(let i=0;i<3;i++){const d=addDays(t,-i);tasksOn(d).forEach(T=>{const s=taskState(d,T.type);if(s.filled&&['ontime','late','missed'].includes(s.st)&&!s.doc?.review)a.push({k:'review',d,type:T.type})})}
  ORD().forEach(o=>{if(o.status==='issue'&&!o.issueSeen)a.push({k:'order',o});if(o.status==='ordered'&&o.expected&&o.expected<t)a.push({k:'late',o})});
  const seen=+(ls.get('availSeen')||0);Object.entries(D.avail).forEach(([e,v])=>{if(v.updatedAt&&new Date(v.updatedAt).getTime()>seen&&D.employees[e]&&locOf(e)===curLoc())a.push({k:'avail',e})});
  if(t>availDue(t)){const nw=nextWk(t);emps().forEach(e=>{if(!D.avail[e.id]?.weeks?.[nw])a.push({k:'availMiss',e:e.id})})}
  Object.keys(D.pending).forEach(p=>{if(!D.links[p])a.push({k:'link',p})});
  Object.values(D.punches).forEach(p=>{if(!p.out&&p.date<t&&locOf(p.empId)===curLoc())a.push({k:'punch',p})});
  return a}

/* ---------- image upload ---------- */
async function compress(file){try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));return b||file}catch(e){return file}}
async function uploadImg(file){if(!A.assets){toast(L('Photo upload is not available on this account. Ask the manager.','此账号不能上传照片，请联系经理。'));return null}
  const b=await compress(file);const type=b.type&&['image/jpeg','image/png','image/webp','image/gif'].includes(b.type)?b.type:'image/jpeg';
  try{const r=await A.assets.upload(b,{type});return r.id}catch(e){console.warn(e);toast(errMsg(e));return null}}

function trainSelf(emp){const u=Object.entries(D.links).find(([k,v])=>v.empId===emp)?.[0];const r=u&&D.trainreq?.[u];return r&&r.empId===emp?(r.self||{}):{}}
function tStat(emp,k){const t=D.training[emp]||{};const m=t.status?.[k]||0;if(m===2)return 2;const mt=t.statusAt?.[k]||'';const sf=trainSelf(emp)[k];if(sf&&sf.at>mt)return sf.v;return m}

async function onTaskUpload(inp){const f=inp.files?.[0];if(!f)return;const{type,slot,date}=inp.dataset;const tile=inp.closest('.tile');tile&&tile.classList.add('busy');
  const id=await uploadImg(f);if(!id){tile&&tile.classList.remove('busy');return}
  const loc=curLoc();const ref=A.db.doc(`photoLogs/${loc}_${date}_${type}`);const me=actor()||'manager';const now=new Date().toISOString();const cur=photoDoc(date,type);
  const p={id,by:me,at:now};const photos={...(cur?.photos||{}),[slot]:p};const slots=slotsOf(type,date);
  const body={loc,date,type,photos:{[slot]:p},flags:{[slot]:false},updatedAt:now};
  if(slots.every(s=>photos[s.id]||cur?.checks?.[s.id])&&!cur?.completedAt){body.completedAt=now;body.completedBy=me}
  const wr=cur?ref.update(body):ref.set({...body,photos});
  if(await W(wr)){D.photos[`${loc}_${date}_${type}`]={...(cur||{}),...body,photos,flags:{...(cur?.flags||{}),[slot]:false}};toast(L('Photo saved','照片已保存'));drawSheet();render()}}

async function onTaskCheck(type,slot,date){const loc=curLoc();const ref=A.db.doc(`photoLogs/${loc}_${date}_${type}`);const me=actor()||'manager';const now=new Date().toISOString();const cur=photoDoc(date,type);
  const was=!!cur?.checks?.[slot];const checks={...(cur?.checks||{}),[slot]:was?null:{by:me,at:now}};const slots=slotsOf(type,date);
  const all=slots.every(s=>cur?.photos?.[s.id]||checks[s.id]);const body={loc,date,type,checks:{[slot]:was?null:{by:me,at:now}},updatedAt:now};
  if(all&&!cur?.completedAt){body.completedAt=now;body.completedBy=me}if(!all&&cur?.completedAt){body.completedAt=null;body.completedBy=null}
  const wr=cur?ref.update(body):ref.set({...body,photos:{},checks});
  if(await W(wr)){D.photos[`${loc}_${date}_${type}`]={...(cur||{}),...body,photos:cur?.photos||{},checks};drawSheet();render()}}

async function orderRead(){const st=SH_ORDER;if(!st.shots.length||!A.sample)return;st.msg2='';grabOrderLines();st.busy=true;st.msg='';drawSheet();
  const prompt=`You are reading one or more screenshots of the SAME online grocery or wholesale order (pages of one order; if items repeat across overlapping screenshots, list each product once) (usually BJ's Wholesale Club or Walmart) for a matcha and bubble tea shop.
Return JSON only, shaped exactly: {"store":"BJ's"|"Walmart"|"Glacier Point"|"Other","orderDate":"YYYY-MM-DD" or null,"deliveryDate":"YYYY-MM-DD" or null,"deliveryWindow":string or null,"deliveryAddress":string or null,"lines":[{"name":string,"qty":number,"price":number or null,"itemId":string or null}]}
deliveryDate is the scheduled or estimated delivery/pickup date shown (e.g. "Arrives Thu, Oct 16", "Delivery scheduled"); use the year of the order date if no year is shown; today is ${today()}. deliveryWindow is the time window shown, short form like "2pm-4pm", else null. deliveryAddress is the delivery or shipping address shown (or the billing address if no delivery address is shown), else null.
Rules: include only purchased products (no fees, tax, totals, savings). qty is the number of units/packs ordered as shown. price is the total paid for that line (qty times unit price) in dollars. Keep names short.
Set itemId to the id of the matching shop inventory item below when the product is clearly the same thing, otherwise null.
Inventory items: ${JSON.stringify(D.items.map(i=>({id:i.id,name:i.name})))}`;
  try{const lim=(await A.sample.limits().catch(()=>null))?.images?.maxCount||st.shots.length;const r=await A.sample.json(prompt,{images:st.shots.slice(0,lim).map(x=>x.blob),modelTier:'default'});if(st.shots.length>lim)st.msg2=`Only the first ${lim} screenshots could be read at once.`;
    if(r&&Array.isArray(r.lines)){if(r.store&&STORES.includes(r.store))st.store=r.store;{const ml=matchLoc(r.deliveryAddress);if(ml){st.loc=ml;st.locFound=true}}if(r.orderDate&&/^\d{4}-\d{2}-\d{2}$/.test(r.orderDate)){st.date=r.orderDate;st.expected=addDays(r.orderDate,1)}st.gotDel=false;if(r.deliveryDate&&/^\d{4}-\d{2}-\d{2}$/.test(r.deliveryDate)){st.expected=r.deliveryDate;st.gotDel=true}if(r.deliveryWindow)st.window=String(r.deliveryWindow).slice(0,40);
      st.lines=r.lines.filter(l=>l&&l.name).map(l=>({name:String(l.name).slice(0,120),qty:num(l.qty)??1,price:num(l.price),itemId:D.items.some(i=>i.id===l.itemId)?l.itemId:''}));

  st.busy=false;drawSheet()}

function evalTotal(){let t=0;EVAL.forEach(s=>s.areas.forEach(a=>{const el=$('#ev_s_'+a.id);let v=num(el?.value)||0;if(v>a.max){v=a.max}t+=v}));const te=$('#ev_total');if(te){te.textContent=t;const[k,l]=level(t);$('#ev_lvl').innerHTML=chip(k,l)}return t}
function sigPad(id){const c=$('#'+id);if(!c)return;const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2;x.lineCap='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink');let dn=false;c.dataset.drawn='';
  const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{dn=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};c.onpointermove=e=>{if(!dn)return;x.lineTo(...p(e));x.stroke();c.dataset.drawn='1'};c.onpointerup=()=>dn=false}
function sigData(id){const c=$('#'+id);if(!c||!c.dataset.drawn)return null;const o=document.createElement('canvas');const s=Math.min(1,400/c.width);o.width=c.width*s;o.height=c.height*s;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.filter='grayscale(1) brightness(0)';x.drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/png')}

/* ---------- auto-scheduling ---------- */
const PRIO=[['high','Preferred'],['normal','Normal'],['low','Less']];
const DEF_NEEDS=[{start:'11:00',end:'17:00',n:2},{start:'17:00',end:'22:30',n:2}];
function needsFor(loc,dow){const st=D.settings.staffing?.[loc];const l=st?.[dow];return Array.isArray(l)?l:DEF_NEEDS}
function availWin(emp,date){const a=D.avail[emp];if(!a)return'unknown';if((a.off||[]).includes(date))return'none';const w=(a.snap?.[weekStart(date)]?.weekly||a.weekly)?.[parseYmd(date).getDay()];if(!w||w.mode==='no')return'none';if(w.mode==='all')return'any';return `${w.from}-${w.to}`}
const sPrio=e=>D.schedCfg?.prio?.[e]||'normal';const sMax=e=>num(D.schedCfg?.maxHrs?.[e]);
const ovl=(a,b)=>a.date===b.date&&toMin(a.start)<toMin(b.end)&&toMin(b.start)<toMin(a.end);
function greedySchedule(ws,ems,keep,n){n=n||7;const out=[];const hrs={};keep.forEach(s=>{hrs[s.empId]=(hrs[s.empId]||0)+shiftHrs(s)});const rank={high:0,normal:1,low:2};
  for(let i=0;i<n;i++){const date=addDays(ws,i);needsFor(curLoc(),parseYmd(date).getDay()).forEach(nd=>{let have=keep.filter(s=>s.date===date&&s.start===nd.start&&s.end===nd.end).length;
    while(have<(nd.n||1)){const slot={date,start:nd.start,end:nd.end};const c=ems.filter(e=>availFor(e.id,date,nd.start,nd.end)==='yes'&&![...keep,...out].some(s=>s.empId===e.id&&ovl(s,slot))&&(sMax(e.id)==null||(hrs[e.id]||0)+shiftHrs(slot)<=sMax(e.id)))
      .sort((a,b)=>{const ta=[...keep,...out].some(s=>s.empId===a.id&&s.date===date)?1:0,tb=[...keep,...out].some(s=>s.empId===b.id&&s.date===date)?1:0;return ta-tb||rank[sPrio(a.id)]-rank[sPrio(b.id)]||(hrs[a.id]||0)-(hrs[b.id]||0)});if(!c.length)break;const e=c[0];out.push({...slot,empId:e.id});hrs[e.id]=(hrs[e.id]||0)+shiftHrs(slot);have++}})}
  return out}
function checkPlan(plan,ws,ems,keep,n){n=n||7;const we=addDays(ws,n-1);const warn=[];const ids=new Set(ems.map(e=>e.id));const hrs={};const all=[...keep];
  const ok=plan.filter((s,i)=>plan.findIndex(x=>x.empId===s.empId&&x.date===s.date&&x.start===s.start&&x.end===s.end)===i).filter(s=>{if(!ids.has(s.empId)||!(s.date>=ws&&s.date<=we)||!/^\d\d:\d\d$/.test(s.start)||!/^\d\d:\d\d$/.test(s.end))return false;return true}).map(s=>{const w=[];const av=availFor(s.empId,s.date,s.start,s.end);
    if(av!=='yes')w.push(av==='unknown'?'no availability on file':av==='partial'?'outside available hours':'not available');if(all.some(x=>x.empId===s.empId&&ovl(x,s)))w.push('double-booked');else if(all.some(x=>x.empId===s.empId&&x.date===s.date))w.push('second shift today');const h=shiftHrs(s);if(h<3)w.push('under 3 h');all.push(s);hrs[s.empId]=(hrs[s.empId]||0)+shiftHrs(s);return{...s,warn:w}});
  keep.forEach(s=>{hrs[s.empId]=(hrs[s.empId]||0)+shiftHrs(s)});const wk={};[...all].forEach(s=>{const k=s.empId+'|'+weekStart(s.date);wk[k]=(wk[k]||0)+shiftHrs(s)});ems.forEach(e=>{const m=sMax(e.id);if(m==null)return;Object.entries(wk).forEach(([k,h])=>{const[id,w]=k.split('|');if(id===e.id&&h>m)warn.push(`${e.name} is over ${m} h in the week of ${fmtD(w,{month:'short',day:'numeric'})} (${fmtH(h)} h)`)})});
  const gaps=[];const hhmm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
  for(let i=0;i<n;i++){const date=addDays(ws,i);const nds=needsFor(curLoc(),parseYmd(date).getDay());if(!nds.length)continue;const day=all.filter(s=>s.date===date);
    const lo=Math.min(...nds.map(n=>toMin(n.start))),hi=Math.max(...nds.map(n=>toMin(n.end)));let cur=null;
    for(let t=lo;t<hi;t+=15){const req=nds.filter(n=>toMin(n.start)<=t&&t<toMin(n.end)).reduce((a,n)=>a+(n.n||1),0);const have=day.filter(s=>toMin(s.start)<=t&&t<toMin(s.end)).length;const miss=Math.max(0,req-have);
      if(miss&&cur&&cur.missing===miss&&cur.e===t){cur.e=t+15}else{if(cur)gaps.push({date,start:hhmm(cur.s),end:hhmm(cur.e),missing:cur.missing});cur=miss?{s:t,e:t+15,missing:miss}:null}}
    if(cur)gaps.push({date,start:hhmm(cur.s),end:hhmm(cur.e),missing:cur.missing})}
  return{ok,warn,hrs,gaps}}

function asLoadDraft(){const dr=D.schedCfg?.drafts?.[curLoc()+'_'+AS.ws+'_'+AS.n]||(AS.n===7?D.schedCfg?.drafts?.[curLoc()+'_'+AS.ws]:null);AS.plan=dr?.plan||null;AS.summary=dr?.summary||'';AS.draftAt=dr?.at||null;AS.appliedAt=dr?.appliedAt||null;if(dr&&dr.keepExisting!=null)AS.keepExisting=dr.keepExisting;AS.msg='';AS.err=false}

function autoSheet(){const ws=UI.week&&UI.week>weekStart(today())?UI.week:nextWk();const ems=emps();AS={ws,n:7,plan:null,busy:false,msg:'',keepExisting:true,note:''};asLoadDraft();
  openSheet({title:()=>'Auto-schedule',body:()=>{const nw=AS.ws,NN=AS.n,ne=addDays(nw,NN-1);const weekAll=weekShifts(nw,NN);const existing=weekAll.filter(s=>!isAutoShift(s));const autoN=weekAll.length-existing.length;const keep=AS.keepExisting?existing:[];
   const aw=weekStart(nw);const sub=ems.filter(e=>D.avail[e.id]?.weeks?.[aw]).length;
   let res='';if(AS.plan){const C_=checkPlan(AS.plan,nw,ems,keep,NN);AS.checked=C_;

async function doClockIn(selfie,now){const me=actor();if(!me)return;if(openPunch(me)){toast(L('Already clocked in','已经打过卡'));return}now=now||new Date();const d=bizDate();
  const sh=shiftsOn(d,me);let best=null;sh.forEach(s=>{const dt=Math.abs(now-atTime(d,s.start));if(!best||dt<best.dt)best={s,dt}});
  let late=0;if(best){const m=(now-atTime(d,best.s.start))/6e4;if(m>(D.settings.lateGrace||0))late=Math.round(m)}
  const body={empId:me,loc:locOf(me),date:d,in:now.toISOString(),out:null,shiftId:best?.s.id||null,late,selfie:selfie||null};
  if(await W(A.db.doc('punches/'+uidGen()).set(body)))toast(late?L(`Clocked in · ${late} min late`,`已打卡 · 迟到 ${late} 分钟`):L('Clocked in. Have a great shift!','已打卡，上班愉快！'))}
async function doClockOut(id){const p=D.punches[id];if(!p)return;const out=new Date().toISOString();
  if(await W(A.db.doc('punches/'+id).update({out})))toast(L(`Clocked out · ${fmtH(punchHrs({...p,out}))} h`,`已下班 · ${fmtH(punchHrs({...p,out}))} 小时`))}
function empTimeSheet(emp,ps,pl){const pe=addDays(ps,pl-1);
  openSheet({live:true,title:()=>`${esc(empName(emp))} · ${L('Hours','工时')}`,body:()=>{const P=Object.values(D.punches).filter(p=>p.empId===emp&&p.date>=ps&&p.date<=pe).sort((a,b)=>a.in.localeCompare(b.in));
   return `<div class="small muted">${fmtD(ps)} – ${fmtD(pe)}</div><div class="card flush list">${P.map(p=>{const sh=D.shifts[p.shiftId];return `<div class="li tap" data-act="punchEdit" data-id="${p.id}">${p.selfie?`<img src="${BLOB}${esc(p.selfie)}" alt="" class="av" style="object-fit:cover;padding:0">`:''}<div class="grow"><div class="t">${fmtD(p.date)}</div><div class="small muted">${fmtT(hm(new Date(p.in)))} – ${p.out?fmtT(hm(new Date(p.out))):'?'}${sh?` · ${L('shift','排班')} ${fmtT(sh.start)}–${fmtT(sh.end)}`:''}${p.edited?' · '+L('edited','已修改'):''}</div></div>${p.late?chip('warn',L(`Late ${p.late}m`,`迟到${p.late}分`)):''}${p.out?`<b>${fmtH(punchHrs(p))}</b>`:chip('bad',L('No clock-out','缺下班卡'))}</div>`}).join('')||`<div class="empty">${L('No punches','没有打卡记录')}</div>`}</div>
   <button class="btn" data-act="punchNew" data-emp="${emp}">${ic('plus')} ${L('Add missed punch','补录打卡')}</button>`}})}
function punchSheet(id,emp){const p=id?D.punches[id]:{empId:emp,date:today(),in:null,out:null,late:0};const inT=p.in?hm(new Date(p.in)):'',outT=p.out?hm(new Date(p.out)):'';
  openSheet({title:()=>`${esc(empName(p.empId))} · ${L('Punch','打卡')}`,body:()=>`<label class="f">${L('Date','日期')}<input class="in" type="date" id="pu_date" value="${esc(p.date)}"></label>
   ${p.selfie?`<img src="${BLOB}${esc(p.selfie)}" alt="Clock-in selfie" style="max-height:240px;object-fit:contain;border-radius:10px;background:var(--sunk);cursor:zoom-in" data-act="viewPh" data-pid="${esc(p.selfie)}" data-cap="Clock-in selfie">`:''}
   <div class="g3"><label class="f">${L('In','上班')}<input class="in" type="time" id="pu_in" value="${inT}"></label><label class="f">${L('Out','下班')}<input class="in" type="time" id="pu_out" value="${outT}"></label><label class="f">${L('Late (min)','迟到(分)')}<input class="in" type="number" id="pu_late" value="${p.late||0}"></label></div>`,
   foot:()=>`${id?`<button class="btn bad" data-act="punchDel" data-id="${id}">${L('Delete','删除')}</button>`:''}<button class="btn pri" data-act="punchSave" data-id="${id||''}">${L('Save','保存')}</button>`,mount:()=>{SH.emp=p.empId}})}

/* ---------- exports ---------- */
const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
async function save(filename,data){if(!A.downloads){toast(L('Downloads are not available here','此处无法下载'));return}try{await A.downloads.save({filename,data})}catch(e){if(e?.code!=='declined'&&e?.code!=='cancelled')toast(L('Could not save the file','无法保存文件'))}}
function exportUsage(){const rows=usageRows();const head=['Date','From','Days',...D.items.map(i=>`${i.name} (${i.unit||''})`)];
  const lines=[head,...rows.map(r=>[r.date,r.prev,r.days,...D.items.map(i=>r.u[i.id]??'')])];save(`BLISS-usage-${today()}.csv`,lines.map(l=>l.map(csvCell).join(',')).join('\n'))}
function exportPay(ps,pl){const R=payroll(ps,pl);
  if(!seePay()){const lines=[['Employee','Date','In','Out','Hours','Late min']];Object.values(R).forEach(r=>r.P.forEach(p=>lines.push([r.e.name,p.date,p.in?hm(new Date(p.in)):'',p.out?hm(new Date(p.out)):'',fmtH(punchHrs(p)),p.late||0])));
    lines.push([]);lines.push(['Employee','Hours','Overtime hours','Scheduled hours','Late count']);Object.values(R).forEach(r=>lines.push([r.e.name,fmtH(r.hrs),fmtH(r.ot),fmtH(r.sched),r.late]));
    return save(`BLISS-hours-${ps}.csv`,lines.map(l=>l.map(csvCell).join(',')).join('\n'))}const lines=[['Employee','Pay method','Hours','Overtime hours','Payroll hours','Payroll rate','Payroll pay','Cash hours','Cash rate','Cash pay','Total pay','Late count','Late minutes','Scheduled hours','Photo tasks','On time','Missing clock-outs']];
  Object.values(R).forEach(r=>lines.push([r.e.name,r.type,fmtH(r.hrs),fmtH(r.ot),fmtH(r.pH),r.W.pay,r.payPay.toFixed(2),fmtH(r.cH),r.W.cash,r.cashPay.toFixed(2),(Math.round(r.pay*100)/100).toFixed(2),r.late,r.lateMin,fmtH(r.sched),r.tasks,r.onT,r.open]));
  lines.push([]);lines.push(['Employee','Date','In','Out','Hours','Late min']);Object.values(R).forEach(r=>r.P.forEach(p=>lines.push([r.e.name,p.date,p.in?hm(new Date(p.in)):'',p.out?hm(new Date(p.out)):'',fmtH(punchHrs(p)),p.late||0])));
  save(`BLISS-payroll-${ps}.csv`,lines.map(l=>l.map(csvCell).join(',')).join('\n'))}
function exportIcs(){const me=actor();const up=Object.values(D.shifts).filter(s=>s.empId===me&&s.date>=today());const f=(date,t)=>date.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  const ev=up.map(s=>{let ed=s.date;if(toMin(s.end)<toMin(s.start))ed=addDays(s.date,1);return['BEGIN:VEVENT',`UID:bliss-${s.id}@bliss`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART:${f(s.date,s.start)}`,`DTEND:${f(ed,s.end)}`,'SUMMARY:BLISS shift','BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:BLISS shift in 1 hour','END:VALARM','END:VEVENT'].join('\r\n')});
  save('BLISS-shifts.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BLISS//Shifts//EN',...ev,'END:VCALENDAR'].join('\r\n'))}

/* ---------- boot ---------- */
function subscribe(q,fn){try{return q.onSnapshot(s=>{fn(s);D.ready=true;rerender()},e=>console.warn('sub',e))}catch(e){console.warn(e)}}
const mapDocs=s=>Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
async function boot(){
  const c=window.claude;if(!c?.use){D.ready=true;render();return}
  const [db,user]=await Promise.all([c.use('db'),c.use('user')]);A.db=db;A.user=user;D.ready=true;
  if(!db){render();return}
  uid=user?await user.id():null;isMgr=user?await user.canEdit():false;isOwner=user?await user.isOwner():false;
  c.use('assets').then(x=>{A.assets=x;rerender()});c.use('sample').then(x=>{A.sample=x;rerender()});c.use('downloads').then(x=>{A.downloads=x;rerender()});
  subscribe(db.collection('config'),s=>{s.docs.forEach(d=>{const v=d.data();if(d.id==='former')D.former=v;if(d.id==='tasks')D.taskCfg=v.list||[];if(d.id==='itemTypes')D.itemTypes=v.list||[];if(d.id==='items')D.items=v.list||[];if(d.id==='settings')D.settings={...DEF_SET,...v};if(d.id==='photoSlots')D.slots={close:v.close||[],prep:v.prep||[],deep:v.deep||[],deepDays:v.deepDays||null};if(d.id==='training')D.trainCfg={sections:v.sections||[],docs:v.docs||[]}})});
  subscribe(db.collection('employees'),s=>{D.employees=mapDocs(s)});
  subscribe(db.collection('links'),s=>{D.links=mapDocs(s)});
  subscribe(db.collection('counts').orderBy('date','desc').limit(120),s=>{D.counts=mapDocs(s)});
  subscribe(db.collection('orders').orderBy('createdAt','desc').limit(150),s=>{D.orders=mapDocs(s)});
  subscribe(db.collection('photoLogs').orderBy('date','desc').limit(300),s=>{D.photos=mapDocs(s)});
  const from=addDays(today(),-100);
  subscribe(db.collection('shifts').where('date','>=',from),s=>{D.shifts=mapDocs(s)});
  subscribe(db.collection('punches').where('date','>=',from),s=>{D.punches=mapDocs(s)});
  subscribe(db.collection('availability'),s=>{D.avail=mapDocs(s)});
  subscribe(db.collection('training'),s=>{D.training=mapDocs(s)});
  subscribe(db.collection('trainreq'),s=>{D.trainreq=mapDocs(s)});
  if(isOwner)subscribe(db.collection('owner'),s=>{s.docs.forEach(d=>{if(d.id==='fixed')D.fixed=d.data().list||[];if(d.id==='sales')D.sales=d.data().weeks||{};if(d.id==='settings')D.ownerSet=d.data()})});
  if(isMgr){subscribe(db.collection('pending'),s=>{D.pending=mapDocs(s)});
    subscribe(db.collection('mgr'),s=>{s.docs.forEach(d=>{const v=d.data();if(d.id==='wages'){D.wages=v.rates||{};D.cashRates=v.cash||{};D.payCaps=v.caps||{};D.cashCaps=v.ccaps||{}}if(d.id==='settings')D.mgrSet={pins:{},...v};if(d.id==='sched')D.schedCfg=v})});
    subscribe(db.collection('mgr/evals/items'),s=>{D.evals=mapDocs(s)})}
  if(isMgr&&window.blissAccount?.ensureUsers){const k='acctSync',t=today();let last='';try{last=localStorage.getItem(k)||''}catch{}
    if(last!==t)setTimeout(()=>{const em=Object.values(D.employees).filter(e=>e.email&&e.active!==false).map(e=>e.email);
      window.blissAccount.ensureUsers(em).then(()=>{try{localStorage.setItem(k,t)}catch{}}).catch(e=>console.warn('acct sync',e))},3000)}
  if(uid&&!isOwner){const l=await db.doc('links/'+uid).get().catch(()=>null);if(!l?.exists){db.doc('pending/'+uid).set({at:new Date().toISOString()}).catch(()=>{})}}
  render();
  setInterval(()=>{if(!SH&&!typing($('#view')))render()},60000);
}
boot();
</script>
